name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Armar el paquete
        shell: pwsh
        run: |
          $out = "dist/PES21FX"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse package/PES21FX/* $out
          Copy-Item build/Release/PES21FX.dll $out
          Copy-Item package/PES21FX.lua dist/
          Copy-Item package/LEEME.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: PES21FX
          path: dist/

      # copia del paquete en la rama "build" (para instalarlo sin bajar el zip a mano)
      - name: Publicar en la rama build
        shell: pwsh
        run: |
          cd dist
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b build
          git add -A
          git commit -q -m "build $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
