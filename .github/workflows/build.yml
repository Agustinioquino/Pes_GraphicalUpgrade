name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        id: compilar
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # si fallo: publicar solo el log en la rama "buildlog" (los logs de Actions no siempre se pueden bajar)
      - name: Publicar log de error
        if: steps.compilar.outcome == 'failure'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path faillog | Out-Null
          Select-String -Path build.log -Pattern "error|warning C4" | ForEach-Object { $_.Line } | Set-Content faillog/errors.txt
          Copy-Item build.log faillog/
          cd faillog
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b buildlog
          git add -A
          git commit -q -m "fallo $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" buildlog
          exit 1

      # compila cada shader con fxc (el mismo compilador que usa el juego) y publica los errores en shadercheck.txt
      - name: Verificar shaders
        id: shaders
        shell: pwsh
        continue-on-error: true
        run: |
          $fxc = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { Write-Host "fxc no encontrado"; exit 0 }
          $bad = 0; $n = 0
          "" | Set-Content shadercheck.txt
          Get-ChildItem package/PES21FX/shaders/*_replace.txt | ForEach-Object {
            $n++
            $t = if ($_.Name -match '-ps_') { 'ps_5_0' } elseif ($_.Name -match '-vs_') { 'vs_5_0' } else { 'cs_5_0' }
            $r = & $fxc.FullName /nologo /T $t /E main /I package/PES21FX/shaders /Fo NUL $_.FullName 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $bad++; Add-Content shadercheck.txt ("==== " + $_.Name + "`n" + $r) }
          }
          Write-Host "shaders: $n, con errores: $bad"
          if ($bad -gt 0) { Get-Content shadercheck.txt; exit 1 }

      - name: Publicar errores de shaders
        if: steps.shaders.outcome == 'failure'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path faillog | Out-Null
          Copy-Item shadercheck.txt faillog/
          cd faillog
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b buildlog
          git add -A
          git commit -q -m "shaders $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" buildlog
          exit 1

      - name: Armar el paquete
        shell: pwsh
        run: |
          $out = "dist/PES21FX"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse package/PES21FX/* $out
          Copy-Item build/Release/d3d11.dll dist/
          Copy-Item package/LEEME.txt dist/
          Copy-Item -Recurse package/sider dist/sider

      - uses: actions/upload-artifact@v4
        with:
          name: PES21FX
          path: dist/

      # copia del paquete en la rama "build" (para instalarlo sin bajar el zip a mano)
      - name: Publicar en la rama build
        shell: pwsh
        run: |
          cd dist
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b build
          git add -A
          git commit -q -m "build $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
