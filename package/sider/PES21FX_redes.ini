; PES21FX_redes.ini - va en Sider\modules\ junto a PES21FX_redes.lua (se lee al abrir el juego y con la tecla 9).
; preset: juego (el del juego solo), reactiva (= reactive_nets_physics.lua), viva (el gol ondula mas y vuelve),
;         tv (mas pesada), personal (la seccion [personal]), tensa, suelta (abajo) o cualquiera que agregues
preset = reactiva
; red mojada: con lluvia en el partido la red pesa 35 % mas y frena un poco mas rapido (0 = como seca)
lluvia = 1

[personal]
; base = el preset del que parte; despues, solo los valores que quieras cambiar (los demas quedan como la base)
base = reactiva
; conservar = 0.99          ; velocidad que se conserva por paso (0.95 juego): mas = la onda dura mas
; peso = 0.25               ; caida en m/s2 (6 juego): mas = cuelga y vuelve con cuerpo
; golpe = 0.3               ; lo que conserva el punto que arrastro la pelota (1 juego): menos = el golpe se apaga
; blandura = 4              ; hilos mas elasticos (1 juego): la onda recorre la red
; holgura = 1.05            ; red mas suelta (1 juego); rige desde el partido siguiente
; pasadas = 2               ; vueltas de hilos por paso: mas = mas tensa (un poco mas de CPU)
; estiramiento = 1.2        ; cuanto se deja hundir por la pelota
; todos los nombres: ver la tabla P al comienzo de PES21FX_redes.lua


[estadios]
; id del estadio = preset (el id es el de Sider; sale en sider.log y en el overlay). Ejemplos:
; 9 = tensa
; 23 = suelta

; presets propios: [preset nombre], base = el preset del que parte y despues los valores a cambiar
[preset tensa]
base = reactiva
holgura = 1.0
peso = 0.6
pasadas = 4
blandura = 2.5
estiramiento = 1.12

[preset suelta]
base = reactiva
holgura = 1.1
peso = 0.45
golpe = 0.5
blandura = 5
estiramiento = 1.35
