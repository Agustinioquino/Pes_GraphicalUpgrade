; PES21 FX - English menu texts. Same [MenuX] / [KeyX] sections as PES21FX.ini; only the texts are read from here
; (section, title, desc, label and the label / help / options of slider, choice, cslider, cchoice and button).
; Ranges, formats and default values always come from PES21FX.ini. Language: Insert menu > language selector.

[KeyPESWrinkleToggle]
label = Ctrl+Shift+F12: improved expression wrinkles on/off (off = the game's original wrinkles)

[KeyPESWrinkleGain]
label = Ctrl+Alt+F12: wrinkle gain 0.7 / 1.4 / 1.0

[KeyPESMouthToggle]
label = Ctrl+Alt+Shift+F9: mouth interior improvements on/off

[KeyPESMouthDiag]
label = Ctrl+Alt+Shift+F8: debug (teeth blue / gums-tongue red / cavity green)

[KeyPESExprPhysics]
label = Ctrl+Alt+Shift+F11: expression physics on/off (blood, shine, translucency)

[KeyPESEyes]
label = Ctrl+Alt+Shift+F7: eye improvements on/off

[KeyPESShadowDef]
label = Ctrl+Alt+Shift+F6: shadow definition on/off

[KeyPESShadowFilter]
label = Ctrl+Alt+Shift+F5: shadow filter v2 -> PCSS (2) / original (0) / stable (1)

[KeyPESShadowPCSS]
label = Ctrl+Alt+Shift+F4: PCSS penumbra scale (mode 2 only)

[KeyPESKitShade]
label = Ctrl+Alt+Shift+F3: improved kit shading on/off

[KeyPESKitRelief]
