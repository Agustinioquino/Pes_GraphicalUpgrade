choice = x144 | LED rings (another shader) | No;Yes | The advertising rings of some stadiums use another shader. If something that isn't an advert lights up by itself, turn it off.

[MenuEquip]
section = Stadium
title = Boots and ball
desc = The material of boots and ball (synthetic leather, PU, studs). Specular antialiasing: roughness grows where the normal changes within the pixel, so highlights don't shimmer at a distance or in motion. With a wet pitch they look wet (less rough and slightly darker). And the mud the game already knows how to draw builds up with the match minutes, more if it rains.
slider = y143 | Specular antialiasing | 0 | 1 | 1 = no highlight shimmer. | %.2f
slider = z143 | Wet pitch | 0 | 1 | How wet they get with rain. | %.2f
slider = w143 | Mud over time | 0 | 1 | 0 = the game's; 0.5 = noticeable at the end of the match; 1 = a lot. | %.2f

[MenuMotor]
section = Stadium
title = Engine: more detail (memory patches)
desc = Changes inside the game engine, made in memory by the DLL (the exe is not touched, only with the known version). Model LOD: the engine decides which mesh to draw for each player, the crowd and the stadium according to their size on screen; this tricks it into keeping the detailed mesh further away (1.5 = 50 % further; costs some GPU). Sun shadows 5120: the shadow map goes from 4096 to 5120 (finer edges; the most that fits in DirectX 11 with the three cascades). Shadow resolution is read at startup: the game must be restarted. Camera cuts: the engine signals every shot cut (replays, kick-offs, close-ups) and effects that accumulate across frames restart right there.
slider = x142 | Model LOD (x) | 1 | 2.5 | 1 = as in the game. | %.2f
choice = y142 | Sun shadows | 4096 (game);5120 (finer, restart) |
choice = x161 | Engine camera cuts | Don't use;Use | The DLL reads from the engine when there is a camera cut (the same signal the game's antialiasing uses). In that frame the accumulated light bounce and occlusion start from zero, with no trail from the previous shot, and the stable exposure jumps to the new shot instead of settling over a second.

[MenuMuscle]
section = Body
title = Musculature (test)
desc = Grows or shrinks every player's muscles with the muscle bones of the game's own skeleton, after the engine fits them to each pose: the change shows instantly and the body keeps moving the same. Arms and legs thicken around their axis (length doesn't change); chest, back, abs and glutes bulge outwards. This switch turns on the four musculature cards. What these cards set applies to every player; "Musculature per player" gives one player their own values.
slider = x167 | General | 0.7 | 1.5 | Grows or shrinks every muscle at once (not the belly). It multiplies each slider of the other cards: 1 = as each slider. | %.2f
choice = x255 | Join neighbouring muscles | No (each on its own);Yes | No: each slider moves only its muscle ("Shoulders" only the deltoid). Yes: neighbours follow a little so no step is left (trapezius, upper chest and shoulder blade with the shoulder; armpit with the chest; side with the lats; neck base with the neck and trapezius; lumbar with the lower back).
choice = y166 | Clothing follows | No;Yes | Sleeves follow the arm and shorts the thighs, without changing their length. Otherwise the body can poke through the clothing.
choice = z170 | Elbows and knees follow | No;Yes | Elbow and knee grow a bit with the arm, forearm, thigh and calf, so no step is left where they meet (the kneecap barely changes).
slider = x172 | Muscle definition | 0 | 2 | How defined the muscles look on the skin (the relief of torso, arms and legs), without touching the pores. Separate from size. 1 = as in the game; 0 = smooth skin. Also per player ("Musculature per player" or the row in the Physique menu). | %.2f
choice = x163 | Clothing follows less | No;Yes | Shirt and shorts grow less than the muscle (otherwise the sleeve looks inflated when the biceps grows).
slider = y163 | How much clothing grows | 0 | 1 | 1 = same as the muscle; 0.8 = the sleeve grows 80 % (as a power); 0 = clothing doesn't change. | %.2f
slider = y255 | How much sleeves grow | 0 | 1.2 | How much of the arm's growth the sleeve receives (its own bone). 0.6 = the sleeve gains the same centimetres as the arm (it is further from the axis than the skin); 1 = grows like the muscle and looks inflated; 0 = the sleeve doesn't grow. | %.2f
slider = z255 | Clothing follows the body (physics) | 0 | 1.5 | With cloth physics on: the chest, back, abs, trapezius, shoulders and glutes enlarged by the musculature push the shirt and shorts just like the skin, so the body doesn't poke through. 1 = same as the skin; 0 = off. | %.2f
button = muscle_preset_1 | Body type: Slim | Sets the general cards to a slim body (every player without own values) and saves.
button = muscle_preset_2 | Body type: Athletic | A bit more muscle, defined abs and a slim waist, for every player without own values. Saves.
button = muscle_preset_3 | Body type: Strong | More muscle all over, a wrestler's neck and trapezius. Saves.
button = muscle_preset_4 | Body type: Heavy | Heavy: wide trunk and waist. Saves.
button = muscle_preset_5 | Body type: Bodybuilder | Lots of muscle: round shoulders, V-shaped back, high trapezius and slim waist. Saves.
button = muscle_reset | Back to the game's values | All the general musculature cards (size of each muscle, General, waist, hips, shoulder width, details and definition) go back to 1 = as in the game, and it saves. Players without own values look as Konami made them; those with own values ("Musculature per player") keep theirs.

[MenuManos]
section = Body
title = Hands (deformation)
desc = For TorsoBody hands. The game deforms the hand by blending bone matrices (that's why fingers get thin at the knuckles when bending and stay apart in a fist); with this the hand deforms with dual quaternions (keeps volume) and adds sculpted corrections that kick in according to how much each finger closes: knuckles show, fingers rest against each other and the veins on the back of the hand show more when making a fist. Also applied to the hand's shadow. Off = the hand exactly as the game deforms it.
slider = y300 | Knuckle volume | 0 | 1 | Dual-quaternion skinning. 0 = as in the game (fingers thin out when bending); 1 = they keep their volume. | %.2f
slider = z300 | Knuckles when closing | 0 | 2 | How much the metacarpal heads show with a closed fist. 1 = as sculpted. | %.2f
slider = w300 | Fingers resting together | 0 | 1.5 | In a fist, the fingers come together and rest against each other instead of leaving gaps. 1 = they touch. | %.2f
slider = x301 | Veins when closing | 0 | 2 | The veins on the back of the hand show more the more closed the hand is. 0 = no change. | %.2f

[MenuManosRelajadas]
section = Body
title = Relaxed hands
desc = In many animations the game leaves the fingers straight and stiff. With this, when the hand is open, the fingers bend a little like a really relaxed hand (the little finger more than the index, the thumb barely). If the game is already closing a finger (fist, grab, point, thumbs up) that finger stays as the game sets it. Also applied to the hand's shadow. Needs the "Hands (deformation)" card on (with its sliders at 0 the hand stays as the game's, just relaxed).
slider = y303 | Amount | 0 | 1.5 | How much the fingers of an open hand bend. 1 = a normal relaxed hand; 0 = as in the game. | %.2f
slider = z303 | Thumb | 0 | 2 | How much the thumb bends (multiplied by "Amount"). | %.2f
slider = w303 | Up to what closure | 0.1 | 0.8 | If the game already bends the finger more than this (0 = straight, 1 = fist), that finger isn't touched. Higher = half-closed hands relax too. | %.2f

[MenuUnasJugadores]
section = Body
title = Nails (players with their own texture)
desc = Many players with a real face bring their own arm texture (tattoos, hair, tone): that texture has the nails painted for the game's original hand, and on the TorsoBody hand the 3D nail is in another place, so the painted nail ended up half outside and the 3D nail looked skin-coloured. With this, on those players the old painted nail is erased (filled with the surrounding skin) and the 3D nail takes the nail colour from that same texture. Players with the TorsoBody skin don't change.
slider = y304 | Amount | 0 | 1 | 1 = the painted nail moves entirely to the 3D nail; 0 = as it was. | %.2f

[MenuSkinTonePlayer]
section = Body
title = Skin tone per player
desc = Chosen in Edit > Players > Physique > Musculature, "Skin" page (R1 to the last page), and saved per player in PES21FX\piel_jugadores.ini. The tone row shows the colour and X opens the game's palette with 30 skin tones (and "create colour" for a custom one); below there are known named tones (Monk scale 1..10), lightness, saturation and hue bars to fine-tune with the stick, and "Body matches the face colour": the mod measures the colour of the face and the body at the base of the neck and corrects the body to match (the face doesn't change). It really changes the tone (hue and saturation, not just brightness: light ones pinker and paler, medium ones cinnamon, dark ones reddish brown) and the same number looks the same on every player. It tints body and face skin, in the Physique menu and in matches. The mod records each player's game skin colour when you open their Physique menu: if a player had a custom tone from before, open their Physique once.
slider = y184 | Intensity | 0 | 1.5 | 1 = the chosen tone; less moves it closer to the game's colour. | %.2f

[MenuGlassUI]
section = Game menus
title = Glass in the Physique menu (Liquid Glass style)
desc = In Edit > Players > Physique (and its musculature and skin pages) the menu panels turn into glass like on the iPhone: the background shows blurred through the panel, with a shining edge, refraction at the borders and rounded corners. Text, icons and photos stay the same. The game's other menus stay as always (unless you choose "All menus").
slider = y189 | Frosting | 0 | 1 | 0 = the background is sharp; 1 = very blurred (text reads better). | %.2f
slider = z189 | Blur radius | 0.5 | 3 | How much the background blur spreads. | %.1f
slider = w189 | Panel tint | 0 | 1 | How much of the panel's original colour remains: less = more transparent. | %.2f
slider = x190 | Edge shine | 0 | 2 | The edge of light around the panel (stronger at the top left). | %.2f
slider = y190 | Refraction | 0 | 2 | How much the background bends near the edge, like thick glass. | %.2f
slider = z190 | Rounded corners (px) | 0 | 40 | Corner radius of rectangular panels. 0 = as in the game. | %.0f
slider = w190 | Top shine | 0 | 1 | A soft reflection at the top of each panel. | %.2f
slider = x191 | Opaque panels | 0.3 | 1 | 1 = solid panels stay solid (with shine); less = they turn into glass too. | %.2f
choice = x192 | Where | Physique menu only;All menus | By default only in Edit > Players > Physique. "All menus" takes it to every game menu and the match scoreboard.

[MenuMuscleHighlight]
section = Body
title = Musculature: highlight the selected muscle
desc = In Edit > Players > Physique, on the Musculature pages, the skin of the muscle of the selected row brightens and pulses slowly, like the glow of the face menus. It appears when you move between rows or change a value and fades out after a few seconds (or stays always). "General" highlights the whole body.
slider = y183 | Intensity | 0.2 | 1.5 | How much the skin brightens at the peak of the pulse. | %.2f
slider = z183 | Duration (s) | 0 | 15 | Seconds it stays after moving or changing a value. 0 = always. | %.0f
slider = w183 | Pulse (s) | 0.6 | 3 | How long each pulse takes: higher = slower. | %.1f

[MenuMusclePlayers]
section = Body
title = Musculature per player
desc = Own values for one player; everyone else keeps the general cards' values. Pick the player (in Edit > Players only the one you are editing appears; in a match or a replay you can pick anyone on the pitch), press "Give own values" and move their sliders: the change shows instantly, only on them, and is saved automatically in PES21FX\musculatura_jugadores.ini (by player id, works in every mode). The switches (clothing, elbows and knees) and muscle definition are shared by everyone. Also inside the game: in Edit > Players > Physique, the "Musculature" row (or R1) opens that player's pages: shoulders and arms (at the very top, "Body type": Slim, Athletic, Strong, Heavy, Bodybuilder or as in the game), chest, back and neck, abdomen and hips, legs (-50 to +50, in 0.01 steps) and skin (custom tone). L1 / R1 change page and Back returns.

[MenuMuscleAlive]
section = Body
title = Musculature: living muscles
desc = Turned on with "Musculature (test)". Muscles move with the body: the biceps bulges when the elbow bends, the shoulder and trapezius when the arm is raised, the hamstrings and calf when the knee bends. And the player breathes: chest, ribs, back and belly rise and fall, faster and deeper after a sprint (calming down gradually). Applies to every player, without changing their shape at rest.
slider = x263 | Flex with movement | 0 | 2 | How much the working muscles bulge. 0 = off; 1 = normal. | %.2f
slider = y263 | Breathing | 0 | 2 | How much the chest moves when breathing (about 2-3 mm at rest, up to 7 mm out of breath). 0 = off. | %.2f
slider = z263 | Out of breath after running | 0 | 2 | How much running gets them out of breath: they breathe faster and deeper. 0 = always calm. | %.2f
[MenuMuscleTexture]
section = Body
title = Musculature: textured muscles (veins)
desc = Goes with living muscles: when a muscle works, the skin shows it too. With the elbow bent the biceps and forearm relief gets stronger and the arm veins appear (cephalic, basilic, the one in the elbow crease and the forearm ones); with the arm raised, the shoulder; with the knee bent, hamstrings, calf and quadriceps. With a clenched fist (shouting or celebrating) the veins on the back of the hand show. Only on TorsoBody arms, legs and hands.
slider = y305 | Definition when working | 0 | 2 | How much more the working muscle relief shows. 0 = as always; 1 = twice the relief with the muscle fully working. | %.2f
slider = z305 | Arm veins | 0 | 2 | How much the arm veins show with the elbow bent or the arm raised. 0 = no veins. | %.2f
slider = w305 | Hand veins | 0 | 2 | How much the veins on the back of the hand show with a clenched fist. 0 = no veins. | %.2f

[MenuMuscleVariants]
section = Body
title = Musculature: torso and arms (heavy / athletic)
desc = Turned on with "Musculature (test)". Two new variants of the TorsoBody torso and arms. HEAVY: belly resting on the shorts, love handles and lower back rolls, sagging shapeless chest, abs almost gone, folds and fine stretch marks (a bit lighter), thicker smoother arms, veins less visible. ATHLETIC: narrow waist, V-shaped back, bigger defined trapezius, full chest with a defined lower edge, defined abs, serratus and Adonis belt, more defined arms with some veins. Changes the model (shape and normals) and the textures; the shirt follows with the cloth physics. This slider is for all players: each player can have their own (game Physique menu: first Musculature page, "Torso and arms" selector from Heavy 100 % to Normal to Athletic 100 %; or "Musculature per player"). Body types use it too (Athletic, Bodybuilder, Stocky...).
slider = z262 | Heavy / Athletic | 0.5 | 1.5 | 0.5 = fully heavy, 1 = the TorsoBody torso, 1.5 = fully athletic. Values in between blend. | %.2f
slider = y285 | Folds, stretch marks and lines | 0 | 2 | How strong the new textures are (heavy folds and stretch marks; athletic Adonis belt, serratus and trapezius). 0 = shape only. | %.2f
slider = z285 | Definition change | 0 | 2 | How much the muscles drawn on the skin go down (heavy) or up (athletic). 0 = as TorsoBody. | %.2f
choice = x289 | Sculpted torso and arms | No (as TorsoBody);Yes | For all torsos: the relief the TorsoBody normal map drew as lines (abs, pecs, serratus, grooves) moves into the mesh. On the arms: biceps, triceps, deltoids, elbow and forearm get real depth (shadow, silhouette, occlusion), and the normal body back stays smooth. Athletic gets it a bit deeper (1.25x) and heavy almost flat, with folds.
slider = x288 | Defined spine | 0 | 2 | For all torsos (with or without variant): the spine groove and the muscles beside it show more on the back, mostly low. Less on heavy, a bit more on athletic. 0 = as TorsoBody. | %.2f
choice = x286 | TorsoBody relief | As it was;Fixed | The TorsoBody relief textures (torso, arms, legs) came with the green channel inverted for the game: muscles looked lit from below, as if sunken (noticeable with more definition). Fixed = right way up, for all players and any variant.
choice = x307 | Relief limit | No;Yes | The sculpted mesh, the normal map and the definition add up: on athletic with high definition the grooves (sternum, pec edge, linea alba, elbow crease) got so steep they looked like black stains. With the limit, only what exceeds the maximum slope is softened; the rest of the relief is unchanged.
slider = y307 | Maximum slope | 30 | 80 | Degrees. 49 = natural; more = deeper, darker grooves; less = softer. | %.0f
choice = w320 | Torso under the shirt | No;Yes | Yes = the torso moves a few millimetres inwards (not the neck or arms), so it doesn't poke through tight shirts.
choice = y320 | What moves in | All skin under the shirt;Torso only | All skin = torso, shoulders, arm down to the elbow and neck down to the neckline together: no step at the neck or the arm.
slider = x320 | How far in (mm) | 0 | 20 | 8 = natural. Only when shirts are on screen: shirtless (Appearance menu, Physique, key 4) the torso stays whole automatically. | %.0f

[MenuTorsoArms]
section = Body
title = TorsoBody arms and thighs on real faces
desc = Real faces from the patch bring their own arm and thigh textures (the Konami 2048 atlas, with the tone each facemaker chose). The game used them on the arms, hands and thighs while the torso used TorsoBody's: hence the jump in tone and detail right at the sleeve line and on the thigh, with or without the mod. On = those draws use the TorsoBody texture of the player's tone (same as the torso). The tone is detected from the torso texture, so the arm can look like the face for an instant when a new player appears. Off = as it came (the face ones).
choice = y321 | Thighs too | No;Yes | Yes = thighs also take TorsoBody thigh_N (the face brings thigh_bsm.ftex).
slider = z321 | Forced tone | 0 | 6 | 0 = the player's torso tone (automatic). 1..6 = that game skin tone for everyone (for testing). | %.0f
choice = w321 | Write to log | No;Yes | Yes = PES21FX.log lists which draws were changed and which tone was detected (first 60).
choice = x327 | Body tone | The torso one;The face one | The face one = the real face arm texture is measured and torso, arms and thighs switch to the TorsoBody textures of that tone: the whole body with the same texture set and the face tone (also with "View original"). The torso one = the database skin colour.

[MenuTonoCuerpo]
section = Body
title = Torso tone matching the face (real faces)
desc = On real faces the arms and legs come from the face texture (its tone) and the torso from the database skin colour, which Konami didn't care about since it was under the shirt: white torso on a dark player, with and without shaders. On = before building the player, it gets the tone from PES21FX\tonos_piel.txt (or from shirtless_skin_map.bin). Still in testing: needs the log dump to locate the field.
slider = y324 | Field (offset) | 0 | 508 | Found from the log dump; 0 = touch nothing. | %.0f
slider = z324 | Field bit | 0 | 29 | | %.0f
choice = w324 | Dump to log | No;Yes | Yes = writes the data of the first 12 players and the Physique menu appearance.

[MenuCamisetaInterior]
section = Body
title = Hide the undershirt (see the body)
desc = When removing the shirt and sleeves with the SinCamiseta (shirtless) module, the kit undershirt (inner, inner_cap, inner_glove) and the high neck (highneck) are still there: they come inside the body package the game loads once at startup and the module can't hide them. They show in white at the sleeve line and the base of the neck. On = the DLL doesn't draw those meshes (recognised by size: 9990, 9714, 8640 and 960 indices; never skin meshes). Only for looking at the body: leave it off in matches.
choice = w323 | Log | No;Yes | Yes = writes each hidden mesh to PES21FX.log (first 40).

[MenuCollar]
section = Body
title = Real-face neck: join with the torso
desc = The Sider module cuts the face neck at the torso edge and blends it with a fixed colour per tone, which is not what the torso shows on screen (own texture, the player's own tone, "body the colour of the face"): it left a band of another colour with a visible edge. On = the last millimetres of the neck above the join take the colour of TorsoBody's own torso_N just below the join (neckline in front, nape behind), with the face detail and the player's body tone. Needs "TorsoBody arms and thighs on real faces" on (the tone comes from there).
slider = y322 | Band height (mm) | 5 | 60 | From the join upwards. 25 = like the Sider module blend. | %.0f
slider = z322 | Amount | 0 | 1 | 1 = the neck ends in the exact torso colour; less = partial blend. | %.2f
choice = w322 | Show the band | No;Yes | Yes = the band is painted red to see where it falls (debug).
slider = y323 | Sink the neck base (mm) | 0 | 12 | The cut neck edge goes under the torso skin and the smooth torso edge shows instead. 0 = as before. | %.1f
slider = z323 | Sink blend (mm) | 3 | 30 | From the join upwards, the neck returns to its place. | %.0f

[MenuSkinReal]
section = Body
title = Body skin (realistic)
desc = For the TorsoBody body (torso, arms and legs). Its gloss and translucency textures were even over the whole body and the skin looked like clay. Now the skin is satin: pores and fine lines break the gloss, the sternum, the back between the shoulder blades, the shoulders and the lower back shine a bit more (oilier skin), the sides are more matte, and light passes more through flesh (sides, rolls) than bone (sternum, collarbones, spine). A bit of flush on the upper chest and shoulders.
slider = y293 | Gloss | 0 | 2 | How shiny the skin is (1 = real skin; less = more matte). | %.2f
slider = x306 | Matte | -0.2 | 0.3 | Skin roughness: more = wider, softer highlight, like dry skin; less (negative) = smaller, stronger highlight, like skin with lotion or sweat. 0 = TorsoBody's, with zones. | %.2f
slider = z293 | Translucency | 0 | 2 | How much light passes through the skin (1 = normal). | %.2f
choice = x311 | Definition in the colour | No;Yes | Muscle shading in the torso skin colour, like the retouched torso_1 (top light over the relief): each body type with its own and the fine detail from the bsm alpha.
slider = y311 | Definition per body type | 0 | 2 | Athletic: more shadow under the pecs, between the abs, Adonis belt and back. Fat: softer, with belly folds. 1 = like torso_1; 0 = same as normal. | %.2f
slider = z311 | Fine detail (bsm alpha) | 0 | 2 | Pores and fine relief folds in the colour, from the torso_N_bsm alpha channel (0.5 = no change; can be retouched by hand in the alpha). 0 = off. | %.2f
choice = x326 | Shoulder seam | No;Yes | Next to the seam between arm and torso, on both sides, each texture's own relief and fine colour fade out and only the mesh shape remains (the two textures never match there: the line showed).
slider = y326 | Seam width | 0.01 | 0.06 | Metres on each side. | %.3f
slider = z326 | Strength at the seam | 0 | 1 | 1 = none of the own detail right at the seam. | %.2f

[MenuSinShort]
section = Body
title = No shorts (SinCamiseta)
desc = To look at the whole body in Edit mode: instead of the shorts goes the skin pelvis (real anatomy: hips, glutes with their crease and smooth front, welded to the torso and thighs; the bottom of the torso takes the same shape, without the waistband step). The body parts come inside common_package.fpk and the game loads it only once, at startup: choose "No shorts", press Save and RESTART the game. With the pelvis loaded the kit shorts are hidden and SinCamiseta key 4 (Sider overlay) shows or hides them (then re-enter the player). "With shorts" + restart = everything as before.
choice = x308 | When the game starts | With shorts;No shorts (pelvis) | Applied when the game restarts (Save first).

[MenuMuscleArms]
section = Body
