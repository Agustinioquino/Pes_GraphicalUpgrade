[MenuGrassMow]
section = Pitch and sky
title = Mowing, wind and footprints
desc = The mower cut is drawn on the base and on the blades at once (synthesised grain: a stripe that looks light from one side looks dark from the other, like on TV) and the stripes change with the camera angle; "The game's" keeps each stadium's own pattern. Wind comes in gusts travelling across the pitch in the cloud wind direction, with irregular fronts; each clump flutters at its own rhythm and light follows the blade curve, so gusts look like waves of sheen. Players flatten the grass where they step and the ball leaves a trail when rolling: blades bend and open outwards, the base changes tone and everything recovers by itself in a few seconds. When running, players kick up blade clippings that fly, fall and get carried by the wind (they receive the same light and shadow as the grass).
