[MenuMuscleTorso]
section = Body
title = Musculature: chest, back and neck
desc = Turned on with "Musculature (test)". Torso muscles grow outwards from the ribs: chest forwards, back backwards, lats sideways and trapezius upwards. Same as the game's "Chest, back and neck" page.
