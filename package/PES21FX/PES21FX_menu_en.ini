[MenuEditorLight]
section = Face
title = Test light in the editor
desc = In the editor and 3D menus the game lights with a flat frontal studio light, and skin can't be judged. With this on a test sun is added (day, afternoon or night) with a screen-traced shadow (nose on the cheek, chin on the neck), skin shine and backlit ears, and the studio light is lowered so the shadow shows. Only acts where the match sun doesn't run: in a match it changes nothing.
