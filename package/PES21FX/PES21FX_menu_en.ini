[KeyPESClothLight]
label = Alt+Shift+F1: kit fabric lighting on/off

[KeyPESClothSheen]
label = Alt+Shift+F2: fabric sheen strength 1.0 / 0.3 / 1.5 / 0.6

[KeyPESSweatShirt]
label = Alt+Shift+F3: sweaty shirt on/off

[KeyPESSweatShirtDebug]
label = Alt+Shift+F4: sweat debug (red zones / UV / normal)

[KeyPESSkyBright]
label = Alt+Shift+F5: sky brightness 1.0 / 0.6 / 1.3 / 0.8

[KeyPESClothDebug]
label = Alt+Shift+F6: kit debug (magenta = detected as kit fabric) / normal

[KeyPESGrassV2]
label = Alt+Shift+F7: natural grass colour on/off

[KeyPESGrassHue]
label = Alt+Shift+F8: grass yellow correction 1.0 / 0.0 / 0.6

[KeyPESKitShadowBias]
label = Alt+Shift+F9: shadow bias on kits 0.0006 / 0.0012 / 0 / 0.0003

[KeyPESWrinkleHiTex]
label = Ctrl+Alt+Shift+F12: remastered wrinkle textures on/off

[KeyPESSunToggle]
