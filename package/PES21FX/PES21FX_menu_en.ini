cchoice = sim.game_clock | Clock | Real time;Game clock (pause and slow motion) | 1 | With the game clock the cloth freezes when paused and slows in slow replays.

[MenuClothLod]
section = Cloth (physics)
title = Distance and performance
desc = How many players have simulated clothing and up to what distance. It's the biggest FPS cost.
cslider = lod.max_simulated | Players with simulated clothing | 4 | 30 | 24 | Closest to the camera first. On a slow PC, 12. | %.0f
cslider = lod.sim_distance | Maximum distance (m) | 20 | 250 | 250 | Beyond this there is no simulation. 160 covers the TV camera. | %.0f

[MenuDebugView]
section = Debug
title = Debug view
desc = Views to understand what's going on. "Sun and skin thickness": top right a sun compass (line and dot = where the sun is on screen; yellow dot = sun in front of the camera (backlight), light blue = behind the camera; orange bar = height above the horizon) and on the skin: red = thickness measured with the shadow map, green = light passing through, blue = side facing away from the sun. "Light bounce only" shows indirect light alone. "Contact shadows": the scene in grey and contact shadows in red (redder = darker). "Shadow resolution" draws the shadow map's internal values in blocks. Also with Ctrl+Alt+F11 (sun and skin) and Ctrl+Shift+F3 (bounce).
choice = w12 | View | None=0;Light bounce only=2;Sun and skin thickness=3;Contact shadows=4;Clouds (axes and opacity)=5;Shadow resolution=-3 | Applies instantly; go back to "None" to play.

[MenuDiagHooks]
section = Debug
title = New hooks (to track down crashes)
desc = To find what causes a crash: each switch removes one of the in-memory hooks the mod adds. Applied when the game restarts. "Watch the game code" logs if anything changes the exe code while playing (another mod or the game's protection) and, if the game crashes, leaves the bytes where it happened.
choice = x173 | Player tracking | No;Yes | Knows which player each body is (used by per-player musculature). Off, a player's own values only show in the Physique menu.
choice = y173 | Physique menu hooks | No;Yes | The "Musculature" row with its pages inside Edit > Players > Physique.
choice = w173 | Musculature bones | No;Yes | Hooks for the 32 muscle bones. Off, there is no musculature.
choice = z173 | Watch the game code | No;Yes | Compares the exe code every 2 seconds and logs changes (changes nothing in the game).
choice = w184 | Log character draws | No;Yes | Every 20 seconds logs one frame's player draws (to prepare per-player skin tone). Applies instantly.
choice = w191 | Log menu elements | No;Yes | Every 20 seconds logs the on-screen menu elements (size, texture, which became glass) to tune the menu glass. Applies instantly.
