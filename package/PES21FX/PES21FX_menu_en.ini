[MenuClothWind]
section = Cloth (physics)
title = Wind
desc = Wind on the clothing. The direction is also copied to the hair wind so they move together.
cslider = sim.wind_response | Wind response | 0 | 6 | 3.5 | 0 = no wind. Lower = with the player still the cloth doesn't lift as much. | %.2f
cslider = sim.wind_gust | Gusts | 0 | 5 | 3 | Lower = less pointless "up and down". | %.2f
cslider = sim.wind_x | Direction X | -3 | 3 | 2 | Only the ratio between X and Z matters. | %.2f
cslider = sim.wind_z | Direction Z | -3 | 3 | 0 | | %.2f
cchoice = sim.wind_in_menus | Wind in menus | No;Yes | 0 | Wind also in player edit and kit selection.

[MenuClothSim]
section = Cloth (physics)
title = Simulation
desc = Cloth weight, collision precision and game time.
cslider = sim.gravity | Gravity (cloth weight) | 6 | 15 | 9.81 | 9.81 = default. Higher = heavier cloth, hangs more. | %.2f
cslider = sim.substep_hz | Precision (substeps per second) | 240 | 960 | 480 | More substeps = more precise collisions (cloth doesn't get inside before colliding), at some extra cost. | %.0f
cslider = sim.collision_inset | Allowed sinking (m) | 0 | 0.01 | 0.004 | How far the cloth may sink below the original kit shape. 0 = none. | %.4f
