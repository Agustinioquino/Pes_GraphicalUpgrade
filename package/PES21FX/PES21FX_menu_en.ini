section = Colour
title = Vibrance (more colour without overriding the stadium LUT)
desc = Each stadium already has its colour LUT. Instead of raising the saturation of everything (which turns skin orange and kits neon), vibrance raises only dull colours: washed-out grass, pale sky, grey stands. Already saturated colours and skin barely change. "Grass green" livens only mid greens.
slider = x133 | Vibrance | 0 | 1 | 0.35 = a bit more colour; 0.7 = vivid.
slider = y133 | Grass green | 0 | 1 | 

[MenuTVLook]
section = Colour
title = TV look
desc = The curve of a broadcast camera: BT.709 encoding with a knee, which compresses highlights before white (white shirts in the sun, clouds and boards don't blow out) and gives the typical TV mid contrast. Replaces the game curve; can be blended with the stadium LUT to keep its colour.
slider = y154 | Blend with the stadium LUT | 0 | 1 | 0 = pure TV curve; 1 = LUT only.
slider = z154 | Midtone contrast | 0.8 | 1.5 | 1 = the camera curve as is.
slider = w154 | Highlight knee | 0.6 | 0.95 | Where highlights start being compressed. Lower = more detail in whites.
slider = y117 | Exposure (EV) | -3 | 3 | Shared with the AgX curve. | %.2f

[MenuTone]
section = Colour
title = Tone curve (AgX)
desc = Replaces the stadium PQ LUT with AgX, the neutral tone curve of current engines (Blender 4, Godot 4): highlights that desaturate instead of blowing out, colours that don't go neon, clean shadows. "Blend with the LUT" keeps part of the stadium's colour intent. It's the path to "real PES" without video-game saturation; try 0.25 blend and exposure 0.
choice = x117 | Curve | The game's (stadium LUT);AgX;AgX punchy | 
slider = y117 | Exposure (EV) | -3 | 3 | 0 = the game's. | %.2f
slider = z117 | Blend with the stadium LUT | 0 | 1 | 0 = pure AgX, 1 = LUT only.

[MenuLightCal]
section = Lighting
title = Calibrated light (light meter)
desc = Measures every frame the light the grass receives in sun and in shade (and skin and shirts) and adjusts ambient light so the sun/shade ratio matches a real clear sky for that sun height, like current engines do with physical units. With the sun at 40° on a clear day, sunlit ground gets about 5 times the light of shaded ground; the game gave ~2.6 (washed shadows, flat players). The measurement appears at the top of this tab and in capturas\luz.txt. Strength 0 = measure only.
slider = y126 | Strength | 0 | 1 | 0 = measure only; 1 = reaches the target.
slider = z126 | Target contrast | 0.5 | 1.6 | 1 = like a TV broadcast; 1.6 = physical (darker shadows). | %.2f
slider = w126 | Sky blocked by the stadium | 0 | 0.8 | Stands and roof block part of the sky: shade gets less light. 0.3 = typical stadium. | %.2f
slider = x127 | Sky-coloured shadow | 0 | 1 | Shade is lit by the sky (bluer than the sun): 0 = game colour; 0.5 = natural. Adds no light, only changes the colour.

[MenuExpStab]
section = Lighting
title = Stable exposure between cameras
desc = The engine changes exposure in each shot (close-ups, replays, player camera) and the pitch jumps in brightness. A TV camera exposes for the sunlit pitch and barely changes. With the light meter, the brightness of sunlit grass in this shot is compared with the last few seconds and the difference is corrected. With no sunlit grass on screen the last correction is kept. Needs "Calibrated light" on (it does the measuring).
slider = y129 | Strength | 0 | 1 | 0 = the game's exposure; 1 = fixed for the sunlit pitch.
slider = z129 | Memory (s) | 5 | 120 | How long it takes to follow a real light change (clouds, sunset). | %.0f

[MenuGTAO]
section = Lighting
title = GTAO: horizon-based ambient occlusion
desc = Replaces the game's simple SSAO (480x270, 8 bits) with GTAO (Jimenez 2016), the HBAO of current engines: for each pixel it searches several directions for the horizons blocking the sky around the normal and integrates the real visibility. Gives contact shadow under the feet, between the legs, armpits and kit folds, without halos or grey stains. At full resolution, with bilateral blur; the game's TAA cleans the rest.
slider = y132 | Blend with the game SSAO | 0 | 1 | 0 = game's only; 1 = GTAO only.
slider = z132 | Radius (m) | 0.2 | 1.5 | 0.6 = contact and folds; 1.2 = wide occlusion. | %.2f
slider = w132 | Strength | 0.5 | 2.5 | Occlusion power. | %.2f

[MenuSunDisc]
section = Lighting
title = Physical sun (disc and camera glare)
desc = The sun disc at its real size (0.53°) with limb darkening (brighter in the centre), and the glare as a TV camera sees it: a tail falling off with distance from the disc (sensor diffraction and bloom) plus a wide haze halo. Replaces the painted circle of "Visible sun" (which still controls size and intensity).
slider = y130 | Limb darkening | 0 | 1 | 0.8 = like the real sun.
slider = z130 | Glare | 0 | 2 | Camera glare tail.
slider = w130 | Surrounding haze | 0 | 2 | Wide halo (humid days).

[MenuAerial]
section = Lighting
title = Physical aerial perspective
desc = Distant things lose contrast and turn blue (Rayleigh scattering) and towards the sun turn white (Mie, haze), computed per pixel with real depth instead of the game fog. Subtle on clear days; with haze the opposite stand washes out like in a real broadcast.
slider = y131 | Extra haze | 0 | 3 | 0 = clean air.
slider = z131 | Reference distance (m) | 100 | 2000 | At that distance the haze covers ~63 %. | %.0f
slider = w131 | Strength | 0 | 1 | 

[MenuAtmo]
section = Lighting
title = Physical atmosphere (sun colour)
desc = The sun colour comes from atmospheric transmittance (Rayleigh and Mie scattering according to the air mass the light crosses, like UE/Frostbite physical skies): with a high sun nothing changes; as it lowers it turns orange and near the horizon red, with the real progression, instead of the hand-made warm tint of the day curve (which it replaces). Intensity is still driven by the day curve. Turbidity: 2 = clean air (purer colours), 6-8 = haze (more orange and earlier).
slider = y121 | Turbidity | 1.5 | 8 | 2.5 = clear day. | %.1f
slider = z121 | Strength | 0 | 1 | 1 = full physical colour.

[MenuSunShafts]
section = Lighting
title = Sun shafts (god rays)
desc = Screen-space sunlight scattering: from each pixel it marches towards the sun reading depth, and only the sky contributes light, so the rays come through gaps in the roof and between the stands and are cut by the players. Turns off automatically with the sun off screen, at night and behind volumetric clouds. Subtle by default (0.35): it's what UE5 and Frostbite do, not a filter.
slider = y119 | Intensity | 0 | 1 | 0.35 = subtle; 0.7 = hazy sunset.
slider = z119 | Length | 0.2 | 1 | Fraction of the way to the sun each ray travels. | %.2f
slider = w119 | Spread | 0.2 | 3 | 1 = half the screen around the sun. | %.1f

[MenuLook]
section = Colour
title = Modern look
desc = Soft highlights (no blow-out), split cool/warm toning, clarity and vignette.
slider = x6 | Soft highlights | 0 | 1.5 | Keeps the sky and white shirts from blowing out.
slider = y6 | Split toning | 0 | 1 | Slightly cool shadows and warm highlights, like on TV.
slider = z6 | Clarity (local contrast) | 0 | 1
slider = w6 | Vignette | 0 | 0.5

[MenuCAS]
section = Post-processing
title = Sharpening (CAS)
desc = Contrast-adaptive sharpening on the final image, without halos or white edges.
slider = x39 | Strength | 0 | 1
slider = x330 | Extra sharpness with a still camera | 0 | 1 | Added to the strength when the game's temporal antialiasing has been accumulating for a few frames (still camera): recovers the grass and ball the TAA erases. Needs "Engine camera" (x161). | %.2f
slider = y39 | Film grain | 0 | 1 | 1 = the game's, 0 = no grain.

[MenuTAA]
section = Post-processing
title = Game temporal antialiasing
desc = Replaces the game's TAA resolve shader. With a still camera the original averages history without limit and erases grass and ball; this gives it a floor and a narrower box. Off = the game's as is.
slider = x332 | Minimum alpha towards the current frame | 0 | 0.5 | 0.10 = history is worth about 10 frames, like a common TAA. 0 = no floor (like the game). Higher = sharper but more jaggies. | %.2f
slider = y332 | Neighbourhood box width | 0.25 | 2 | 1 = the game's. Less = history is clipped closer to the current frame (less ghosting, less averaging). | %.2f
slider = z332 | Extra alpha from contrast | 0 | 0.5 | Where the neighbourhood has a lot of fine contrast (grass, lines, seams) it averages even less. | %.2f

[MenuBloom]
section = Post-processing
title = Bloom v2
desc = Finer, more stable glow on lights and sky (no blocks or flicker).
slider = y40 | Flickering spot suppression | 0 | 1

[MenuDOF]
section = Post-processing
title = Depth of field v2
desc = Smoother bokeh without blocks in replays and close shots.
slider = x41 | Background blur amount | 0 | 2 | 1 = original.
slider = y41 | Curve | 0.5 | 3 | Above 1 = the mid plane stays sharper.

[MenuBokeh]
section = Post-processing
title = Real bokeh (lens)
desc = The blurred background is computed at full resolution with a lens disc: no washed-out stains or halos around the focused player, and stadium lights form bokeh discs. Visible in replays, close-ups and celebrations.
slider = y137 | Maximum radius (px at 1080p) | 4 | 24 | How much the background can blur. 12 = TV camera with telephoto; 20 = cinema. | %.0f
slider = z137 | Highlight boost | 0 | 2 | How much the discs of strong lights stand out. 0 = physical. | %.2f

[MenuMotionBlur]
section = Post-processing
title = Smooth motion blur
desc = The game computes motion blur at half resolution and pasted it with nearest pixel (steps on the edges of moving players and lines). Now it blends smoothly without hard cuts.
slider = y138 | Strength | 0 | 1.5 | 1 = the game's; 0 = no motion blur. | %.2f
slider = z138 | Minimum speed (px) | 0 | 10 | Below this on-screen speed there is no blur (3 = game). Higher = sharper image on slow pans. | %.1f

[MenuClothShirt]
section = Cloth (physics)
title = Shirt
desc = How the shirt hangs and moves on the body. F5 in game compares with the original clothing.
cslider = shirt.baggy | Looseness around the body (m) | 0 | 0.03 | 0.005 | 0 = original fit. 0.01 = 1 cm of air (the wind no longer flattens the back). 0.02 = clearly loose. | %.3f
cslider = shirt.tucked_baggy | Looseness with the shirt tucked in (m) | 0 | 0.03 | 0.01 | | %.3f
cslider = shirt.body_friction | Grip on the body | 0 | 0.3 | 0.02 | 0 = slides freely on the body, 0.2 = sticks (sweaty shirt). | %.3f
cslider = shirt.couple_min_gap | Minimum shirt-shorts gap (m) | 0 | 0.04 | 0.012 | Minimum distance between the shirt hem and the shorts: keeps it from passing through. | %.3f
cslider = shirt.couple_gap | Kept shirt-shorts gap (m) | 0 | 0.05 | 0.02 | Where they were already apart, keeps this distance. | %.3f

[MenuClothSleeves]
section = Cloth (physics)
title = Sleeves
desc = Sleeve stiffness and swing.
cslider = shirt.sleeve_pin | Sleeve shape | 0 | 0.4 | 0.1 | How much they keep their shape: 0 = as free as the rest of the shirt, 0.4 = stiff. Low values can make the end close up. | %.3f
cslider = shirt.sleeve_damping | Swing damping | 0 | 2 | 1.0 | Lower = sleeves follow the arm movement more; higher = they stop quickly. | %.2f

[MenuClothTight]
section = Cloth (physics)
title = Tight shirts
desc = For kits the game draws tight to the body.
cslider = shirt_tight.baggy | Looseness (m) | 0 | 0.02 | 0.005 | | %.3f
cslider = shirt_tight.body_friction | Grip on the body | 0 | 0.3 | 0.1 | | %.3f

