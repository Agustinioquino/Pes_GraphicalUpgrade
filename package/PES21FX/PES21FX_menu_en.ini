[MenuSunReal]
section = Lighting
title = Realistic sun
desc = The sun's colour changes with its height: warm and golden at sunset, warm white at noon.
slider = z4 | Colour realism | 0 | 1.5 | 0 = the game's original colour. 1 = changes with the sun's height.
slider = w4 | Sun intensity | 0.5 | 2 | How much direct light the sun gives. 1 = original, 1.2 = a bit stronger.

[MenuSunQuality]
section = Lighting
title = Quality sun
desc = The sun is no longer a point: it has a half-degree disc (or more if you want) and highlights reflect it at that size, with energy conserved. Light passing through ears and nose is computed from the REAL thickness (what the sun sees in the shadow map versus what the camera sees): they only light up when the sun is really behind.
slider = y64 | Sun diameter | 0 | 6 | In degrees. 0.53 = the real one; 0.9 = slightly softer highlights; 3+ = hazy sun. | %.2f
slider = z64 | Real transmission (shadow map) | 0 | 2.5 | How much light passes through thin areas according to the measured thickness. 0 = only the old directional one.
slider = w64 | Skin density | 5 | 80 | More = light passes through less (ears only); less = also nose and cheeks. 30 = natural. | %.0f

[MenuSunFree]
section = Lighting
title = Free sun (experiment)
desc = Moves the sun wherever you want to see how the light responds (skin, backlit transmission, grass, kits). It changes the sun's direction and colour in the lighting pass; cast shadows are still those of the match's real sun (the engine computes them earlier), so to experiment with transmission put the sun behind the player and look at the ears and nose.
slider = y101 | Azimuth | 0 | 360 | Direction on the plane (degrees). | %.0f
slider = z101 | Elevation | -5 | 90 | Height above the horizon (degrees). | %.0f
slider = w101 | Intensity | 0 | 3
slider = x102 | Warmth | 0 | 1 | 0 = the game's colour, 1 = sunset orange.

[MenuSunTurf]
section = Lighting
title = Sun on the grass
desc = Like a photo of the ball on the grass: each blade has its sunny side and casts a shadow on the ones behind, light passing through the blades comes out yellow-green and with a low sun the grass looks golden. Only changes the pitch and the blades, not the players.
slider = x313 | Shadows between blades | 0 | 1 | How much a blade's shadow darkens the one behind it (visible close up and at mid distance). 0 = off. | %.2f
slider = y313 | Light through the blades | 0 | 1 | Yellow-green tint of the light that passes through the blades. 0 = grey like the game. | %.2f
slider = z313 | Golden low sun | 0 | 1 | With a low sun (sunset), sunlit grass looks more golden. 0 = off. | %.2f
slider = x314 | Sky light in the grass shadow | 0 | 2 | The grass shadow receives the bluish sky light: 1 = like a sunny photo (shadow at ~1/4 of the sun); 0 = almost black as before. | %.2f

[MenuDayCurve]
section = Lighting
title = Day curve
desc = How the light changes with the sun's height (ideal with Daylight Engine, which moves the sun during the match). Between the "sunrise" angle and the "noon" angle the sun intensity, ambient light, fog and warmth are interpolated. With the sun on the horizon the "blue hour" kicks in. Does not touch floodlights at night.
slider = y65 | Sun at sunrise | 0 | 2 | Sun multiplier with a low sun. 0.8 = a bit weaker than the stadium file.
slider = z65 | Sun mid-morning | 0 | 2 | Halfway between the two angles.
slider = w65 | Sun at noon | 0 | 2 | With a high sun. 1.1 = a bit stronger than the original.
slider = x66 | Ambient at sunrise | 0 | 2 | Global light (sky + bounce) with a low sun. Less = deeper shadows at sunset.
slider = y66 | Ambient at noon | 0 | 2 | Global light with a high sun.
slider = z66 | Fog at sunrise | 0 | 3 | Haze density with a low sun. 1.6 = humid morning.
slider = w66 | Fog at noon | 0 | 3 | Haze density with a high sun. 0.8 = clean air.
slider = x67 | Warmth at sunrise | 0 | 1 | How orange the sun gets when it is low (adds to "Realistic sun").
slider = y67 | Blue hour | 0 | 1 | Bluish ambient tint with the sun right at the horizon.
slider = z67 | Sunrise angle | 1 | 40 | Sun height (degrees) where sunrise ends. | %.0f
slider = x109 | Daytime contrast | 0 | 1 | Raises the sun and lowers the ambient light at the same time (deeper shadows, stronger sunny side). 0 = as it was; 0.5 = real sunny day.
slider = w67 | Noon angle | 20 | 90 | Sun height (degrees) from which it is "noon". | %.0f

[MenuRim]
section = Lighting
title = Rim light on players
desc = With the sun behind the player, the outline (shoulders, arms, backlit hair) lights up like on TV. Skin and kits only, respects shadows and fades with distance.
slider = x46 | Strength | 0 | 1.5 | How bright the outline is. 0.45 = subtle, 1 = very marked.
slider = y46 | Rim width | 1.5 | 6 | Higher = thinner rim, hugging the silhouette. 2 = wide, 5 = very thin.

[MenuAtmosphere]
section = Lighting
title = Atmosphere with dynamic sun
desc = With a low sun (Daylight Engine or afternoon matches) the stadium light file leaves blue haze covering the background (mountains, single-colour stands) and a very dull sun. This desaturates and warms the distant haze according to the sun's height, and compensates the sun's strength at those hours. Does nothing at night with floodlights.
slider = x54 | Less blue haze | 0 | 1 | How much the distant haze is desaturated. 0 = the light file's; 1 = neutral grey.
slider = y54 | Stronger low sun | 0 | 2 | How much the sun is compensated when low. 0.6 = natural; 1.5 = strong sunset.
slider = z54 | Warm horizon | 0 | 1 | With a low sun, the haze turns orange instead of blue.

[MenuGlobalLight]
section = Lighting
title = Stadium global light
desc = The stadium's precomputed indirect light (the "bounce" that lights everything the sun doesn't touch). It is the engine's shader translated by PES21 FX: now you can set its strength, give it direction (more light on what faces the sky, less on what faces the ground) and decide how much occlusion dims it.
slider = x56 | Strength | 0 | 2.5 | Multiplies the global light. 1 = the stadium light file's. If the stadium looks flat, raise it; if players glow in shadow, lower it.
slider = y56 | Sky/ground contrast | -1 | 2 | What faces up gets more, what faces the ground less. 0 = flat like the original; 0.5 = natural.
slider = z56 | Occlusion weight | 0.25 | 2 | How much ambient occlusion dims the global light. 0.5 = original; 1 = darker crevices.

[MenuTowers]
section = Lighting
title = Floodlights (night)
desc = At night the game lights with a single dominant floodlight and players look flat. This adds virtual floodlights rotated around the stadium: several highlights on skin and kits and rims lit from different sides, like on TV. No shadows, only highlights and some wrap light. Does nothing by day.
slider = x55 | Highlights | 0 | 2 | Strength of the extra floodlights' highlights. 0.8 = natural; 1.5 = very marked TV night.
slider = y55 | Wrap light | 0 | 2 | How much diffuse light the extra floodlights add (fills the shadowed sides). 0.6 = natural.
choice = z55 | Extra floodlights | One;Two;Three | How many virtual floodlights besides the game's. Three = 4-tower stadium.

[MenuSkyLight]
section = Lighting
title = Sky light
desc = Hemispheric ambient: what faces up receives bluish light from the sky, what faces the ground does not. Blue by day, violet at sunset, almost nothing at night.
slider = x47 | Strength | 0 | 3 | How much light the sky adds. 1 = natural.
slider = y47 | How blue | 0 | 1 | 0 = neutral grey light, 1 = full sky blue.
slider = z47 | Engine sky colour + occlusion | 0 | 1 | 1 = the tint comes from the stadium's own horizon (fog) with a bluer zenith, and the sky light is occluded by AO.

[MenuAO]
section = Lighting
title = Improved ambient occlusion
desc = Folds and corners no longer turn a dirty grey: on light surfaces light bounces inside and on coloured ones it takes their tone. Shine fades in crevices according to roughness.
slider = z48 | Total strength | 0 | 1 | How much folds and corners darken. 0 = no occlusion, 1 = the game's.
slider = x48 | Colour bounce | 0 | 1 | 0 = the game's grey shadow. 1 = the shadow takes the surface colour (red shirt = reddish shadow).
slider = y48 | Specular occlusion | 0 | 1 | Dims the shine in crevices according to roughness and view angle. Avoids the plastic look.

[MenuGI]
section = Lighting
title = Light bounce (global illumination)
desc = A screen-space diffuse light bounce: a lit shirt tints the skin next to it, the pitch lights the legs. It is the most expensive effect on the list.
slider = w9 | Intensity | 0 | 2 | 0 = off (saves performance). 0.7 = soft, 1.6 = strong.
slider = w10 | Radius in metres | 0.5 | 4 | How far the bounce reaches. More radius = softer and a bit more expensive.

[MenuSkyRefl]
section = Lighting
title = Sky reflections
desc = Every surface reflects the physical sky (and, facing down, the sunlit grass): boots, ball, sweaty skin, billboards and backlit shirt edges. Smooth surfaces reflect sharply, rough ones a soft sheen. In crevices (armpits, between the legs, under the chin) the reflection fades with occlusion. Needs "Physical sky".
slider = y151 | Strength | 0 | 2 | 1 = physical.
slider = z151 | Reflection occlusion | 0 | 1 | How much the reflection fades in crevices. 1 = natural; 0 = no occlusion.
slider = w151 | Grass in reflections | 0 | 1 | What faces down reflects the lit grass.

[MenuGITemporal]
section = Lighting
title = Accumulated light bounce (temporal)
desc = The light bounce is computed at half resolution and accumulated across frames following the camera: almost noise-free, with more reach (the sunlit stand and light-coloured shirts tint what is next to them) and cheaper than the composition one. It restarts from zero at every camera cut (no trails). The base radius stays in "Light bounce".
slider = y153 | Extra radius | 1 | 3 | Multiplies the bounce radius. 1.5 = a bit further than before.
slider = z153 | Accumulated frames | 4 | 30 | More = cleaner but slower to follow fast changes. | %.0f
slider = w153 | Strength | 0 | 2 | 1 = the real bounce (with "Physical bounce"). 0 = uses the intensity of "Light bounce".
choice = x315 | Physical bounce | No;Yes | Each bouncing point contributes according to its real size, distance and angle: a lit wall or shirt next to you really shows, and what is blocked by another player doesn't arrive. The pitch is handled by "Grass light bounce" (with the stadium's green and the sun's shadow).
slider = y315 | Far reach | 0 | 8 | Up to how many times the radius the long bounce reaches (the lit stand and pitch into the shadows). 0 = no far bounce. | %.1f
slider = z315 | Far bounce strength | 0 | 2

[MenuGrassBounce]
section = Lighting
title = Grass light bounce
desc = The pitch sends greenish light upwards: the underside of legs, shorts and chin receives that bounce, like on TV.
slider = x42 | Strength | 0 | 3 | 1 = natural.
slider = y42 | How green | 0 | 1 | 0 = neutral light, 1 = grass green.
slider = z42 | Real ground | 0 | 1 | 1 = the bounce uses the REAL ground shadow around each player, taken from the sun's shadow map (world data: same with any camera and not recomputed on cuts), and the pitch green measured once per match. Standing in their own shadow or the stadium's they get less bounce. 0 = fixed green and no shadow.

[MenuFog]
section = Lighting
title = Stadium haze
desc = The fog/haze the game applies to everything that "washes out" the image. Less haze = more contrast and colour.
slider = x11 | Amount of haze | 0 | 1 | 1 = the game's, 0.55 = about half, 0 = no haze.

[MenuShadowPhys]
section = Shadows
title = Physical shadows (receiver plane, cascades, sun size)
desc = Three fixes to the sun shadow. Receiver plane: each filter sample is compared with the depth the surface has at that texel (no acne and the shadow stays attached to the foot). Cascade blending: at the border between two cascades the shadow blends instead of changing sharpness abruptly. Physical penumbra: in PCSS mode the penumbra width comes from the distance to the occluder and the sun diameter of the "Quality sun" group (a single knob for the hardness of all shadows).
choice = x87 | Receiver plane | No;Yes |
slider = y87 | Cascade blending (width) | 0 | 0.3 | Band at the edge of each cascade where it blends with the next one (fraction of the cascade size). 0 = no blending. 0.1 = natural. | %.2f
choice = z87 | Penumbra from sun size | No;Yes | PCSS mode only. The "PCSS penumbra" slider becomes a multiplier (200 = 1:1 physical).
slider = w87 | Receiver plane limit | 1 | 40 | Protection against edges and silhouettes: maximum adjustment per texel (x0.001). Raise it if acne remains on very grazing surfaces. | %.0f

[MenuMicroShadow]
section = Shadows
title = Micro-shadows (pores, folds and weave)
desc = With a grazing sun, skin pores, clothing folds and the fabric weave shadow themselves (Naughty Dog technique): grazing light stops looking flat. The aperture comes from ambient occlusion; it only acts on the lit side.
slider = x88 | Strength | 0 | 1 | 0.6 = natural, 1 = marked.

[MenuFlatLight]
section = Lighting
title = Flat light (test)
desc = Turns off the sun lighting: everything receives the same light, with no direction, shadows or highlights. Useful to see textures and materials as they are (also from the Inspector). Not for playing.
slider = y89 | Level | 0.2 | 3 | How much flat light. 1 = similar to an average day. | %.2f
choice = z89 | Specular highlights | Off;Keep | Keep leaves the sun's highlights (to evaluate materials).

[MenuShadowFilter]
section = Shadows
title = Sun shadow filter
desc = How the edges of the shadows cast by the sun are softened.
choice = y20 | Mode | Game original (8 samples);Stable (16 samples, clean edges);Realistic contact (PCSS) | Stable: no flicker. PCSS: sharp at the player's feet and softer as it moves away.
slider = z20 | Filter radius (texels) | 0.5 | 3 | 1.5 = same as the original. 1 = sharper, 2.5 = softer.
slider = x21 | PCSS penumbra | 30 | 1000 | How much the shadow widens with distance (PCSS mode only). | %.0f
slider = y21 | Maximum PCSS radius | 1 | 12 | Softness limit in PCSS mode.
choice = w21 | Pattern | Fixed;Rotate every frame (DLSS/TAA cleans it) | Rotating removes the visible pattern if you use DLSS or TAA.

[MenuShadowDef]
section = Shadows
title = Shadow definition
desc = Sharpens only the penumbra (the edge). Full shadow and full light do not change.
slider = x20 | Strength | 0 | 1 | 0.5 = moderate.

[MenuContact]
section = Shadows
title = Contact shadows
desc = Thin shadows traced on screen towards the sun, the ones the shadow map can't resolve: the neck under the chin, the arm over the torso, hair over the forehead, the boot against the grass. Only computed where there is sun (12 samples at most).
slider = x52 | Strength | 0 | 1.5 | How dark the shadow is. 0.7 = natural; 1 = marked.
slider = y52 | Length (m) | 0.05 | 1.5 | How far the shadow reaches. 0.35 = fine detail (face, hands); 0.8 = also the arm over the body. | %.2f
slider = z52 | Softness | 0 | 1 | 0 = always a hard edge. 1 = the further the occluder, the more penumbra (like a real shadow).

[MenuHeadShadow]
section = Shadows
title = Head self-shadow
desc = A high-resolution shadow map just for the 3 heads closest to the camera (1.8 mm per texel versus 2 cm in the stadium shadow map): nose, brows, chin and hair cast a readable shadow on the face in daylight. Only in matches with sun. Costs a few extra draws per frame.
slider = y309 | Strength | 0 | 1 | 1 = the head shadow as dark as the sun's. 0.7 = softer.
slider = z309 | Softness | 0 | 4 | Filter radius in atlas texels. 1 = thin edge; 3 = penumbra. | %.1f
slider = w309 | Bias | 0 | 5 | Offset so the skin does not shadow itself (acne). 1.5 = normal; if you see stripes, raise it. | %.1f

[MenuDynSun]
section = Shadows
title = Dynamic sun (Daylight Engine)
desc = For when the sun moves during the match (Daylight Engine module) and gets low. With a grazing sun the shadow map shows "acne" (stripes on the grass and the face) and the shadow edge crawls as it moves. The bias grows only where the surface is grazing to the light, so the shadow stays attached to the feet (contact shadows cover that).
slider = x53 | Slope bias | 0 | 4 | How much acne is corrected on grazing surfaces. 1.5 = normal. If you see stripes with a low sun, raise it; if the shadow detaches from the feet, lower it.
slider = y53 | Edge stability | 0 | 4 | Minimum filter radius in texels. Higher = softer edge that does not crawl while the sun moves. 1.5 = normal. | %.1f
slider = z53 | Bias limit | 0 | 5 | Limit so the bias never overshoots (at cascade changes). 1.5 = normal. | %.1f

[MenuKitShadowBias]
section = Shadows
title = Clean shadow on kits
desc = The sun shadow is computed with unsimulated clothing; this removes the shadow stripes that appeared on moving fabric.
slider = x30 | Bias | 0 | 0.0015 | If you see shadow stripes on the shirt, raise it little by little. | %.4f

[MenuSkinTone]
section = Skin
title = Real skin tone (all tones)
desc = All human skin falls in a narrow colour band (red > green > blue) that goes from pale pink to warm brown depending on melanin. The game's textures and the stadium light sometimes push it out of there (orange, yellowish or greenish-grey faces). This brings each skin's colour closer to the real band FOR ITS SAME LIGHTNESS: every player keeps their tone, it just stops looking tinted; painted beard, brows and hair are not touched. Scattering (SSS) also follows the tone: on light skin the shadow edge is reddish; on dark skin melanin absorbs that red and the penumbra stays warm brown, as in reality.
slider = y140 | Colour correction | 0 | 1 | 0 = the game's colour; 0.35 = natural; 1 = everything inside the real band. | %.2f
slider = z140 | SSS by tone | 0 | 1 | 0 = the same red scattering for everyone (as before); 1 = according to each skin's melanin. | %.2f
choice = w140 | Debug | No;Tone map (red = dark, blue = light) |

[MenuSkin]
section = Skin
title = Skin improvements (face)
desc = Skin with subsurface scattering, backlit transmission and dual-lobe specular. It is the base of everything in this tab.
slider = x | Translucency | 0 | 2 | How much light the skin lets through. 1 = natural, more = redder tone.
slider = y | Overall intensity | 0 | 2 | Strength of the whole set of skin improvements.
slider = x2 | Warmth of ears, nose and lips | 0 | 1 | Warm tint on thin areas.

[MenuBodySkin]
section = Skin
title = Body skin
desc = Arms, legs and neck get the same improvements as the face (skin light, cavities, sharpness).

[MenuCavity]
section = Skin
title = Face cavities
desc = Darkens folds and hollows from the normal map: ears, brow ridge, nostrils.
slider = x35 | Strength | 0 | 1 | 0.6 = natural.

[MenuSkinAmbient]
section = Skin
title = Ambient on the skin
desc = The stadium's ambient light is grey/greenish; on the skin it warms up a bit and occlusion takes a reddish tint.
slider = y11 | Ambient warmth | 0 | 1 | 0 = the stadium's grey.
slider = z11 | Reddish occlusion | 0 | 1 | Skin folds darken towards red, not grey.

[MenuFaceTex]
section = Skin
title = Face texture detail
desc = Forces the game to use the highest-resolution face and pore texture at a greater distance.
slider = x32 | Colour and shine | -2 | 0 | More negative = sharper (and a bit more shimmering).
slider = y32 | Normal map (pores) | -2 | 0 | More negative = pores visible from further away.

[MenuSkinSpecPhys]
section = Skin
title = Physical skin shine
desc = Skin shine is no longer yellow wax: it takes the sun's colour (not the material tint), is weak when looked at head-on and grows at the silhouette like real skin (Fresnel with skin F0), and can be lowered as a whole.
slider = x103 | Sun colour in the shine | 0 | 1 | 1 = the shine is white/solar, 0 = with the game material's tint.
slider = y103 | Skin Fresnel | 0 | 1 | 1 = weak head-on, strong at the edge of the face.
slider = z103 | Shine strength | 0.2 | 2 | Multiplies all of the skin's shine.

[MenuGenericFace]
section = Skin
title = Seamless generic faces
desc = Generic faces (the non-scanned ones) are made of two pieces: the face mask (FaceSKIN texture) and the head (neck, ears, nape), which the game draws with the body skin. The face skin effects used to stop abruptly at the edge: under the jaw the face was orange and the neck was not. With this the edge blends and the head gets the same treatment as the face (translucency, thin backlit ears, pores, sweat).
choice = y147 | Show the edge (debug) | No;Yes | Paints red the band where the face mask blends.

[MenuSSSS]
section = Skin
title = Light scattering in the skin (SSS)
desc = A single scattering for all the skin (27/10): the Burley profile used by Unreal 5 and Disney, in real millimetres, with a 16-sample disc that rotates every frame (the game's TAA smooths it). Red travels further than green and blue depending on the skin tone (dark skin barely reddens). Diffusion is only cut by what is not skin or leaves the surface, so pores and wrinkles don't stain it. With this on, the game's native SSS turns itself off. Off = the skin as before (z3, x3, y3, x34 come back).
slider = x95 | Width | 0.3 | 6 | 1 = real scale (red travels ~1 mm on average under light skin). 2 to 3 = similar to the game's native SSS at width 2 (softer, hides the shadow map edge).
slider = y95 | Strength | 0 | 1
choice = x331 | Rotate the disc every frame | No;Yes | Yes = the disc rotates every frame and TAA / DLSS smooths it (finer). No = fixed per pixel (no grain if you play without TAA).
slider = y100 | Guided by thickness (trm) | 0 | 1 | Ears, nose and lips scatter a bit wider; cheeks and forehead a bit less. 0 = the same on all the skin.
slider = x5 | Backlight (ears, nose) | 0 | 2 | How much light passes through ears and nose with the sun behind.
slider = y5 | Fine shine (oil/sweat) | 0 | 1.5 | A second, smaller and sharper shine.
slider = w5 | Fine shine by zone | 0 | 1 | Nose and forehead shine finer, cheeks more matte, no shine inside folds and mouth corners; from afar the pores don't shimmer. 0 = the same on the whole face.
slider = z64 | Backlight by real thickness | 0 | 2.5 | Light passing through according to the thickness measured with the sun's shadow: the ear lights up and the cheek doesn't.
slider = y76 | Areas that let light through | 0 | 1 | 0 = only ears, nostrils and lips; 1 = all the skin (looks orange). 0.35 = natural.
slider = z34 | Backlight colour | 0 | 1 | 0 = pure red; 1 = warm pink (the game's skin colour does the rest). 0.6 = natural.
choice = x62 | Face thickness map | No;Yes | Map made from real faces: adds thinness to ears, nostrils, lips and eyelids on top of the game's trm.
slider = y62 | Thinness of thin areas | 0 | 1 | How much the thickness map thins. 0.85 = natural.
slider = z95 | Depth cut-off | 0 | 4 | More = does not blend parts at different distances (nose against cheek).

[MenuSkinMicro]
section = Face
title = Pore micro normal
