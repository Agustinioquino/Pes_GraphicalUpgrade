slider = z298 | Remaining studio light (manual) | 0 | 1 | 0.55 = shadows are visible; 1 = the full editor light.
slider = w298 | Traced shadow | 0 | 1 | Shadow of the nose, brows and chin traced on screen towards the light. 0 = no shadow.

[MenuFaceFeatures]
section = Face
title = Facial features (hollows and folds)
desc = Compared with the original game, the modded face came out lighter with washed-out features: the multi-bounce of ambient occlusion lightens hollows on light surfaces (a 0.5 hollow became 0.72 on skin) and screen-space global illumination fills them. This makes skin occlusion deeper and without multi-bounce, and lowers the SSGI fill on skin only. Also the sun no longer stacks (day curve x realistic sun x daytime contrast gave 1.58x on players; now ~1.2x).
slider = x124 | Features | 0 | 1 | 0 = as before; 0.6 = the original's hollows and folds; 1 = marked.
slider = y124 | Skin marks | 0 | 1 | Moles, freckles, blemishes and small veins of the face texture more visible (it does not invent new marks). 0 = as in the game.

[MenuFaceLOD]
section = Face
title = Face LOD (highest detail mesh at a distance)
desc = The engine chooses on the CPU which mesh to draw for each player according to distance (LOD), and mods that patch bytes don't change that. This takes another route: the DLL learns, per face, the buffers of the most detailed mesh it saw and, when that face comes back with the reduced mesh, draws the most detailed one instead (only if the vertex shader and cbuffers match, so the skeleton is the same). Go through "Debug" first: it writes to the log, per face, how many vertices it is drawn with, with which shaders and at what distance it changes; that shows whether the engine uses several meshes or not. Facial expressions of distant players can't be forced from the GPU (the CPU doesn't compute them).
choice = x118 | Debug in the log (every 20 s) | No;Yes | Turn it off after reading the log: it costs some performance.
slider = z118 | Maximum distance (m) | 0 | 120 | 0 = always; e.g. 40 = only players closer than 40 m.
choice = w118 | Compatibility | Strict (same vertex shader);Permissive (same layout) | Permissive can deform badly if the skeleton differs.

[MenuFaceGen]
section = Face
title = Fifth texture (generated per face)
desc = The game gives the face shader four textures (colour, normal, shine and translucency). PES21 FX generates a fifth one live, for EACH face, from those four the first time it appears: cavities (folds, nostrils, mouth corners), curvature, real skin thickness (ears, nose, lips, eyelids) and the exact mask of beard, brows and hairline. It replaces the generic map where it exists. Already generated faces are redone when the match changes.
slider = y68 | Cavities | 0 | 1.5 | Darkens and reddens the face's fine hollows and makes them more matte. 0.7 = natural.
slider = z68 | Skin thickness | 0 | 1 | How much the generated thickness rules over the game's translucency (ears and nose let light through).
slider = w68 | Facial hair and hair | 0 | 1 | Beard, brows and hairline without skin shine or scattering.

