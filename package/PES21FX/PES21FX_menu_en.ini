[MenuHairTypes]
section = Face
title = Hair types (PES21FX_hair.ini)
desc = Each face gets a hair type (short, curly, afro, long, gel, blond, grey...) defined in PES21FX_hair.ini: length, curl, thickness, density, shine, root and tip colour, and brow multipliers. Strands grow from a HAIR MAP per face (png: red = density, green = length, blue = combing direction). The mod generates it from the face texture; "Dump hair maps" saves those maps to PES21FX\hair\auto\<id>.png together with lista.txt (id of each face): paint one, copy it to PES21FX\hair\<id>.png and assign the type in [caras]. The log says "pelo: cara <id> -> tipo".
button = hair_export | Dump hair maps | Writes PES21FX\hair\auto\<id>.png for every face already generated in this match (templates to edit) and lista.txt.
button = hair_reload | Reload hair types | Rereads PES21FX_hair.ini and applies the types to the faces already loaded.

