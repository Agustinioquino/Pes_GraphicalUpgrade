desc = Looseness, bounce and collision with the legs.
cslider = shorts.baggy | Looseness around the legs (m) | 0 | 0.04 | 0.015 | 0 = original fit, 0.04 = very loose. | %.3f
cslider = shorts.body_friction | Grip on the legs | 0 | 0.3 | 0.05 | | %.3f
cslider = shorts.world_motion | Bounce when jumping, landing or running | 0 | 1 | 0.4 | 0 = none, 1 = full bounce. | %.2f
cslider = shorts.leg_margin | Leg collision margin (m) | 0.003 | 0.02 | 0.0075 | Minimum cloth-to-leg distance. If the shorts go into the thigh, raise it gradually. | %.4f
