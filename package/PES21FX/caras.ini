; PES21 FX - perfiles por cara (expresiones por huesos). La DLL lo vuelve a leer solo si cambia (cada ~10 s).
; [nombre del perfil]
; id = <id del jugador, el de face\real\<id>>   (el log dice "caras: jugador <id> '<nombre>' -> ...")
; nombre = <parte del nombre del jugador, sin mayusculas>   (si el id no coincide)
; <gesto>.<hueso> = x y z   en MILIMETROS, ejes de la cabeza: x hacia la IZQUIERDA del jugador, y arriba, z adelante. Tope 4 mm.
;   gesto: neutra (siempre, por z356), enojo (x355), sonrisa (y355), asombro (z355), grito (x356), puchero (y356);
;   se SUMAN a los gestos del mod. Huesos: lip_b_l lip_b_r lip_b_c doublechin lip_s_l lip_s_r cheek_s_l cheek_s_r lip_t_l lip_t_c
;   lip_t_r lip_volume nose nosewing_l nosewing_r nasolabialfold_t_l nasolabialfold_t_r brow_i_l brow_i_r brow_o_l brow_o_r glabella
;   (_l = izquierda del jugador: para acercarlo al medio, x negativo; en _r al reves)

[Messi]
id = 7511
nombre = messi
; neutra (04/11, fotos de Agustin vs captura del juego): entrecejo apenas fruncido, cejas de afuera un poco menos caidas,
; labios apenas apretados y comisuras apenas abajo
neutra.brow_i_l = -0.4 -0.6 0
neutra.brow_i_r = 0.4 -0.6 0
neutra.glabella = 0 -0.4 -0.1
neutra.brow_o_l = 0 0.3 0
neutra.brow_o_r = 0 0.3 0
neutra.lip_s_l = -0.2 -0.4 -0.1
neutra.lip_s_r = 0.2 -0.4 -0.1
neutra.lip_b_c = 0 0.3 0.1
neutra.lip_t_c = 0 -0.1 0
; sonrisa (04/11 b, captura del juego vs fotos: en el juego la boca quedaba angosta, las comisuras casi sin subir y el ceno de la
; neutra seguia puesto): boca mucho mas ancha, comisuras bien arriba y atras, labio de arriba alto (dientes de arriba enteros),
; labio de abajo que baja, mejillas y surco marcados, y las cejas se relajan (se deshace el ceno de la neutra y suben un poco)
sonrisa.lip_s_l = 2.5 2.0 -1.0
sonrisa.lip_s_r = -2.5 2.0 -1.0
sonrisa.lip_t_l = 0.8 1.8 0
sonrisa.lip_t_c = 0 2.0 0.3
sonrisa.lip_t_r = -0.8 1.8 0
sonrisa.lip_b_l = 1.0 -1.0 0
sonrisa.lip_b_c = 0 -1.5 0
sonrisa.lip_b_r = -1.0 -1.0 0
sonrisa.cheek_s_l = 1.0 1.5 0.5
sonrisa.cheek_s_r = -1.0 1.5 0.5
sonrisa.nasolabialfold_t_l = 0.6 1.2 -0.5
sonrisa.nasolabialfold_t_r = -0.6 1.2 -0.5
sonrisa.nosewing_l = 0.3 0.6 0
sonrisa.nosewing_r = -0.3 0.6 0
sonrisa.brow_i_l = 0.5 1.0 0
sonrisa.brow_i_r = -0.5 1.0 0
sonrisa.brow_o_l = 0 0.4 0
sonrisa.brow_o_r = 0 0.4 0
sonrisa.glabella = 0 0.6 0.1
; grito de gol: cejas juntas, entrecejo marcado, labio de arriba alto
grito.brow_i_l = -0.6 0.6 0
grito.brow_i_r = 0.6 0.6 0
grito.glabella = 0 -0.4 -0.3
grito.lip_t_l = 0 0.6 0
grito.lip_t_c = 0 0.8 0
grito.lip_t_r = 0 0.6 0
grito.nosewing_l = 0.2 0.5 0
grito.nosewing_r = -0.2 0.5 0
; puchero: labio de abajo bien arriba
puchero.lip_b_c = 0 0.8 0.4
puchero.lip_s_l = 0 -0.6 0
puchero.lip_s_r = 0 -0.6 0
; enojo: ceno mas cerrado
enojo.brow_i_l = -0.3 -0.5 0
enojo.brow_i_r = 0.3 -0.5 0
