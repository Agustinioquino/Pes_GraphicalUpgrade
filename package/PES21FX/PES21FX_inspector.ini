; PES21 FX - Inspector visual (boton "Inspector" del menu). Define que partes se marcan en pantalla y que dice la ficha.
; Se relee con "Recargar config". Si falta el archivo, el mod usa esta misma lista por defecto.
;
; [una seccion por clase]
; ps     = hashes de pixel shader que forman la clase (separados por coma); el hash sale del catalogo
;          (shaders.txt), de la ficha "Desconocido <hash>" del propio inspector, o del nombre del archivo en shaders\
; nombre = lo que se muestra en la flecha
; que    = que hace el mod en esa parte (una linea)
; tN     = nombre del slot de textura N del juego (opcional; el inspector agrega tamano, formato y origen)
;
; [inspector]
; desconocidos = 1   marcar tambien (hasta 6) shaders de geometria que no estan en ninguna clase, con su hash,
;                    para poder agregarlos aca.

[inspector]
desconocidos = 1

[cara]
ps = 5ce3ed8702271bc1
nombre = Cara (piel)
que = SSS por zonas, arrugas, quinta textura (cavidades/poros), sudor, vello, semillas de cejas con hebras
t0 = difusa
t1 = normal (bsm)
t2 = srm
t3 = translucida
t4 = suciedad
t5 = normal de animacion
t6 = mascara de arrugas
t7 = mascara de rotacion
t15 = malla
t20 = arrugas normal (mod)
t21 = arrugas mascara (mod)
t22 = mapa SSS (mod)
t23 = quinta textura A (generada)
t24 = quinta textura B (generada)
t25 = zonas de cara (mod)
t26 = mapa de pelo (generado o hair\<id>.png)

[cuerpo]
ps = aa7d1833f6a11481
nombre = Piel del cuerpo
que = brazos, piernas y cuello con la misma luz de piel que la cara

[boca]
ps = 63fab7735eee149c
nombre = Boca (interior)
que = dientes, encias y lengua: oclusion, humedad, blancura

[pestanas]
ps = 0b3f9684ad026e54, 1fc2d9225371a498
nombre = Pestanas / cejas (alfa)
que = partes de la cara con transparencia; mas definicion

[pelo]
ps = 02f1d51037669342, c75f6047d5817df9
nombre = Pelo (tarjetas)
que = pelo del juego: inercia, viento, brillo anisotropico, hebras finas
t0 = difusa
t1 = normal
t2 = srm de pelo
t3 = translucida

[camiseta]
ps = 7e647d9c43b453f9, a41e7343f874154f, c7ae89b63e889007
nombre = Camiseta
que = tela (patron por tipo de kit), arrugas v3 por tension, costuras, mojado
t27 = patrones de tela (mod)

[short]
ps = 55297925e0c66085
nombre = Short / medias
que = relieve y oclusion de pliegues; inercia de medias (VS 1c9b)

[botines]
ps = 0cc62c9ee4d52538, ce188ae110354aea
nombre = Botines / guantes
que = (sin cambios del mod todavia)

[pasto]
