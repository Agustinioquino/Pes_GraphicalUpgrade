[MenuAtmo]
section = Iluminação
title = Atmosfera física (cor do sol)
desc = A cor do sol sai da transmitância atmosférica (espalhamento Rayleigh e Mie segundo a massa de ar que a luz atravessa, como os céus físicos de UE/Frostbite): com o sol alto nada muda; ao baixar fica laranja e perto do horizonte vermelho, com a progressão real, em vez do tom quente feito à mão da curva do dia (que substitui). A intensidade continua sendo dada pela curva do dia. Turbidez: 2 = ar limpo (cores mais puras), 6-8 = névoa (mais laranja e antes).
