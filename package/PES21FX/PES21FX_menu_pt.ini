[MenuEquip]
section = Estádio
title = Chuteiras e bola
desc = O material de chuteiras e bola (couro sintético, PU, travas). Antialiasing especular: a rugosidade cresce onde a normal muda dentro do pixel, assim os brilhos não tremulam de longe nem em movimento. Com o campo molhado ficam molhadas (menos rugosas e um pouco mais escuras). E o barro que o jogo já sabe desenhar se acumula com os minutos da partida, mais se chover.
slider = y143 | Antialiasing especular | 0 | 1 | 1 = sem tremulação dos brilhos. | %.2f
