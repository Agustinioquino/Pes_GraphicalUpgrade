[MenuCloudShadow]
section = Sombras
title = Sombra das nuvens no campo
desc = As nuvens volumétricas do céu projetam sua sombra no campo e nos jogadores, movendo-se com o vento. É a mesma camada (coerente com o que se vê em cima). Precisa de "Nuvens volumétricas" ligadas.
slider = z85 | Força | 0 | 1 | 0 = sem sombra de nuvens. 0.7 = natural (a luz difusa do céu continua chegando).

[MenuPhysSky]
section = Campo e céu
title = Céu físico
desc = O céu limpo sai de um modelo de atmosfera com o sol real de cada momento: azul profundo no alto, horizonte claro, mais branco ao redor do sol; com o sol baixo o horizonte esquenta e o zênite fica mais azul. Seu brilho está ligado ao sol do jogo. As nuvens pintadas do estádio são mantidas e um céu encoberto não é tocado. A cor da luz que preenche as sombras e da luz do céu sai do mesmo modelo (mais azul que o sol, muito mais com o sol baixo). Só de dia.
slider = y149 | Brilho do céu | 0.3 | 3 | 1 = físico (ligado ao sol do jogo). Se o céu ficar muito escuro ou estourado em relação ao campo, ajuste aqui.
slider = z149 | Quanto substitui | 0 | 1 | 1 = céu do modelo; 0 = o do estádio.
choice = w149 | Nuvens do estádio | Não (céu limpo)=0;Sim, mantê-las=1 | As nuvens pintadas no céu do estádio ficam sobre o céu novo.

