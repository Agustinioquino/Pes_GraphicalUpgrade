[MenuMuscleTorso]
section = Corpo
title = Musculatura: peito, costas e pescoço
desc = Liga com "Musculatura (teste)". Os músculos do tronco crescem para fora a partir das costelas: o peito para a frente, as costas para trás, os dorsais para os lados e o trapézio para cima. Igual à página "Peito, costas e pescoço" do jogo.
slider = y165 | Peito | 0.7 | 1.5 | Peitorais, com a axila da frente. | %.2f
