section = Campo e céu
title = Desgaste e estado do chão
desc = O desgaste vai de um campo profissional a um terrão: zonas de uso (bocas do gol e círculo central mais gastos), gramado seco amarelo palha e pelado (terra sem folhas, também na base). Desgaste ao vivo: o campo vai se gastando durante a partida onde se joga (a DLL pinta um mapa com a posição de cada jogador, mais correndo que parado): folhas amassadas e secas e, no máximo, terra; apaga-se ao começar outra partida e se soma ao desgaste fixo. Estado do chão: em Automático toma a chuva da partida (precisa do módulo do Sider PES21FX_match.lua) e deixa o gramado úmido (mais escuro e saturado, com brilho de água); Seco = palha e fosco. Diagnóstico: 2 = desgaste em cores (vermelho seco, verde terra); 1 = uv do atlas; 3 = normal por folha.
slider = w104 | Desgaste (profissional a terrão) | 0 | 1 | 0 = campo impecável; 0.3 = fim de temporada; 1 = terrão.
slider = x107 | Zonas de uso | 0 | 2 | 1 = as bocas do gol e o centro se gastam primeiro.
slider = y107 | Amarelo seco | 0 | 1.5 | Quanto amarela o gramado gasto.
slider = z107 | Pelado (terra) | 0 | 1.5 | 0 = nunca fica terra à vista.
choice = w115 | Desgaste ao vivo | Não;Sim | O campo se gasta durante a partida onde se joga (como no FC 24).
slider = x115 | Velocidade do desgaste ao vivo | 0 | 3 | 1 = numa partida inteira o centro e as áreas ficam marcados; 3 = terrão em 20 minutos.
slider = y115 | Raio da pisada (m) | 0.3 | 2 | 0.7 = natural.
slider = z115 | Pelado no máximo | 0 | 1 | Quanto fica terra à vista onde mais se jogou.
choice = w292 | Desgaste ao vivo mais visível | Não;Sim | O desgaste ao vivo aparece com poucos minutos de jogo (antes quase não se via).
choice = x292 | Afundamento do jogo | Não;Sim | As folhas se enterram onde o estádio marca linhas, áreas gastas ou sem gramado, como o gramado original.
slider = y292 | Linhas limpas | 0 | 1 | Enterra as folhas sobre a pintura das linhas. 1 = linhas limpas. Com "Linhas pintadas nas folhas" as folhas pintadas não se enterram. | %.2f
choice = x295 | Linhas pintadas nas folhas | Não;Sim | Sim = a pintura das linhas tinge os tufos: folhas brancas em pé sobre a linha, com a borda irregular e algumas verdes aparecendo (não um decalque plano). Não = as linhas enterram as folhas.
slider = w295 | Claridade da pintura | 0.5 | 1 | Quão branca é a pintura nas folhas. 0.72 = natural (a base usa 0.8; em pé sob o sol rasante recebem mais luz e com 0.85 saíam estouradas). | %.2f
choice = z292 | O desgaste rareia as folhas | Não;Sim | Onde está pelado ou muito jogado se apagam folhas aleatórias e aparece o chão gasto.
