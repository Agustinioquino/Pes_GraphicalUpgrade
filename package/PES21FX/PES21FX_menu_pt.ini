choice = y287 | Tipo de ombros | Normais=1;Estreitos=2;Largos=3;Redondos=4 | Soma-se aos outros valores do ombro. Redondos = deltoides maiores na frente e atrás. No menu Físico: "Tipo de ombros".
slider = z287 | Tamanho dos ombros | 0.7 | 1.3 | O ombro inteiro maior ou menor: deltoides, largura, trapézio e clavícula juntos. No menu Físico: "Tamanho dos ombros". | %.2f
