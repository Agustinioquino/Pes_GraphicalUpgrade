[MenuLightCal]
section = Iluminação
title = Luz calibrada (fotômetro)
desc = Mede a cada quadro a luz que a grama recebe ao sol e à sombra (e a pele e as camisas) e ajusta a luz ambiente para que a proporção sol/sombra seja a de um céu limpo real para aquela altura do sol, como fazem os motores atuais com unidades físicas. Com o sol a 40° num dia limpo, o chão ao sol recebe cerca de 5 vezes a luz do chão à sombra; o jogo dava ~2.6 (sombras lavadas, jogadores planos). A medição aparece no topo desta aba e em capturas\luz.txt. Força 0 = só medir.
slider = y126 | Força | 0 | 1 | 0 = só medir; 1 = chega ao alvo.
slider = z126 | Contraste alvo | 0.5 | 1.6 | 1 = como uma transmissão de TV; 1.6 = físico (sombras mais escuras). | %.2f
slider = w126 | Céu tapado pelo estádio | 0 | 0.8 | Arquibancadas e teto tapam parte do céu: a sombra recebe menos luz. 0.3 = estádio típico. | %.2f
slider = x127 | Sombra com cor de céu | 0 | 1 | A sombra é iluminada pelo céu (mais azul que o sol): 0 = cor do jogo; 0.5 = natural. Não soma luz, só muda a cor.

[MenuExpStab]
section = Iluminação
title = Exposição estável entre câmeras
desc = O motor muda a exposição em cada plano (closes, replays, câmera do jogador) e o campo pula de brilho. Uma câmera de TV expõe para o campo ao sol e quase não muda. Com o fotômetro, o brilho da grama ao sol neste plano é comparado com os últimos segundos e a diferença é corrigida. Sem grama ao sol na tela, mantém-se a última correção. Precisa de "Luz calibrada" ligada (é ela que mede).
slider = y129 | Força | 0 | 1 | 0 = a exposição do jogo; 1 = fixa para o campo ao sol.
slider = z129 | Memória (s) | 5 | 120 | Quanto demora para seguir uma mudança real de luz (nuvens, entardecer). | %.0f

[MenuGTAO]
section = Iluminação
title = GTAO: oclusão ambiente por horizontes
desc = Substitui o SSAO simples do jogo (480x270, 8 bits) por GTAO (Jimenez 2016), o HBAO dos motores atuais: para cada pixel procura em várias direções os horizontes que tapam o céu ao redor da normal e integra a visibilidade real. Dá sombra de contato sob os pés, entre as pernas, axilas e dobras do uniforme, sem halos nem manchas cinzas. Em resolução completa, com desfoque bilateral; o TAA do jogo limpa o resto.
