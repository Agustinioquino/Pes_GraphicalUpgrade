choice = w123 | Tufos próprios | Perto e média distância;Só perto | Até onde se usam os tufos curvos do mod em vez dos cartões planos do jogo.
slider = x59 | Altura das folhas distantes | 0.5 | 3 | Folhas distantes mais altas se leem melhor. 1.3 = natural.
slider = y59 | Largura das folhas distantes | 0 | 3 | As folhas distantes se alargam para a câmera para cobrir sem mais geometria. 1 = natural.
slider = y61 | Gramado distante | 0 | 1.5 | Onde uma folha já não tem tamanho na tela, a base do campo toma o aspecto do gramado visto de longe (tufos, pontas claras em vista rasante, raízes na sombra) em vez de folhas soltas. 0 = desligado.
slider = z61 | Tufos distantes | 0 | 2 | Contraste dos tufos claros e escuros do gramado distante. Atenuam-se sozinhos com a distância para não tremular.
