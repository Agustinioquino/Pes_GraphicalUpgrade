cslider = sim.wind_response | Resposta ao vento | 0 | 6 | 3.5 | 0 = sem vento. Mais baixo = com o jogador parado o tecido não levanta tanto. | %.2f
cslider = sim.wind_gust | Rajadas | 0 | 5 | 3 | Mais baixo = menos "sobe e desce" sem sentido. | %.2f
cslider = sim.wind_x | Direção X | -3 | 3 | 2 | Só importa a proporção entre X e Z. | %.2f
cslider = sim.wind_z | Direção Z | -3 | 3 | 0 | | %.2f
cchoice = sim.wind_in_menus | Vento nos menus | Não;Sim | 0 | Vento também na edição de jogador e na seleção de uniformes.

[MenuClothSim]
section = Roupa (física)
title = Simulação
desc = Peso do tecido, precisão das colisões e tempo do jogo.
cslider = sim.gravity | Gravidade (peso do tecido) | 6 | 15 | 9.81 | 9.81 = padrão. Mais alto = tecido mais pesado, cai mais. | %.2f
cslider = sim.substep_hz | Precisão (subpassos por segundo) | 240 | 960 | 480 | Mais subpassos = colisões mais precisas (o tecido não entra antes de colidir), com um pouco mais de custo. | %.0f
cslider = sim.collision_inset | Afundamento permitido (m) | 0 | 0.01 | 0.004 | Quanto o tecido pode afundar abaixo da forma original do uniforme. 0 = nada. | %.4f
cchoice = sim.capsules | Cápsulas dos braços | Não (padrão);Sim | 0 | Com cápsulas a borda da manga deixa de colidir com o braço: deixe em Não exceto para testar.
cchoice = sim.game_clock | Relógio | Tempo real;Relógio do jogo (pausa e câmera lenta) | 1 | Com o relógio do jogo o tecido congela na pausa e desacelera nos replays lentos.

[MenuClothLod]
section = Roupa (física)
title = Distância e desempenho
desc = Quantos jogadores têm roupa simulada e até que distância. É o maior custo de FPS.
cslider = lod.max_simulated | Jogadores com roupa simulada | 4 | 30 | 24 | Os mais próximos da câmera primeiro. Num PC lento, 12. | %.0f
cslider = lod.sim_distance | Distância máxima (m) | 20 | 250 | 250 | Além disso não há simulação. 160 cobre a câmera de TV. | %.0f

[MenuDebugView]
section = Diagnóstico
title = Vista de diagnóstico
desc = Vistas para entender o que está acontecendo. "Sol e espessura da pele": no canto superior direito uma bússola do sol (linha e ponto = onde está o sol na tela; ponto amarelo = sol na frente da câmera (contraluz), azul-claro = atrás da câmera; barra laranja = altura sobre o horizonte) e na pele: vermelho = espessura medida com o shadow map, verde = luz que atravessa, azul = lado de costas para o sol. "Só rebote de luz" mostra a luz indireta sozinha. "Sombras de contato": a cena em cinza e as sombras de contato em vermelho (mais vermelho = mais escuro). "Resolução da sombra" desenha os valores internos do shadow map em blocos. Também com Ctrl+Alt+F11 (sol e pele) e Ctrl+Shift+F3 (rebote).
choice = w12 | Vista | Nenhuma=0;Só rebote de luz=2;Sol e espessura da pele=3;Sombras de contato=4;Nuvens (eixos e opacidade)=5;Resolução da sombra=-3 | Aplica-se na hora; volte a "Nenhuma" para jogar.

[MenuDiagHooks]
section = Diagnóstico
title = Ganchos novos (para achar travamentos)
desc = Para encontrar o que causa um travamento: cada chave remove um dos ganchos em memória que o mod adiciona. Aplica-se ao reiniciar o jogo. "Vigiar o código do jogo" registra se algo muda o código do exe durante o jogo (outro mod ou a proteção do jogo) e, se o jogo travar, deixa os bytes onde aconteceu.
choice = x173 | Rastreio de jogadores | Não;Sim | Sabe qual jogador é cada corpo (usado pela musculatura por jogador). Desligado, os valores próprios de um jogador só aparecem no menu Físico.
choice = y173 | Ganchos do menu Físico | Não;Sim | A linha "Musculatura" com suas páginas dentro de Editar > Jogadores > Físico.
choice = w173 | Ossos da musculatura | Não;Sim | Ganchos dos 32 ossos de músculo. Desligado, não há musculatura.
choice = z173 | Vigiar o código do jogo | Não;Sim | Compara o código do exe a cada 2 segundos e registra mudanças (não muda nada no jogo).
choice = w184 | Registrar desenhos de personagens | Não;Sim | A cada 20 segundos registra os desenhos de jogadores de um quadro (para preparar o tom de pele por jogador). Aplica-se na hora.
choice = w191 | Registrar elementos de menu | Não;Sim | A cada 20 segundos registra os elementos de menu na tela (tamanho, textura, qual virou vidro) para ajustar o vidro dos menus. Aplica-se na hora.
