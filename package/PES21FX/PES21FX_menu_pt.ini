desc = O distante perde contraste e fica azulado (espalhamento Rayleigh) e na direção do sol fica branco (Mie, névoa), calculado por pixel com a profundidade real em vez da neblina do jogo. Sutil em dias limpos; com névoa a arquibancada oposta fica lavada como numa transmissão real.
