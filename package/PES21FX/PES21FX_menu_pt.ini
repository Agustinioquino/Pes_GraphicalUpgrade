desc = Cada estádio já tem sua LUT de cor. Em vez de subir a saturação de tudo (o que deixa a pele laranja e os uniformes neon), a vibração sobe só as cores apagadas: grama desbotada, céu pálido, arquibancadas cinzentas. Cores já saturadas e a pele quase não mudam. "Verde da grama" aviva só os verdes médios.
