[MenuKitWrinkles]
section = Uniformes
title = Dobras dinâmicas da roupa (v3: pela física)
desc = Dobras que aparecem ao vivo onde o tecido se comprime (axila ao levantar o braço, cintura ao girar, calção ao dobrar a perna) e somem quando ele estica. Mede-se a deformação real do tecido simulado em cada ponto e se desenha um relevo de dobra perpendicular à compressão, com sua oclusão. Também reforça as dobras já formadas (onde o tecido está muito curvado).
