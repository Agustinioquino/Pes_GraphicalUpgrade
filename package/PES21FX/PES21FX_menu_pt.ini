slider = x306 | Fosco | -0.2 | 0.3 | Rugosidade da pele: mais = brilho mais largo e suave, como pele seca; menos (negativo) = brilho menor e forte, como pele com creme ou suada. 0 = a do TorsoBody, com zonas. | %.2f
slider = z293 | Translucidez | 0 | 2 | Quanta luz atravessa a pele (1 = normal). | %.2f
choice = x311 | Definição na cor | Não;Sim | Sombras do músculo na cor da pele do tronco, como as do torso_1 retocado (a luz de cima sobre o relevo): cada tipo de corpo com a sua e o detalhe fino do alfa do bsm.
slider = y311 | Definição por tipo de corpo | 0 | 2 | Atlético: mais sombra sob o peitoral, entre os abdominais, o cinturão de Adônis e as costas. Gordo: mais suave, com as dobras da barriga. 1 = como o torso_1; 0 = igual ao normal. | %.2f
slider = z311 | Detalhe fino (alfa do bsm) | 0 | 2 | Poros e dobras finas do relevo na cor, a partir do canal alfa do torso_N_bsm (0.5 = sem mudança; pode ser retocado à mão no alfa). 0 = desligado. | %.2f
choice = x326 | Costura do ombro | Não;Sim | Junto à costura do braço com o tronco, dos dois lados, o relevo e a cor fina próprios de cada textura somem e fica só a forma da malha (as duas texturas nunca são iguais ali: via-se a linha).
slider = y326 | Largura da costura | 0.01 | 0.06 | Metros de cada lado. | %.3f
slider = z326 | Força na costura | 0 | 1 | 1 = nada do detalhe próprio bem na costura. | %.2f

[MenuSinShort]
section = Corpo
title = Sem calção (SinCamiseta)
desc = Para olhar o corpo inteiro no modo Editar: no lugar do calção vai a pélvis de pele (anatomia real: quadril, glúteos com sua dobra e frente lisa, soldada ao tronco e às coxas; a parte de baixo do tronco toma essa mesma forma, sem o degrau do cós). As peças do corpo vêm dentro do common_package.fpk e o jogo o carrega uma única vez, ao abrir: escolha "Sem calção", aperte Salvar e REINICIE o jogo. Com a pélvis carregada o calção do uniforme fica oculto e a tecla 4 do SinCamiseta (overlay do Sider) o mostra ou oculta (depois é preciso entrar de novo no jogador). "Com calção" + reiniciar = tudo como antes.
choice = x308 | Ao abrir o jogo | Com calção;Sem calção (pélvis) | Aplica-se ao reiniciar o jogo (Salvar antes).

[MenuMuscleArms]
section = Corpo
