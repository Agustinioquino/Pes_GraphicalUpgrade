slider = y164 | Ombros | 0.7 | 1.5 | Deltoides: a ponta do ombro cresce em volta da articulação, mais para os lados que para cima. Só o ombro (com "Unir músculos vizinhos" acompanham o trapézio, o peito alto e a escápula). | %.2f
