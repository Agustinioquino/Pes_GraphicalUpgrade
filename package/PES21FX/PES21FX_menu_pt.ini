[MenuClouds]
section = Campo e céu
title = Nuvens volumétricas
desc = Uma camada de nuvens real, traçada por raios sobre o céu (não é uma textura): têm volume, sombra própria, borda iluminada contra a luz e se movem com o vento. Com "Dentro do céu do jogo" substituem as nuvens pintadas do estádio e ficam fixas no mundo: não se movem com a câmera. A mesma camada faz sombra no campo (ver "Sombra das nuvens"). Custa um pouco de GPU em planos com muito céu; baixe a "Qualidade" se precisar. Se o céu sair de cabeça para baixo ou aparecerem nuvens abaixo do horizonte, use as duas chaves de eixo.
