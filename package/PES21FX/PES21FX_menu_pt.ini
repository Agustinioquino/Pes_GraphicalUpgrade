[MenuSkinSpecPhys]
section = Pele
title = Brilho físico da pele
desc = O brilho da pele deixa de ser cera amarela: toma a cor do sol (não o tom do material), é fraco olhando de frente e cresce na silhueta como a pele real (Fresnel com F0 de pele), e pode ser baixado no geral.
