[MenuFaceFeatures]
section = Rosto
title = Traços do rosto (fundos e dobras)
desc = Comparado com o jogo original, o rosto com o mod saía mais claro e com os traços lavados: o multi-rebote da oclusão ambiente clareia os fundos em superfícies claras (um fundo de 0.5 virava 0.72 na pele) e a iluminação global em espaço de tela os preenchia. Isto deixa a oclusão da pele mais profunda e sem multi-rebote, e baixa o preenchimento do SSGI só na pele. Além disso o sol já não se acumula (curva do dia x sol realista x contraste de dia dava 1.58x nos jogadores; agora ~1.2x).
slider = x124 | Traços | 0 | 1 | 0 = como antes; 0.6 = os fundos e dobras do original; 1 = marcados.
slider = y124 | Marcas da pele | 0 | 1 | Pintas, sardas, manchas e veinhas da textura do rosto mais visíveis (não inventa marcas novas). 0 = como no jogo.

[MenuFaceLOD]
section = Rosto
title = LOD do rosto (malha de máximo detalhe à distância)
desc = O motor escolhe na CPU qual malha desenhar para cada jogador segundo a distância (LOD), e os mods que mudam bytes não alteram isso. Isto vai por outro caminho: a DLL aprende, por rosto, os buffers da malha mais detalhada que viu e, quando esse rosto volta com a malha reduzida, desenha a mais detalhada no lugar (só se o vertex shader e os cbuffers coincidirem, assim o esqueleto é o mesmo). Passe antes por "Diagnóstico": ele anota no log, por rosto, com quantos vértices é desenhado, com quais shaders e a que distância muda; isso mostra se o motor usa várias malhas ou não. As expressões faciais de jogadores distantes não podem ser forçadas da GPU (a CPU não as calcula).
choice = x118 | Diagnóstico no log (a cada 20 s) | Não;Sim | Desligue depois de ler o log: custa algum desempenho.
slider = z118 | Distância máxima (m) | 0 | 120 | 0 = sempre; ex. 40 = só jogadores a menos de 40 m.
choice = w118 | Compatibilidade | Estrita (mesmo vertex shader);Permissiva (mesmo layout) | Permissiva pode deformar mal se o esqueleto for diferente.

[MenuFaceGen]
section = Rosto
title = Quinta textura (gerada por rosto)
desc = O jogo passa ao shader do rosto quatro texturas (cor, normal, brilho e translucidez). O PES21 FX gera ao vivo uma quinta, para CADA rosto, a partir dessas quatro na primeira vez que aparece: cavidades (dobras, narinas, cantos da boca), curvatura, espessura real da pele (orelhas, nariz, lábios, pálpebras) e a máscara exata de barba, sobrancelhas e linha do cabelo. Substitui o mapa genérico onde houver. Os rostos já gerados se refazem ao mudar de partida.
