slider = z103 | Força do brilho | 0.2 | 2 | Multiplica todo o brilho da pele.

[MenuGenericFace]
section = Pele
title = Rostos genéricos sem emenda
desc = Os rostos genéricos (os não escaneados) são feitos de duas peças: a máscara do rosto (textura FaceSKIN) e a cabeça (pescoço, orelhas, nuca), que o jogo desenha com a pele do corpo. Os efeitos de pele do rosto paravam de repente na borda: sob a mandíbula o rosto ficava laranja e o pescoço não. Com isto a borda se funde e a cabeça recebe o mesmo tratamento que o rosto (translucidez, orelhas finas contra a luz, poros, suor).
choice = y147 | Mostrar a borda (diagnóstico) | Não;Sim | Pinta de vermelho a faixa onde a máscara do rosto se funde.

[MenuSSSS]
section = Pele
title = Dispersão da luz na pele (SSS)
desc = Uma única dispersão para toda a pele (27/10): o perfil de Burley usado pelo Unreal 5 e pela Disney, em milímetros reais, com um disco de 16 amostras que gira a cada quadro (o TAA do jogo suaviza). O vermelho viaja mais que o verde e o azul segundo o tom da pele (a pele escura quase não avermelha). A difusão só é cortada pelo que não é pele ou sai da superfície, assim poros e rugas não a mancham. Com isto ligado, o SSS nativo do jogo se desliga sozinho. Desligado = a pele como antes (z3, x3, y3, x34 voltam).
slider = x95 | Largura | 0.3 | 6 | 1 = escala real (o vermelho viaja ~1 mm em média sob a pele clara). 2 a 3 = parecido com o SSS nativo do jogo com largura 2 (mais suave, esconde a borda do shadow map).
slider = y95 | Força | 0 | 1
