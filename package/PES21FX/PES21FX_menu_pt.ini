slider = x5 | Contraluz (orelhas, nariz) | 0 | 2 | Quanta luz atravessa orelhas e nariz com o sol atrás.
slider = y5 | Brilho fino (oleosidade/suor) | 0 | 1.5 | Um segundo brilho, menor e mais nítido.
slider = w5 | Brilho fino por zona | 0 | 1 | Nariz e testa brilham mais fino, bochechas mais foscas, sem brilho dentro das dobras e dos cantos da boca; de longe os poros não tremulam. 0 = igual em todo o rosto.
slider = z64 | Contraluz pela espessura real | 0 | 2.5 | Luz que atravessa segundo a espessura medida com a sombra do sol: a orelha se acende e a bochecha não.
slider = y76 | Zonas que deixam passar luz | 0 | 1 | 0 = só orelhas, narinas e lábios; 1 = toda a pele (fica laranja). 0.35 = natural.
slider = z34 | Cor da contraluz | 0 | 1 | 0 = vermelho puro; 1 = rosado quente (a cor da pele do jogo faz o resto). 0.6 = natural.
