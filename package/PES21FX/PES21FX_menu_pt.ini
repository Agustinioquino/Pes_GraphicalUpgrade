[MenuGrassMow]
section = Campo e céu
title = Corte, vento e pisadas
desc = O corte do cortador é desenhado na base e nas folhas ao mesmo tempo (grão sintetizado: uma faixa clara de um lado fica escura do outro, como na TV) e as faixas mudam com o ângulo da câmera; "Do jogo" mantém o padrão próprio de cada estádio. O vento chega em rajadas que viajam pelo campo na direção do vento das nuvens, com frentes irregulares; cada tufo balança no seu ritmo e a luz segue a curva da folha, assim as rajadas parecem ondas de brilho. Os jogadores amassam o gramado onde pisam e a bola deixa um rastro ao rolar: as folhas se abaixam e se abrem para fora, a base muda de tom e tudo se recupera sozinho em alguns segundos. Ao correr, os jogadores levantam aparas de folha que voam, caem e são levadas pelo vento (recebem a mesma luz e sombra que o gramado).
