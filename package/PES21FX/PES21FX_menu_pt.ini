[MenuGrassLight]
section = Campo e céu
title = Luz do sol e do estádio no gramado
desc = Como o gramado responde à luz, com a mesma conta para a base e as folhas. Relevo por folha = cada folha tem sua normal (cilíndrica: clara de um lado, escura do outro) em vez de ser iluminada como o chão; a sombra entre folhas (oclusão da raiz) cresce com o sol baixo. Contraluz = com o sol de frente para a câmera as folhas deixam passar a luz e se acendem amarelo-esverdeadas (mais com o sol baixo). Brilho ao sol = a cutícula cerosa reflete o sol em ângulo rasante e o campo clareia, como na TV à tarde (não brilha na sombra). De noite, quatro torres virtuais em volta da luz dominante dão brilhos rasantes múltiplos e um pouco de luz dos quatro lados, só sobre o gramado. O rebote esverdeado do campo sobre os jogadores está em Iluminação > Rebote de luz do gramado.
