slider = w143 | Barro com o tempo | 0 | 1 | 0 = o do jogo; 0.5 = visível no fim da partida; 1 = muito. | %.2f

[MenuMotor]
section = Estádio
title = Motor: mais detalhe (patches de memória)
desc = Mudanças dentro do motor do jogo, feitas em memória pela DLL (o exe não é tocado, só com a versão conhecida). LOD dos modelos: o motor decide qual malha desenhar para cada jogador, a torcida e o estádio segundo o tamanho na tela; isto o engana para manter a malha detalhada mais longe (1.5 = 50 % mais longe; custa algo de GPU). Sombras do sol 5120: o shadow map passa de 4096 para 5120 (bordas mais finas; o máximo que cabe no DirectX 11 com as três cascatas). A resolução das sombras é lida ao abrir: é preciso reiniciar o jogo. Cortes de câmera: o motor avisa cada corte de plano (replays, saídas, closes) e os efeitos que se acumulam entre quadros recomeçam bem ali.
slider = x142 | LOD dos modelos (x) | 1 | 2.5 | 1 = como no jogo. | %.2f
choice = y142 | Sombras do sol | 4096 (jogo);5120 (mais finas, reiniciar) |
choice = x161 | Cortes de câmera do motor | Não usar;Usar | A DLL lê do motor quando há um corte de câmera (o mesmo sinal que o antialiasing do jogo usa). Nesse quadro o rebote de luz e a oclusão acumulados começam do zero, sem rastro do plano anterior, e a exposição estável salta para o novo plano em vez de se ajustar durante um segundo.

[MenuMuscle]
section = Corpo
title = Musculatura (teste)
desc = Aumenta ou diminui os músculos de todos os jogadores com os ossos musculares do próprio esqueleto do jogo, depois que o motor os ajusta a cada pose: a mudança aparece na hora e o corpo continua se movendo igual. Braços e pernas engrossam em volta do eixo (o comprimento não muda); peito, costas, abdômen e glúteos se projetam para fora. Este interruptor liga os quatro cartões de musculatura. O que estes cartões definem vale para todos os jogadores; "Musculatura por jogador" dá a um jogador valores próprios.
slider = x167 | Geral | 0.7 | 1.5 | Aumenta ou diminui todos os músculos de uma vez (não a barriga). Multiplica cada slider dos outros cartões: 1 = como cada slider. | %.2f
choice = x255 | Unir músculos vizinhos | Não (cada um sozinho);Sim | Não: cada slider move só seu músculo ("Ombros" só o deltoide). Sim: os vizinhos acompanham um pouco para não ficar degrau (trapézio, peito alto e escápula com o ombro; axila com o peito; lateral com os dorsais; base do pescoço com o pescoço e o trapézio; lombar com as costas baixas).
choice = y166 | A roupa acompanha | Não;Sim | As mangas acompanham o braço e o calção as coxas, sem mudar o comprimento. Senão o corpo pode atravessar a roupa.
choice = z170 | Cotovelos e joelhos acompanham | Não;Sim | Cotovelo e joelho crescem um pouco com o braço, antebraço, coxa e panturrilha, para não ficar degrau onde se encontram (a patela quase não muda).
slider = x172 | Definição muscular | 0 | 2 | Quanto os músculos se marcam na pele (o relevo de tronco, braços e pernas), sem tocar os poros. Separado do tamanho. 1 = como no jogo; 0 = pele lisa. Também por jogador ("Musculatura por jogador" ou a linha no menu Físico). | %.2f
choice = x163 | A roupa acompanha menos | Não;Sim | Camisa e calção crescem menos que o músculo (senão a manga parece inflada quando o bíceps cresce).
slider = y163 | Quanto a roupa cresce | 0 | 1 | 1 = igual ao músculo; 0.8 = a manga cresce 80 % (como potência); 0 = a roupa não muda. | %.2f
slider = y255 | Quanto as mangas crescem | 0 | 1.2 | Quanto do crescimento do braço a manga recebe (osso próprio). 0.6 = a manga ganha os mesmos centímetros que o braço (está mais longe do eixo que a pele); 1 = cresce como o músculo e parece inflada; 0 = a manga não cresce. | %.2f
slider = z255 | A roupa acompanha o corpo (física) | 0 | 1.5 | Com a física de roupa ligada: o peito, as costas, o abdômen, o trapézio, os ombros e os glúteos aumentados pela musculatura empurram a camisa e o calção igual à pele, assim o corpo não atravessa. 1 = igual à pele; 0 = desligado. | %.2f
button = muscle_preset_1 | Tipo de corpo: Magro | Põe os cartões gerais como um corpo magro (todos os jogadores sem valores próprios) e salva.
button = muscle_preset_2 | Tipo de corpo: Atlético | Um pouco mais de músculo, abdômen marcado e cintura fina, para todos os jogadores sem valores próprios. Salva.
button = muscle_preset_3 | Tipo de corpo: Forte | Mais músculo no corpo todo, pescoço e trapézio de lutador. Salva.
button = muscle_preset_4 | Tipo de corpo: Corpulento | Pesado: tronco e cintura largos. Salva.
button = muscle_preset_5 | Tipo de corpo: Fisiculturista | Muito músculo: ombros redondos, costas em V, trapézio alto e cintura fina. Salva.
button = muscle_reset | Voltar aos valores do jogo | Todos os cartões gerais de musculatura (tamanho de cada músculo, Geral, cintura, quadril, largura dos ombros, detalhes e definição) voltam a 1 = como no jogo, e salva. Os jogadores sem valores próprios ficam como a Konami os fez; os que têm valores próprios ("Musculatura por jogador") continuam com os seus.

[MenuManos]
section = Corpo
title = Mãos (deformação)
desc = Para as mãos do TorsoBody. O jogo deforma a mão misturando matrizes de ossos (por isso os dedos afinam nos nós ao dobrar e ficam separados no punho fechado); com isto a mão se deforma com quaternions duplos (conserva o volume) e se somam correções esculpidas que entram segundo o quanto cada dedo fecha: os nós dos dedos aparecem, os dedos se apoiam uns nos outros e as veias do dorso aparecem mais ao fechar o punho. Também se aplica à sombra da mão. Desligado = a mão exatamente como o jogo a deforma.
slider = y300 | Volume dos nós | 0 | 1 | Skinning com quaternions duplos. 0 = como no jogo (os dedos afinam ao dobrar); 1 = mantêm o volume. | %.2f
slider = z300 | Nós ao fechar | 0 | 2 | Quanto as cabeças dos metacarpos aparecem com o punho fechado. 1 = como esculpido. | %.2f
slider = w300 | Dedos apoiados | 0 | 1.5 | No punho, os dedos se juntam e se apoiam uns nos outros em vez de deixar espaços. 1 = se tocam. | %.2f
slider = x301 | Veias ao fechar | 0 | 2 | As veias do dorso da mão aparecem mais quanto mais fechada a mão. 0 = sem mudança. | %.2f

[MenuManosRelajadas]
section = Corpo
title = Mãos relaxadas
desc = Em muitas animações o jogo deixa os dedos retos e rígidos. Com isto, quando a mão está aberta, os dedos se dobram um pouco como uma mão realmente relaxada (o mindinho mais que o indicador, o polegar quase nada). Se o jogo já está fechando um dedo (punho, agarrar, apontar, polegar para cima) esse dedo fica como o jogo o põe. Também se aplica à sombra da mão. Precisa do cartão "Mãos (deformação)" ligado (com seus sliders em 0 a mão fica como a do jogo, só relaxada).
slider = y303 | Quantidade | 0 | 1.5 | Quanto se dobram os dedos de uma mão aberta. 1 = mão relaxada normal; 0 = como no jogo. | %.2f
slider = z303 | Polegar | 0 | 2 | Quanto o polegar se dobra (multiplicado por "Quantidade"). | %.2f
slider = w303 | Até que fechamento | 0.1 | 0.8 | Se o jogo já dobra o dedo mais que isso (0 = reto, 1 = punho), esse dedo não se toca. Mais alto = as mãos meio fechadas também relaxam. | %.2f

[MenuUnasJugadores]
section = Corpo
title = Unhas (jogadores com textura própria)
desc = Muitos jogadores com rosto real trazem sua própria textura de braço (tatuagens, pelos, tom): essa textura tem as unhas pintadas para a mão original do jogo, e na mão do TorsoBody a unha 3D fica em outro lugar, então a unha pintada ficava meio para fora e a unha 3D parecia da cor da pele. Com isto, nesses jogadores a unha pintada velha se apaga (preenchida com a pele de volta) e a unha 3D toma a cor da unha dessa mesma textura. Os jogadores com a pele do TorsoBody não mudam.
slider = y304 | Quantidade | 0 | 1 | 1 = a unha pintada passa inteira para a unha 3D; 0 = como estava. | %.2f

[MenuSkinTonePlayer]
section = Corpo
title = Tom de pele por jogador
desc = Escolhe-se em Editar > Jogadores > Físico > Musculatura, página "Pele" (R1 até a última página), e se salva por jogador em PES21FX\piel_jugadores.ini. A linha do tom mostra a cor e o X abre a paleta do jogo com 30 tons de pele (e "criar cor" para um próprio); embaixo há tons conhecidos com nome (escala Monk 1..10), barras de claridade, saturação e matiz para afinar com o analógico, e "Corpo da cor do rosto": o mod mede a cor do rosto e do corpo na base do pescoço e corrige o corpo para igualar (o rosto não muda). Muda o tom de verdade (matiz e saturação, não só o brilho: os claros mais rosados e pálidos, os médios canela, os escuros marrom avermelhado) e o mesmo número fica igual em todos os jogadores. Tinge a pele do corpo e do rosto, no menu Físico e nas partidas. O mod registra a cor de pele do jogo de cada jogador quando você abre seu menu Físico: se um jogador tinha um tom próprio de antes, abra seu Físico uma vez.
slider = y184 | Intensidade | 0 | 1.5 | 1 = o tom escolhido; menos o aproxima da cor do jogo. | %.2f

[MenuGlassUI]
section = Menus do jogo
title = Vidro no menu Físico (estilo Liquid Glass)
desc = Em Editar > Jogadores > Físico (e suas páginas de musculatura e pele) os painéis do menu viram vidro como no iPhone: o fundo aparece desfocado através do painel, com uma borda que brilha, refração nas bordas e cantos arredondados. Textos, ícones e fotos ficam iguais. Os outros menus do jogo ficam como sempre (a menos que você escolha "Todos os menus").
slider = y189 | Fosco | 0 | 1 | 0 = o fundo fica nítido; 1 = muito desfocado (o texto se lê melhor). | %.2f
slider = z189 | Raio do desfoque | 0.5 | 3 | Quanto o desfoque do fundo se espalha. | %.1f
slider = w189 | Tom do painel | 0 | 1 | Quanto da cor original do painel fica: menos = mais transparente. | %.2f
slider = x190 | Brilho da borda | 0 | 2 | A borda de luz em volta do painel (mais forte em cima à esquerda). | %.2f
slider = y190 | Refração | 0 | 2 | Quanto o fundo se curva perto da borda, como um vidro grosso. | %.2f
slider = z190 | Cantos arredondados (px) | 0 | 40 | Raio dos cantos dos painéis retangulares. 0 = como no jogo. | %.0f
slider = w190 | Brilho superior | 0 | 1 | Um reflexo suave em cima de cada painel. | %.2f
slider = x191 | Painéis opacos | 0.3 | 1 | 1 = os painéis sólidos ficam sólidos (com brilho); menos = também viram vidro. | %.2f
choice = x192 | Onde | Só o menu Físico;Todos os menus | Por padrão só em Editar > Jogadores > Físico. "Todos os menus" leva para todos os menus do jogo e o placar da partida.

[MenuMuscleHighlight]
section = Corpo
title = Musculatura: destacar o músculo selecionado
desc = Em Editar > Jogadores > Físico, nas páginas de Musculatura, a pele do músculo da linha selecionada clareia e pulsa devagar, como o brilho dos menus de rosto. Aparece quando você se move entre linhas ou muda um valor e some depois de alguns segundos (ou fica sempre). "Geral" destaca o corpo inteiro.
slider = y183 | Intensidade | 0.2 | 1.5 | Quanto a pele clareia no pico do pulso. | %.2f
slider = z183 | Duração (s) | 0 | 15 | Segundos que fica depois de se mover ou mudar um valor. 0 = sempre. | %.0f
slider = w183 | Pulso (s) | 0.6 | 3 | Quanto dura cada pulso: mais alto = mais lento. | %.1f

[MenuMusclePlayers]
section = Corpo
title = Musculatura por jogador
desc = Valores próprios para um jogador; todos os outros continuam com os valores dos cartões gerais. Escolha o jogador (em Editar > Jogadores só aparece o que você está editando; numa partida ou num replay dá para escolher qualquer um do campo), aperte "Dar valores próprios" e mova seus sliders: a mudança aparece na hora, só nele, e se salva sozinha em PES21FX\musculatura_jugadores.ini (pelo id do jogador, vale em todos os modos). Os interruptores (roupa, cotovelos e joelhos) e a definição muscular são de todos. Também dentro do jogo: em Editar > Jogadores > Físico, a linha "Musculatura" (ou R1) abre as páginas desse jogador: ombros e braços (bem em cima, "Tipo de corpo": Magro, Atlético, Forte, Corpulento, Fisiculturista ou como no jogo), peito, costas e pescoço, abdômen e quadril, pernas (-50 a +50, em passos de 0.01) e pele (tom próprio). L1 / R1 mudam de página e Voltar retorna.

[MenuMuscleAlive]
section = Corpo
title = Musculatura: músculos vivos
desc = Liga com "Musculatura (teste)". Os músculos se movem com o corpo: o bíceps incha ao dobrar o cotovelo, o ombro e o trapézio ao levantar o braço, os isquiotibiais e a panturrilha ao dobrar o joelho. E o jogador respira: peito, costelas, costas e barriga sobem e descem, mais rápido e mais fundo depois de um pique (acalmando aos poucos). Vale para todos os jogadores, sem mudar sua forma em repouso.
slider = x263 | Contração com o movimento | 0 | 2 | Quanto incham os músculos que trabalham. 0 = desligado; 1 = normal. | %.2f
slider = y263 | Respiração | 0 | 2 | Quanto o peito se move ao respirar (uns 2-3 mm em repouso, até 7 mm ofegante). 0 = desligado. | %.2f
slider = z263 | Ofegante depois de correr | 0 | 2 | Quanto correr os deixa ofegantes: respiram mais rápido e mais fundo. 0 = sempre calmos. | %.2f

[MenuMuscleTexture]
section = Corpo
title = Musculatura: músculos com textura (veias)
desc = Vai junto com os músculos vivos: quando um músculo trabalha, a pele também mostra. Com o cotovelo dobrado o relevo do bíceps e do antebraço se marca mais e aparecem as veias do braço (a cefálica, a basílica, a da dobra do cotovelo e as do antebraço); com o braço levantado, o ombro; com o joelho dobrado, isquiotibiais, panturrilha e quadríceps. Com o punho fechado (ao gritar ou comemorar) aparecem as veias do dorso da mão. Só nos braços, pernas e mãos do TorsoBody.
slider = y305 | Definição ao trabalhar | 0 | 2 | Quanto mais se marca o relevo do músculo que trabalha. 0 = como sempre; 1 = o dobro de relevo com o músculo no máximo. | %.2f
slider = z305 | Veias dos braços | 0 | 2 | Quanto aparecem as veias do braço com o cotovelo dobrado ou o braço levantado. 0 = sem veias. | %.2f
slider = w305 | Veias das mãos | 0 | 2 | Quanto aparecem as veias do dorso da mão com o punho fechado. 0 = sem veias. | %.2f

[MenuMuscleVariants]
section = Corpo
title = Musculatura: tronco e braços (robusto / atlético)
desc = Liga com "Musculatura (teste)". Duas variantes novas do tronco e dos braços do TorsoBody. ROBUSTO: barriga que se apoia no calção, pneuzinhos dos lados e na lombar, peito caído e sem forma, abdominais quase apagados, dobras e estrias finas (um pouco mais claras), braços mais grossos e lisos, as veias aparecem menos. ATLÉTICO: cintura fina, costas em V, trapézios maiores e marcados, peito cheio com a borda de baixo marcada, abdominais, serráteis e cinturão de Adônis marcados, braços mais definidos e com algumas veias. Muda o modelo (forma e normais) e as texturas; a camisa acompanha com a física da roupa. Este slider é o de todos os jogadores: cada jogador pode ter o seu (menu Físico do jogo: primeira página de Musculatura, seletor "Tronco e braços" de Robusto 100 % a Normal e a Atlético 100 %; ou "Musculatura por jogador"). Os tipos de corpo também o usam (Atlético, Fisiculturista, Corpulento...).
slider = z262 | Robusto / Atlético | 0.5 | 1.5 | 0.5 = totalmente robusto, 1 = o tronco do TorsoBody, 1.5 = totalmente atlético. Valores intermediários misturam. | %.2f
slider = y285 | Dobras, estrias e linhas | 0 | 2 | Quanto se marcam as texturas novas (dobras e estrias do robusto; Adônis, serráteis e trapézio do atlético). 0 = só a forma. | %.2f
slider = z285 | Mudança da definição | 0 | 2 | Quanto os músculos desenhados na pele descem (robusto) ou sobem (atlético). 0 = como o TorsoBody. | %.2f
choice = x289 | Tronco e braços esculpidos | Não (como o TorsoBody);Sim | Para todos os troncos: o relevo que o normal map do TorsoBody desenhava em linhas (abdominais, peitoral, serráteis, sulcos) passa para a malha. Nos braços: bíceps, tríceps, deltoides, cotovelo e antebraço com volume e profundidade de verdade (sombra, silhueta, oclusão), e as costas do corpo normal ficam suaves. O atlético fica um pouco mais fundo (1.25 vezes) e o robusto quase liso, com dobras.
slider = x288 | Coluna marcada | 0 | 2 | Para todos os troncos (com ou sem variante): o sulco da coluna e os músculos ao lado se marcam mais nas costas, sobretudo embaixo. Menos no robusto, um pouco mais no atlético. 0 = como o TorsoBody. | %.2f
choice = x286 | Relevo do TorsoBody | Como estava;Corrigido | As texturas de relevo do TorsoBody (tronco, braços, pernas) vinham com o verde invertido para o jogo: os músculos pareciam iluminados de baixo, como afundados (notava-se sobretudo com mais definição). Corrigido = do jeito certo, para todos os jogadores e com qualquer variante.
choice = x307 | Limite do relevo | Não;Sim | A malha esculpida, o normal map e a definição se somam: no atlético com definição alta os sulcos (esterno, borda do peitoral, linha alba, dobra do cotovelo) ficavam tão inclinados que pareciam manchas pretas. Com o limite, só o que passa da inclinação máxima se suaviza; o resto do relevo não muda.
slider = y307 | Inclinação máxima | 30 | 80 | Graus. 49 = natural; mais = sulcos mais fundos e escuros; menos = mais suave. | %.0f
choice = w320 | Tronco sob a camisa | Não;Sim | Sim = o tronco entra alguns milímetros para dentro (não o pescoço nem os braços), assim não aparece pelas camisas justas.
choice = y320 | O que entra | Toda a pele sob a camisa;Só o tronco | Toda a pele = tronco, ombros, braço até o cotovelo e pescoço até a gola juntos: sem degrau no pescoço nem no braço.
slider = x320 | Quanto entra (mm) | 0 | 20 | 8 = natural. Só quando há camisas em cena: sem camisa (menu Aparência, Físico, tecla 4) o tronco fica inteiro sozinho. | %.0f

[MenuTorsoArms]
section = Corpo
title = Braços e coxas do TorsoBody nos rostos reais
desc = Os rostos reais do patch trazem suas próprias texturas de braço e de coxa (o atlas da Konami em 2048, com o tom que cada facemaker escolheu). O jogo as usava nos braços, nas mãos e nas coxas enquanto o tronco levava a do TorsoBody: por isso o salto de tom e de detalhe bem na linha da manga e na coxa, com ou sem o mod. Ligado = nesses desenhos vai a textura do TorsoBody do tom do jogador (o mesmo do tronco). O tom é reconhecido pela textura do tronco, então o braço pode ficar como o rosto por um instante quando aparece um jogador novo. Desligado = como vinha (as do rosto).
choice = y321 | Também as coxas | Não;Sim | Sim = as coxas também usam thigh_N do TorsoBody (o rosto traz thigh_bsm.ftex).
slider = z321 | Tom forçado | 0 | 6 | 0 = o tom do tronco do jogador (automático). 1..6 = esse tom de pele do jogo para todos (para testar). | %.0f
choice = w321 | Anotar no log | Não;Sim | Sim = o PES21FX.log diz quais desenhos foram trocados e qual tom foi reconhecido (os primeiros 60).
choice = x327 | Tom do corpo | O do tronco;O do rosto | O do rosto = mede-se a textura de braço do rosto real e o tronco, os braços e as coxas passam para as texturas do TorsoBody desse tom: o corpo inteiro com o mesmo jogo de texturas e o tom do rosto (também com "Ver original"). O do tronco = a cor de pele do banco de dados.

[MenuTonoCuerpo]
section = Corpo
title = Tom do tronco igual ao do rosto (rostos reais)
desc = Nos rostos reais os braços e as pernas saem da textura do rosto (o tom dele) e o tronco da cor de pele do banco de dados, que a Konami não cuidava porque ficava sob a camisa: tronco branco num jogador escuro, com e sem shaders. Ligado = antes de montar o jogador ele recebe o tom de PES21FX\tonos_piel.txt (ou do shirtless_skin_map.bin). Ainda em teste: falta o despejo do log para localizar o campo.
slider = y324 | Campo (deslocamento) | 0 | 508 | Localizado pelo despejo do log; 0 = não mexer em nada. | %.0f
slider = z324 | Bit do campo | 0 | 29 | | %.0f
choice = w324 | Despejo no log | Não;Sim | Sim = anota os dados dos 12 primeiros jogadores e a aparência do menu Físico.

[MenuCamisetaInterior]
section = Corpo
title = Ocultar a camiseta interna (ver o corpo)
desc = Ao tirar a camisa e as mangas com o módulo SinCamiseta, a camiseta interna do uniforme (inner, inner_cap, inner_glove) e a gola alta (highneck) continuam ali: vêm dentro do pacote do corpo que o jogo carrega uma vez ao abrir e o módulo não consegue tapá-las. Aparecem em branco na linha da manga e na base do pescoço. Ligado = a DLL não desenha essas malhas (as reconhece pelo tamanho: 9990, 9714, 8640 e 960 índices; nunca malhas de pele). Só para olhar o corpo: na partida deixe desligado.
choice = w323 | Registro | Não;Sim | Sim = anota no PES21FX.log cada malha que oculta (as primeiras 40).

[MenuCollar]
section = Corpo
title = Pescoço dos rostos reais: união com o tronco
desc = O módulo do Sider corta o pescoço do rosto na borda do tronco e o funde com uma cor fixa por tom, que não é a que o tronco tem na tela (textura própria, tom próprio do jogador, "corpo da cor do rosto"): ficava uma faixa de outra cor com a borda marcada. Ligado = os últimos milímetros do pescoço sobre a união tomam a cor do próprio torso_N do TorsoBody logo abaixo da união (decote na frente, nuca atrás), com o detalhe do rosto e o tom do corpo do jogador. Precisa de "Braços e coxas do TorsoBody nos rostos reais" ligado (dali sai o tom).
slider = y322 | Altura da faixa (mm) | 5 | 60 | Da união para cima. 25 = como o fundido do módulo do Sider. | %.0f
slider = z322 | Quanto | 0 | 1 | 1 = o pescoço termina na cor exata do tronco; menos = fundido parcial. | %.2f
choice = w322 | Ver a faixa | Não;Sim | Sim = a faixa é pintada de vermelho para ver onde cai (diagnóstico).
slider = y323 | Afundar a base do pescoço (mm) | 0 | 12 | A borda cortada do pescoço fica sob a pele do tronco e aparece a borda lisa do tronco. 0 = como antes. | %.1f
slider = z323 | Fundido do afundamento (mm) | 3 | 30 | Da união para cima, o pescoço volta ao seu lugar. | %.0f

[MenuSkinReal]
section = Corpo
title = Pele do corpo (realista)
desc = Para o corpo do TorsoBody (tronco, braços e pernas). Suas texturas de brilho e translucidez eram uniformes no corpo todo e a pele parecia argila. Agora a pele é acetinada: os poros e as linhas finas cortam o brilho, o esterno, as costas entre as escápulas, os ombros e a lombar brilham um pouco mais (pele mais oleosa), os lados são mais foscos, e a luz atravessa mais a carne (lados, dobras) que o osso (esterno, clavículas, coluna). Um pouco de rubor no peito alto e nos ombros.
