; PES21 FX - textos do menu em portugues. Mesmas secoes [MenuX] / [KeyX] do PES21FX.ini; daqui so se leem os textos
; (section, title, desc, label e o rotulo / ajuda / opcoes de slider, choice, cslider, cchoice e button).
; Faixas, formatos e valores padrao sempre vem do PES21FX.ini. Idioma: menu Insert > seletor de idioma.

[KeyPESWrinkleToggle]
label = Ctrl+Shift+F12: rugas de expressão melhoradas liga/desliga (desligado = as rugas originais do jogo)

[KeyPESWrinkleGain]
label = Ctrl+Alt+F12: ganho das rugas 0.7 / 1.4 / 1.0

[KeyPESMouthToggle]
label = Ctrl+Alt+Shift+F9: melhorias do interior da boca liga/desliga

[KeyPESMouthDiag]
label = Ctrl+Alt+Shift+F8: diagnóstico (dentes azul / gengiva-língua vermelho / cavidade verde)

[KeyPESExprPhysics]
label = Ctrl+Alt+Shift+F11: física da expressão liga/desliga (sangue, brilho, translucidez)

[KeyPESEyes]
label = Ctrl+Alt+Shift+F7: melhorias dos olhos liga/desliga

[KeyPESShadowDef]
label = Ctrl+Alt+Shift+F6: definição das sombras liga/desliga

[KeyPESShadowFilter]
label = Ctrl+Alt+Shift+F5: filtro de sombras v2 -> PCSS (2) / original (0) / estável (1)

[KeyPESShadowPCSS]
label = Ctrl+Alt+Shift+F4: escala da penumbra PCSS (só modo 2)

[KeyPESKitShade]
label = Ctrl+Alt+Shift+F3: sombreado melhorado dos uniformes liga/desliga

[KeyPESKitRelief]
label = Ctrl+Alt+Shift+F2: força do relevo do uniforme 1.8 / 1.0 / 1.4

[KeyPESHairWind]
label = Ctrl+Alt+Shift+F1: vento no cabelo liga/desliga

[KeyPESHairWindForce]
label = Ctrl+Alt+Shift+F10: força do vento no cabelo 1.0 / 1.6 / 0.3 / 0.6

[KeyPESClothLight]
label = Alt+Shift+F1: iluminação do tecido do uniforme liga/desliga

[KeyPESClothSheen]
label = Alt+Shift+F2: força do brilho do tecido 1.0 / 0.3 / 1.5 / 0.6

[KeyPESSweatShirt]
label = Alt+Shift+F3: camisa suada liga/desliga

[KeyPESSweatShirtDebug]
label = Alt+Shift+F4: diagnóstico do suor (zonas vermelhas / UV / normal)

[KeyPESSkyBright]
label = Alt+Shift+F5: brilho do céu 1.0 / 0.6 / 1.3 / 0.8

[KeyPESClothDebug]
label = Alt+Shift+F6: diagnóstico do uniforme (magenta = detectado como tecido) / normal

[KeyPESGrassV2]
label = Alt+Shift+F7: cor natural do gramado liga/desliga

[KeyPESGrassHue]
label = Alt+Shift+F8: correção do amarelo do gramado 1.0 / 0.0 / 0.6

[KeyPESKitShadowBias]
label = Alt+Shift+F9: viés de sombra nos uniformes 0.0006 / 0.0012 / 0 / 0.0003

[KeyPESWrinkleHiTex]
label = Ctrl+Alt+Shift+F12: texturas de rugas remasterizadas liga/desliga

[KeyPESSunToggle]
label = Ctrl+Shift+F5: sol realista liga/desliga

[KeyPESGrassToggle]
label = Ctrl+Shift+F6: sombreado do gramado liga/desliga

[KeyPESGIToggle]
label = Ctrl+Shift+F1: rebote de luz (SSGI) liga/desliga

[KeyPESGICycle]
label = Ctrl+Shift+F2: intensidade do rebote de luz

[KeyPESGIDebug]
label = Ctrl+Shift+F3: mostrar só o rebote de luz (diagnóstico)

[KeyPESLookToggle]
label = Ctrl+Shift+F7: visual moderno liga/desliga (para comparar)

[KeyPESThickDebug]
label = Ctrl+Alt+F11: diagnóstico da transmissão da pele (vermelho = espessura medida, verde = luz que atravessa, azul = de costas para o sol)

[KeyPESShadowReadout]
label = Ctrl+Shift+F11: mostra (em blocos) a resolução real das sombras, para diagnóstico

[KeyPESContactToggle]
label = Ctrl+Shift+F4: sombras de contato liga/desliga

[KeyPESResetSweat]
label = Ctrl+Shift+F10: zerar o relógio do suor à mão

[KeyPESKitTexDetail]
label = Alt+Shift+F10: detalhe das texturas do uniforme liga/desliga

[KeyPESFaceTexDetail]
label = Alt+Shift+F11: detalhe das texturas do rosto liga/desliga

[KeyPESHairStrands]
label = Alt+Shift+F12: fios de cabelo liga/desliga

[KeyPESSkinLightV2]
label = Alt+Shift+1: sombras suaves no rosto + transmissão física da luz liga/desliga

[KeyPESFaceParts]
label = Alt+Shift+2: cílios / sobrancelhas mais nítidos liga/desliga

[KeyPESSkinCavity]
label = Alt+Shift+3: sombreado das cavidades da pele (orelhas, sobrancelhas) liga/desliga

[KeyPESSunDisk]
label = Alt+Shift+4: sol visível liga/desliga

[KeyPESKitPrints]
label = Alt+Shift+5: relevo das estampas liga/desliga

[KeyPESPostV2]
label = Alt+Shift+6: nitidez adaptativa / granulação suave liga/desliga

[KeyPESBloomV2]
label = Alt+Shift+7: bloom v2 liga/desliga

[KeyPESDofV2]
label = Alt+Shift+8: desfoque de lente v2 liga/desliga

[KeyPESGrassBounce]
label = Alt+Shift+9: rebote de luz do gramado liga/desliga

[KeyPESBodySkin]
label = Alt+Shift+B: pele do corpo v2 liga/desliga

[KeyPESKnit]
label = Alt+Shift+N: trama next-gen liga/desliga

[KeyPESRimToggle]
label = Alt+Shift+R: luz de contorno nos jogadores liga/desliga

[KeyPESSkyLightToggle]
label = Alt+Shift+C: luz do céu (ambiente hemisférico) liga/desliga

[MenuSunReal]
section = Iluminação
title = Sol realista
desc = A cor do sol muda com a altura: quente e dourada no pôr do sol, branca quente ao meio-dia.
slider = z4 | Realismo da cor | 0 | 1.5 | 0 = cor original do jogo. 1 = muda com a altura do sol.
slider = w4 | Intensidade do sol | 0.5 | 2 | Quanta luz direta o sol dá. 1 = original, 1.2 = um pouco mais forte.

[MenuSunQuality]
section = Iluminação
title = Sol de qualidade
desc = O sol deixa de ser um ponto: tem um disco de meio grau (ou mais, se quiser) e os brilhos o refletem nesse tamanho, conservando a energia. A luz que atravessa orelhas e nariz é calculada com a espessura REAL (o que o sol vê no shadow map contra o que a câmera vê): só se acendem quando o sol está realmente atrás.
slider = y64 | Diâmetro do sol | 0 | 6 | Em graus. 0.53 = o real; 0.9 = brilhos um pouco mais suaves; 3+ = sol com bruma. | %.2f
slider = z64 | Transmissão real (shadow map) | 0 | 2.5 | Quanta luz atravessa as zonas finas segundo a espessura medida. 0 = só a direcional antiga.
slider = w64 | Densidade da pele | 5 | 80 | Mais = a luz atravessa menos (só orelhas); menos = também nariz e bochechas. 30 = natural. | %.0f

[MenuSunFree]
section = Iluminação
title = Sol livre (experimento)
desc = Move o sol para onde quiser para ver como a luz responde (pele, transmissão contra a luz, gramado, uniformes). Muda a direção e a cor do sol na passada de iluminação; as sombras projetadas continuam sendo as do sol real da partida (o motor as calcula antes), então para experimentar a transmissão ponha o sol atrás do jogador e olhe orelhas e nariz.
slider = y101 | Azimute | 0 | 360 | Direção no plano (graus). | %.0f
slider = z101 | Elevação | -5 | 90 | Altura sobre o horizonte (graus). | %.0f
slider = w101 | Intensidade | 0 | 3
slider = x102 | Calor | 0 | 1 | 0 = cor do jogo, 1 = laranja de pôr do sol.

[MenuSunTurf]
section = Iluminação
title = Sol sobre o gramado
desc = Como numa foto da bola no gramado: cada folha tem seu lado ao sol e faz sombra nas de trás, a luz que atravessa as folhas sai amarelo-esverdeada e com o sol baixo o gramado fica dourado. Só muda o campo e as folhas, não os jogadores.
slider = x313 | Sombras entre folhas | 0 | 1 | Quanto a sombra de uma folha escurece a de trás (visível de perto e a meia distância). 0 = desligado. | %.2f
slider = y313 | Luz através das folhas | 0 | 1 | Tom amarelo-esverdeado da luz que atravessa as folhas. 0 = cinza como o jogo. | %.2f
slider = z313 | Sol baixo dourado | 0 | 1 | Com o sol baixo (pôr do sol), o gramado ao sol fica mais dourado. 0 = desligado. | %.2f
slider = x314 | Luz do céu na sombra do gramado | 0 | 2 | A sombra do gramado recebe a luz azulada do céu: 1 = como numa foto ensolarada (sombra a ~1/4 do sol); 0 = quase preta como antes. | %.2f

[MenuDayCurve]
section = Iluminação
title = Curva do dia
desc = Como a luz muda com a altura do sol (ideal com Daylight Engine, que move o sol durante a partida). Entre o ângulo "amanhecer" e o ângulo "meio-dia" se interpolam a intensidade do sol, a luz ambiente, a névoa e o calor. Com o sol no horizonte entra a "hora azul". Não mexe nos refletores à noite.
slider = y65 | Sol ao amanhecer | 0 | 2 | Multiplicador do sol com o sol baixo. 0.8 = um pouco mais fraco que o arquivo do estádio.
slider = z65 | Sol no meio da manhã | 0 | 2 | No meio do caminho entre os dois ângulos.
slider = w65 | Sol ao meio-dia | 0 | 2 | Com o sol alto. 1.1 = um pouco mais forte que o original.
slider = x66 | Ambiente ao amanhecer | 0 | 2 | Luz global (céu + rebote) com o sol baixo. Menos = sombras mais profundas no pôr do sol.
slider = y66 | Ambiente ao meio-dia | 0 | 2 | Luz global com o sol alto.
slider = z66 | Névoa ao amanhecer | 0 | 3 | Densidade da bruma com o sol baixo. 1.6 = manhã úmida.
slider = w66 | Névoa ao meio-dia | 0 | 3 | Densidade da bruma com o sol alto. 0.8 = ar limpo.
slider = x67 | Calor ao amanhecer | 0 | 1 | Quanto o sol fica laranja quando está baixo (soma-se ao "Sol realista").
slider = y67 | Hora azul | 0 | 1 | Tom azulado do ambiente com o sol bem no horizonte.
slider = z67 | Ângulo do amanhecer | 1 | 40 | Altura do sol (graus) onde termina o amanhecer. | %.0f
slider = x109 | Contraste de dia | 0 | 1 | Sobe o sol e baixa a luz ambiente ao mesmo tempo (sombras mais profundas, lado ao sol mais forte). 0 = como estava; 0.5 = dia de sol real.
slider = w67 | Ângulo do meio-dia | 20 | 90 | Altura do sol (graus) a partir da qual é "meio-dia". | %.0f

[MenuRim]
section = Iluminação
title = Luz de contorno nos jogadores
desc = Com o sol atrás do jogador, o contorno (ombros, braços, cabelo contra a luz) se acende como na TV. Só pele e uniformes, respeita as sombras e diminui com a distância.
slider = x46 | Força | 0 | 1.5 | Quanto brilha o contorno. 0.45 = sutil, 1 = muito marcado.
slider = y46 | Largura do contorno | 1.5 | 6 | Mais alto = contorno mais fino, colado à silhueta. 2 = largo, 5 = muito fino.

[MenuAtmosphere]
section = Iluminação
title = Atmosfera com sol dinâmico
desc = Com o sol baixo (Daylight Engine ou partidas à tarde) o arquivo de luz do estádio deixa uma bruma azul cobrindo o fundo (montanhas, arquibancadas de uma cor) e um sol muito apagado. Isto dessatura e esquenta a bruma distante segundo a altura do sol e compensa a força do sol nesses horários. De noite com refletores não faz nada.
slider = x54 | Menos bruma azul | 0 | 1 | Quanto se dessatura a bruma distante. 0 = a do arquivo de luz; 1 = cinza neutro.
slider = y54 | Sol baixo mais forte | 0 | 2 | Quanto se compensa o sol quando está baixo. 0.6 = natural; 1.5 = pôr do sol forte.
slider = z54 | Horizonte quente | 0 | 1 | Com o sol baixo, a bruma fica laranja em vez de azul.

[MenuGlobalLight]
section = Iluminação
title = Luz global do estádio
desc = A luz indireta pré-calculada do estádio (o "rebote" que ilumina tudo o que o sol não toca). É o shader do motor traduzido pelo PES21 FX: agora dá para ajustar a força, dar direção (mais luz no que olha para o céu, menos no que olha para o chão) e decidir quanto a oclusão a apaga.
slider = x56 | Força | 0 | 2.5 | Multiplica a luz global. 1 = a do arquivo de luz do estádio. Se o estádio parecer chapado, suba; se os jogadores brilharem na sombra, baixe.
slider = y56 | Contraste céu/chão | -1 | 2 | O que olha para cima recebe mais, o que olha para o chão menos. 0 = plano como o original; 0.5 = natural.
slider = z56 | Peso da oclusão | 0.25 | 2 | Quanto a oclusão ambiente apaga a luz global. 0.5 = original; 1 = frestas mais escuras.

[MenuTowers]
section = Iluminação
title = Refletores (noite)
desc = De noite o jogo ilumina com um único refletor dominante e os jogadores ficam chapados. Isto soma refletores virtuais girados em volta do estádio: vários brilhos na pele e nos uniformes e contornos acesos de lados diferentes, como na TV. Sem sombras, só brilhos e um pouco de luz envolvente. De dia não faz nada.
slider = x55 | Brilhos | 0 | 2 | Força dos brilhos dos refletores extras. 0.8 = natural; 1.5 = noite de TV muito marcada.
slider = y55 | Luz envolvente | 0 | 2 | Quanta luz difusa os refletores extras somam (preenche os lados na sombra). 0.6 = natural.
choice = z55 | Refletores extras | Um;Dois;Três | Quantos refletores virtuais além do do jogo. Três = estádio de 4 torres.

[MenuSkyLight]
section = Iluminação
title = Luz do céu
desc = Ambiente hemisférico: o que olha para cima recebe luz azulada do céu, o que olha para o chão não. Azul de dia, violeta no pôr do sol, quase nada de noite.
slider = x47 | Força | 0 | 3 | Quanta luz o céu soma. 1 = natural.
slider = y47 | Quão azul | 0 | 1 | 0 = luz cinza neutra, 1 = azul de céu completo.
slider = z47 | Cor do céu do motor + oclusão | 0 | 1 | 1 = o tom sai do horizonte (névoa) do próprio estádio com um zênite mais azul, e a luz do céu é ocluída pelo AO.

[MenuAO]
section = Iluminação
title = Oclusão ambiente melhorada
desc = Dobras e cantos deixam de ficar cinza sujo: em superfícies claras a luz rebate por dentro e nas coloridas toma o tom delas. O brilho se apaga nas frestas segundo a rugosidade.
slider = z48 | Força total | 0 | 1 | Quanto escurecem dobras e cantos. 0 = sem oclusão, 1 = a do jogo.
slider = x48 | Rebote de cor | 0 | 1 | 0 = sombra cinza do jogo. 1 = a sombra toma a cor da superfície (camisa vermelha = sombra avermelhada).
slider = y48 | Oclusão especular | 0 | 1 | Apaga o brilho nas frestas segundo a rugosidade e o ângulo de visão. Evita o aspecto de plástico.

[MenuGI]
section = Iluminação
title = Rebote de luz (iluminação global)
desc = Um rebote de luz difusa em espaço de tela: uma camisa iluminada tinge a pele ao lado, o campo ilumina as pernas. É o efeito mais caro da lista.
slider = w9 | Intensidade | 0 | 2 | 0 = desligado (economiza desempenho). 0.7 = suave, 1.6 = forte.
slider = w10 | Raio em metros | 0.5 | 4 | Até onde chega o rebote. Mais raio = mais suave e um pouco mais caro.

[MenuSkyRefl]
section = Iluminação
title = Reflexos do céu
desc = Toda superfície reflete o céu físico (e, olhando para baixo, o gramado ao sol): chuteiras, bola, pele suada, placas e bordas das camisas contra a luz. As lisas refletem nítido, as rugosas um brilho suave. Nas frestas (axilas, entre as pernas, sob o queixo) o reflexo se apaga com a oclusão. Precisa de "Céu físico".
slider = y151 | Força | 0 | 2 | 1 = físico.
slider = z151 | Oclusão do reflexo | 0 | 1 | Quanto o reflexo se apaga nas frestas. 1 = natural; 0 = sem oclusão.
slider = w151 | Gramado nos reflexos | 0 | 1 | O que olha para baixo reflete o gramado iluminado.

[MenuGITemporal]
section = Iluminação
title = Rebote de luz acumulado (temporal)
desc = O rebote de luz é calculado em meia resolução e acumulado entre quadros seguindo a câmera: quase sem ruído, com mais alcance (a arquibancada ao sol e as camisas claras tingem o que está ao lado) e mais barato que o da composição. Recomeça do zero a cada corte de câmera (sem rastros). O raio base continua em "Rebote de luz".
slider = y153 | Raio extra | 1 | 3 | Multiplica o raio do rebote. 1.5 = um pouco mais longe que antes.
slider = z153 | Quadros acumulados | 4 | 30 | Mais = mais limpo mas demora mais para seguir mudanças rápidas. | %.0f
slider = w153 | Força | 0 | 2 | 1 = o rebote real (com "Rebote físico"). 0 = usa a intensidade de "Rebote de luz".
choice = x315 | Rebote físico | Não;Sim | Cada ponto que rebate contribui segundo seu tamanho real, distância e ângulo: uma parede ou camisa iluminada ao lado se nota de verdade, e o que outro jogador tapa não chega. O campo fica a cargo de "Rebote de luz do gramado" (com o verde do estádio e a sombra do sol).
slider = y315 | Alcance distante | 0 | 8 | Até quantas vezes o raio chega o rebote longo (a arquibancada e o campo iluminados para as sombras). 0 = sem rebote distante. | %.1f
slider = z315 | Força do rebote distante | 0 | 2

[MenuGrassBounce]
section = Iluminação
title = Rebote de luz do gramado
desc = O campo manda luz esverdeada para cima: a parte de baixo das pernas, do calção e do queixo recebe esse rebote, como na TV.
slider = x42 | Força | 0 | 3 | 1 = natural.
slider = y42 | Quão verde | 0 | 1 | 0 = luz neutra, 1 = verde de gramado.
slider = z42 | Chão real | 0 | 1 | 1 = o rebote usa a sombra REAL do chão em volta de cada jogador, tirada do shadow map do sol (dados do mundo: igual com qualquer câmera e sem recalcular nos cortes), e o verde do campo medido uma vez por partida. Parado na própria sombra ou na do estádio recebe menos rebote. 0 = verde fixo e sem sombra.

[MenuFog]
section = Iluminação
title = Bruma do estádio
desc = A névoa/bruma que o jogo aplica a tudo e que "lava" a imagem. Menos bruma = mais contraste e cor.
slider = x11 | Quantidade de bruma | 0 | 1 | 1 = a do jogo, 0.55 = cerca da metade, 0 = sem bruma.

[MenuShadowPhys]
section = Sombras
title = Sombras físicas (plano receptor, cascatas, tamanho do sol)
desc = Três correções na sombra do sol. Plano receptor: cada amostra do filtro é comparada com a profundidade que a superfície tem nesse texel (sem acne e a sombra fica colada no pé). Mistura entre cascatas: na fronteira entre duas cascatas a sombra se mistura em vez de mudar de nitidez de repente. Penumbra física: no modo PCSS a largura da penumbra sai da distância ao oclusor e do diâmetro do sol do grupo "Sol de qualidade" (um único controle para a dureza de todas as sombras).
choice = x87 | Plano receptor | Não;Sim |
slider = y87 | Mistura entre cascatas (largura) | 0 | 0.3 | Faixa na borda de cada cascata onde se mistura com a seguinte (fração do tamanho da cascata). 0 = sem mistura. 0.1 = natural. | %.2f
choice = z87 | Penumbra pelo tamanho do sol | Não;Sim | Só modo PCSS. O slider "Penumbra PCSS" vira um multiplicador (200 = 1:1 físico).
slider = w87 | Limite do plano receptor | 1 | 40 | Proteção contra bordas e silhuetas: ajuste máximo por texel (x0.001). Suba se restar acne em superfícies muito rasantes. | %.0f

[MenuMicroShadow]
section = Sombras
title = Microssombras (poros, dobras e trama)
desc = Com o sol rasante, os poros da pele, as dobras da roupa e a trama do tecido fazem sombra em si mesmos (técnica da Naughty Dog): a luz rasante deixa de parecer chapada. A abertura sai da oclusão ambiente; só age no lado iluminado.
slider = x88 | Força | 0 | 1 | 0.6 = natural, 1 = marcado.

[MenuFlatLight]
section = Iluminação
title = Luz plana (teste)
desc = Desliga a iluminação do sol: tudo recebe a mesma luz, sem direção, sombras nem brilhos. Serve para ver as texturas e os materiais como são (também a partir do Inspetor). Não é para jogar.
slider = y89 | Nível | 0.2 | 3 | Quanta luz plana. 1 = parecido com um dia médio. | %.2f
choice = z89 | Brilhos especulares | Desligados;Manter | Manter deixa os brilhos do sol (para avaliar materiais).

[MenuShadowFilter]
section = Sombras
title = Filtro das sombras do sol
desc = Como se suavizam as bordas das sombras que o sol projeta.
choice = y20 | Modo | Original do jogo (8 amostras);Estável (16 amostras, bordas limpas);Contato realista (PCSS) | Estável: sem tremulação. PCSS: nítida nos pés do jogador e mais suave conforme se afasta.
slider = z20 | Raio do filtro (texels) | 0.5 | 3 | 1.5 = igual ao original. 1 = mais nítida, 2.5 = mais suave.
slider = x21 | Penumbra PCSS | 30 | 1000 | Quanto a sombra se alarga com a distância (só modo PCSS). | %.0f
slider = y21 | Raio máximo PCSS | 1 | 12 | Limite de suavidade no modo PCSS.
choice = w21 | Padrão | Fixo;Girar a cada quadro (o DLSS/TAA limpa) | Girar elimina o padrão visível se você usa DLSS ou TAA.

[MenuShadowDef]
section = Sombras
title = Definição das sombras
desc = Afia só a penumbra (a borda). A sombra completa e a luz completa não mudam.
slider = x20 | Força | 0 | 1 | 0.5 = moderado.

[MenuContact]
section = Sombras
title = Sombras de contato
desc = Sombras finas traçadas na tela em direção ao sol, as que o shadow map não resolve: o pescoço sob o queixo, o braço sobre o tronco, o cabelo sobre a testa, a chuteira contra o gramado. Só se calculam onde há sol (12 amostras no máximo).
slider = x52 | Força | 0 | 1.5 | Quão escura é a sombra. 0.7 = natural; 1 = marcada.
slider = y52 | Comprimento (m) | 0.05 | 1.5 | Até onde chega a sombra. 0.35 = detalhe fino (rosto, mãos); 0.8 = também o braço sobre o corpo. | %.2f
slider = z52 | Suavidade | 0 | 1 | 0 = borda sempre dura. 1 = quanto mais longe o oclusor, mais penumbra (como uma sombra real).

[MenuHeadShadow]
section = Sombras
title = Sombra própria da cabeça
desc = Um shadow map de alta resolução só para as 3 cabeças mais perto da câmera (1,8 mm por texel contra 2 cm no shadow map do estádio): nariz, sobrancelhas, queixo e cabelo fazem uma sombra legível no rosto de dia. Só em partidas com sol. Custa alguns desenhos a mais por quadro.
slider = y309 | Força | 0 | 1 | 1 = a sombra da cabeça tão escura quanto a do sol. 0.7 = mais suave.
slider = z309 | Suavidade | 0 | 4 | Raio do filtro em texels do atlas. 1 = borda fina; 3 = penumbra. | %.1f
slider = w309 | Viés | 0 | 5 | Deslocamento para que a pele não faça sombra em si mesma (acne). 1.5 = normal; se aparecerem listras, suba. | %.1f

[MenuDynSun]
section = Sombras
title = Sol dinâmico (Daylight Engine)
desc = Para quando o sol se move durante a partida (módulo Daylight Engine) e fica baixo. Com o sol rasante o shadow map mostra "acne" (listras no gramado e no rosto) e a borda da sombra treme ao se mover. O viés cresce só onde a superfície está rasante à luz, assim a sombra fica colada nos pés (as sombras de contato cobrem isso).
slider = x53 | Viés de inclinação | 0 | 4 | Quanto se corrige a acne nas superfícies rasantes. 1.5 = normal. Se aparecerem listras com o sol baixo, suba; se a sombra se descolar dos pés, baixe.
slider = y53 | Estabilidade da borda | 0 | 4 | Raio mínimo do filtro em texels. Mais alto = borda mais suave que não treme enquanto o sol se move. 1.5 = normal. | %.1f
