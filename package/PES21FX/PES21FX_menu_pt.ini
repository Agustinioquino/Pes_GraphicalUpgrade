desc = A curva de uma câmera de transmissão: codificação BT.709 com joelho, que comprime as altas luzes antes do branco (camisas brancas ao sol, nuvens e placas não estouram) e dá o contraste médio típico da TV. Substitui a curva do jogo; pode ser misturada com a LUT do estádio para manter sua cor.
