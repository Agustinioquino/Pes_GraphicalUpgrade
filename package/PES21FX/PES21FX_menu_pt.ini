slider = y82 | Inércia | 0 | 0.3 | Quanto o tecido fica atrás com o movimento. 0.05 = meia elástica real (1 mm caminhando, 4-5 mm em sprint); 0.12 = polaina solta; mais = exagerado. | %.2f
