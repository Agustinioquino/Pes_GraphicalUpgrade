[MenuEditorLight]
section = Rosto
title = Luz de teste no editor
desc = No editor e nos menus 3D o jogo ilumina com uma luz de estúdio frontal e plana, e não dá para julgar a pele. Com isto ligado se soma um sol de teste (dia, tarde ou noite) com sombra traçada na tela (nariz na bochecha, queixo no pescoço), brilho da pele e orelhas contra a luz, e a luz de estúdio baixa para que a sombra apareça. Só age onde o sol da partida não roda: na partida não muda nada.
