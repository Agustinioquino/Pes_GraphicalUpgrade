desc = Para comparar: com isto ligado o simulador de roupa fica como vem de fábrica (nenhuma das melhorias do PES21 FX: sem físico, sem tronco e braços como volume, sem deslizamento, sem inércia, sem umidade). Leva alguns segundos para aplicar (o mod recompila). Os valores do cloth.ini (folga, atrito) não mudam.

[MenuClothSeams]
section = Roupa (física)
title = Costuras presas (gola e punhos)
desc = A gola e os punhos são malhas separadas que o jogo move com o esqueleto; a camisa simulada é costurada a elas: numa faixa junto ao decote e no fim da manga o tecido segue exatamente o esqueleto, com uma transição suave para dentro. Elimina o desencaixe nessas costuras.
slider = y80 | Força | 0 | 1 | 1 = totalmente costurado. 0 = como antes.
slider = z80 | Largura da transição (cm) | 0.5 | 10 | Mais larga = o tecido se solta mais aos poucos a partir da costura. | %.1f

[MenuClothFit]
section = Roupa (física)
title = Caimento do tecido segundo o físico
desc = A camisa e o calção respondem ao corpo de cada jogador (o físico do editor: ombros, peito, cintura): num corpo largo o tecido se cola e marca o tronco; num magro fica afastado e balança mais. É progressivo segundo o quanto o corpo se afasta do padrão. O PES21 FX passa os valores ao simulador de roupa (no log aparece como "ajuste al fisico").
slider = y78 | Folga nos magros (mm) | 0 | 30 | Quanto o tecido se separa do corpo no jogador mais magro. | %.0f
slider = z78 | Aderência nos largos (mm) | 0 | 20 | Quanto mais o tecido se cola no jogador mais largo. | %.0f
slider = z79 | Peso da grossura de coxa e braço | 0 | 3 | O calção de um jogador de coxas grossas tem menos margem para se mover ao pular; com coxas finas, mais (o mesmo para manga e braço). Medido pelo volume real da perna. 1 = natural, 0 = desligado.
slider = y79 | Coxa de referência (cm) | 5 | 13 | Raio da coxa com o calção que conta como "normal". Mais grossa que isso = calção mais justo. | %.1f
slider = w78 | Faixa do físico | 0.05 | 0.5 | Quanto o corpo precisa se afastar do padrão (escala dos ossos) para chegar ao máximo. 0.15 = os corpos normais já respondem; 0.4 = só os extremos. | %.2f

[MenuClothBody]
section = Roupa (física)
title = A roupa colide com o corpo real
desc = A camisa e as mangas colidem com a pele real do jogador (o tronco do TorsoBody, os braços e o pescoço), já deformada pela pose, pelo físico e pela musculatura: a cada quadro a DLL pega a pele do corpo de cada jogador e o simulador de roupa não deixa o tecido se aproximar mais que a folga. Assim o tecido apoia onde o corpo realmente está e o corpo não o atravessa (também o braço contra o lado). No log aparece como "cuerpo: ... mallas de piel listas".
slider = y256 | Folga da pele (mm) | 0 | 15 | Distância mínima entre tecido e pele. 3-5 mm: o tecido apoia sem que a pele apareça entre os pontos do tecido; mais = roupa mais solta sobre o corpo. | %.0f
slider = z256 | Liberdade para o corpo (cm) | 0 | 6 | Quanto mais para dentro do corpo estimado pelo mod de roupa o tecido pode ir onde se conhece a pele real (a pele o segura). 0 = como antes; 2 = a camisa cai sobre o corpo e marca o tronco. | %.1f
slider = w256 | Empurrão máximo por passo (mm) | 1 | 30 | Quanto a pele pode empurrar o tecido em cada passo da física (uns 11 por quadro). Mais = corrige mais rápido quando um braço entra na camisa; menos = mais suave. | %.0f

[MenuClothWet]
