[MenuTurfFar]
section = Campo e céu
title = Gramado no campo inteiro
desc = Um único gramado para o campo inteiro, em todas as câmeras e a qualquer distância. De perto, tufos próprios de 512 px (curto, médio, longo) com três trechos que se curvam como uma folha real, com normal por folha, giro, largura e altura aleatórios; mais longe, três níveis de parcelas (0,5 / 1 / 2 m) que a GPU monta com a câmera do mesmo quadro segundo o tamanho que uma folha tem na tela, fundidos entre si; onde uma folha já não tem tamanho na tela, a base do campo toma o aspecto do gramado visto de longe. As sombras de jogadores e bola também caem sobre este gramado. Os outros cartões desta seção (Folhas, Cor, Luz, Corte e vento, Desgaste) regulam o mesmo gramado. Custa FPS: Qualidade e Densidade são os reguladores.
choice = x104 | Folhas | As do jogo (128 px);Próprias do mod (512 px) | Próprias = tufos com nervura, veios, pontas finas e normal por folha; necessárias para tipo de gramado, desgaste, zonas e cor nas folhas. As do jogo = o tufo original, só estendido ao campo inteiro.
choice = x61 | Qualidade | Leve;Média;Alta;Máxima;Ultra (todas as parcelas) | Quanto as folhas cobrem a tela (Leve 0,6x, Média 1x, Alta 1,4x, Máxima 1,8x, Ultra 2,4x) e a largura mínima de uma folha em pixels (1,8 / 1,5 / 1,3 / 1,2 / 1,0). Ultra carrega tudo no máximo como antes: todas as camadas de muito perto, folhas 3D até o fundo do campo e sem densidade adaptativa (custa FPS). Média = bom equilíbrio numa RTX 4060.
slider = x58 | Densidade | 0.3 | 2 | Quantas folhas por pixel de tela: a quantidade de cartões de cada parcela é calculada segundo seu tamanho na tela, assim o gramado fica igualmente denso de perto e de longe e em qualquer câmera, e o custo depende do tamanho da tela, não do plano. 1 = natural; 1.5 = 50 % mais folhas (menos FPS).
slider = x333 | FPS alvo (densidade adaptativa) | 0 | 144 | A DLL mede os FPS e baixa a densidade do gramado do mod quando ficam abaixo, e sobe quando sobram. 0 = desligado; a qualidade Ultra a ignora. Com 70 o gramado ficava quase sempre no mínimo (a densidade não é o que mais pesa): 50 = só corta nas quedas. Com sincronismo vertical a 60 Hz use 55 ou menos. | %.0f
slider = y333 | Densidade mínima adaptativa | 0.2 | 1 | Até onde a densidade pode baixar para alcançar os FPS (0.4 = 40 %). | %.2f
