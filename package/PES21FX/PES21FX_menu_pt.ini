[MenuHairTypes]
section = Rosto
title = Tipos de cabelo (PES21FX_hair.ini)
desc = Cada rosto recebe um tipo de cabelo (curto, cacheado, black, longo, gel, loiro, grisalho...) definido em PES21FX_hair.ini: comprimento, cacho, grossura, densidade, brilho, cor de raiz e ponta, e multiplicadores das sobrancelhas. Os pelos nascem de um MAPA DE CABELO por rosto (png: vermelho = densidade, verde = comprimento, azul = direção do penteado). O mod o gera a partir da textura do rosto; "Gravar mapas de cabelo" salva esses mapas em PES21FX\hair\auto\<id>.png junto com lista.txt (id de cada rosto): pinte um, copie para PES21FX\hair\<id>.png e atribua o tipo em [caras]. O log diz "pelo: cara <id> -> tipo".
