[MenuLED]
section = Estádio
title = Placas de LED (luz própria)
desc = No jogo as placas de publicidade são iluminadas como uma parede: na sombra ficam escuras e de noite parecem apagadas. Uma placa de LED emite luz própria: aqui se soma sua luz com um brilho físico (fixo, como um painel real), assim ela parece acesa na sombra, de dia o sol a lava um pouco e de noite brilha muito mais que as superfícies iluminadas e irradia, como na TV. De perto se vê a grade de LEDs e de lado o painel escurece (os LEDs têm ângulo de visão). Só age nas publicidades (texturas largas) e nos anéis de LED.
