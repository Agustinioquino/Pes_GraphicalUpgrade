[MenuSkinTone]
section = Pele
title = Tom de pele real (todos os tons)
desc = Toda pele humana cai numa faixa estreita de cor (vermelho > verde > azul) que vai do rosado pálido ao marrom quente segundo a melanina. As texturas do jogo e a luz do estádio às vezes a empurram para fora (rostos laranja, amarelados ou cinza-esverdeados). Isto aproxima a cor de cada pele da faixa real PARA A MESMA CLARIDADE: cada jogador mantém seu tom, só deixa de parecer tingido; barba, sobrancelhas e cabelo pintados não se tocam. A dispersão (SSS) também segue o tom: na pele clara a borda da sombra é avermelhada; na escura a melanina absorve esse vermelho e a penumbra fica marrom quente, como na realidade.
slider = y140 | Correção da cor | 0 | 1 | 0 = a cor do jogo; 0.35 = natural; 1 = tudo dentro da faixa real. | %.2f
slider = z140 | SSS por tom | 0 | 1 | 0 = a mesma dispersão vermelha para todos (como antes); 1 = segundo a melanina de cada pele. | %.2f
