title = Bandeiras e rede
desc = O jogo ilumina os tecidos (bandeiras de escanteio e do estádio, a rede do gol) com "meio Lambert": tudo lavado e chapado, e uma bandeira contra a luz fica cinza. Bandeiras: Lambert de frente com um pouco de envolvimento e a luz que ATRAVESSA o tecido do lado contrário ao sol, com a cor do tecido (contra a luz se acendem como na TV), mais o brilho de tecido na borda. Rede: cada fio parece redondo (lado iluminado e lado em sombra), brilho de nylon ao longo do fio com o sol, trançado de perto, e a rede não some de longe.
