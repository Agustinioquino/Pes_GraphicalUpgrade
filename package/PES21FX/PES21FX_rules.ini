; ---- tonemap: disco del sol, cielo
[rule 5f32caac5c76ab76]
srv = 21 Depth
cb = 12 SceneCB
cb = 13 LightCB

; ---- shaders de luz: copian el cbuffer de la luz principal
[rule a748f426e9b978cc]
copy_cb = 3 LightCB
[rule b8a29991599380d3]
copy_cb = 3 LightCB
[rule d51409f5f8d54cbd]
