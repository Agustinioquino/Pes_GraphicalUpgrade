; PES21 FX - reglas por shader (lo que en 3DMigoto eran los [ShaderOverride]).
; [rule <hash>]  y debajo, una accion por linea:
;   copy_cb = <slot> <nombre>   copia el cbuffer del slot a un recurso con nombre
;   ref_srv = <slot> <nombre>   guarda una referencia a la textura del slot
;   cb      = <slot> <nombre>   enlaza el cbuffer con nombre en el slot (solo para este dibujo)
;   srv     = <slot> <nombre>   enlaza una textura con nombre, o file:textures\x.dds
;   param   = <xN> <valor|$var> parametro solo durante este dibujo
;   event   = turf              el cesped se dibujo (reloj del partido)

; ---- arrugas de la cara (piel de la cara)
[rule 5ce3ed8702271bc1]
srv = 20 file:textures\pes_wrinkle_normal_2048.dds
srv = 21 file:textures\pes_wrinkle_mask_512x1024.dds
srv = 22 file:textures\pes_sss_face.dds
; quinta textura generada en vivo por cara (facegen.cpp + shaders\pes_facegen_ps.hlsl): mapa A en t23, mapa B en t24
facegen = 23 24
srv = 25 file:textures\pes_face_zones.dds

; ---- composicion: guarda profundidad y cbuffer de escena para el tonemap; recibe la luz del sol

; ---- misma cara con animacion facial (primeros planos): mismas texturas y regla
[rule ce188ae110354aea]
srv = 20 file:textures\pes_wrinkle_normal_2048.dds
srv = 21 file:textures\pes_wrinkle_mask_512x1024.dds
srv = 22 file:textures\pes_sss_face.dds
; quinta textura generada en vivo por cara (facegen.cpp + shaders\pes_facegen_ps.hlsl): mapa A en t23, mapa B en t24
facegen = 23 24
srv = 25 file:textures\pes_face_zones.dds

; ---- composicion: guarda profundidad y cbuffer de escena para el tonemap; recibe la luz del sol
[rule 619b86cb5691cdce]
ref_srv = 11 Depth
copy_cb = 2 SceneCB
cb = 13 LightCB

[rule f807e74d5b900a15]
ref_srv = 11 Depth

; ---- luz global del estadio: recibe la luz del sol (curva del dia)
[rule fda6da09737592b1]
