[MenuMusclePlayers]
section = Cuerpo
title = Musculatura por jugador
desc = Valores propios para un jugador; el resto sigue con los de las tarjetas generales. Elegí al jugador (en Editar > Jugadores aparece solo el que estás editando; en un partido o una repetición se puede elegir cualquiera de la cancha), apretá "Darle valores propios" y movés sus sliders: el cambio se ve al instante, sólo en él, y se guarda solo en PES21FX\musculatura_jugadores.ini (por id del jugador, sirve en todos los modos). Los interruptores (ropa, codos y rodillas) y la definición muscular son de todos. También dentro del juego: en Editar > Jugadores > Físico, la fila "Musculatura" (o R1) abre las páginas de ese jugador: torso y brazos, cintura y piernas (-25 a +25) y piel (tono propio). L1 / R1 cambian de página y Atrás vuelve.
special = musculatura_jugador

