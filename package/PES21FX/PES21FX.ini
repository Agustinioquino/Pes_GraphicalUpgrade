type = cycle
x28 = 1.0, 0.6, 1.3, 0.8

[KeyPESClothDebug]
; Alt+Shift+F6: diagnostico de kits (magenta = detectado como tela de kit) / normal
Key = no_ctrl alt shift VK_F6
type = cycle
w26 = 2, 1

[KeyPESGrassV2]
; Alt+Shift+F7: color natural del pasto on/off
Key = no_ctrl alt shift VK_F7
type = toggle
w29 = 0

[KeyPESGrassHue]
; Alt+Shift+F8: correccion del amarillo del pasto 1.0 / 0.0 / 0.6
Key = no_ctrl alt shift VK_F8
type = cycle
x29 = 1.0, 0.0, 0.6

[KeyPESKitShadowBias]
; Alt+Shift+F9: sesgo de sombra en kits 0.0006 / 0.0012 / 0 / 0.0003
Key = no_ctrl alt shift VK_F9
type = cycle
x30 = 0.0006, 0.0012, 0, 0.0003

[KeyPESWrinkleHiTex]
; Ctrl+Alt+Shift+F12: texturas de arrugas remasterizadas on/off
Key = ctrl alt shift VK_F12
type = toggle
x15 = 0

; ===================== PES 2021: piel detras de la ropa (anti z-fighting) =====================

; ===================== PES 2021: deteccion de inicio de partido =====================

[KeyPESSunToggle]
; Ctrl+Shift+F5: sol realista on/off
Key = ctrl shift no_alt VK_F5
type = toggle
z4 = 0

[KeyPESGrassToggle]
; Ctrl+Shift+F6: sombreado del pasto on/off
Key = ctrl shift no_alt VK_F6
type = toggle
y10 = 0

[KeyPESGIToggle]
; Ctrl+Shift+F1: rebote de luz (SSGI) on/off
Key = ctrl shift no_alt VK_F1
type = toggle
w9 = -1

[KeyPESGICycle]
; Ctrl+Shift+F2: intensidad del rebote de luz
