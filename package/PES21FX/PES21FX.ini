desc = No toda la cara suda igual ni a la vez: frente, sienes y nariz primero; mejillas, mentón y mandíbula después. Un mapa de zonas de la cara reparte el sudor: una película de brillo progresiva (antes de que aparezcan gotas) y las gotas salen donde corresponde.
