title = Carteles LED (luz propia)
desc = En el juego los carteles de publicidad se iluminan como una pared: en la sombra se apagan y de noche se ven opacos. Un cartel LED emite su propia luz: acá se le suma luz propia con brillo físico (fijo, como un panel real), así se ve encendido en la sombra, de día lo lava un poco el sol y de noche brilla mucho más que lo iluminado y hace resplandor, como en TV. De cerca se ve la grilla de LEDs y de costado el panel se oscurece (los LED tienen ángulo de visión). Sólo actúa sobre las publicidades (texturas apaisadas) y los anillos LED.
