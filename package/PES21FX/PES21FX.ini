desc = Capa de nubes real trazada por rayos sobre el cielo (no una textura): tienen volumen, sombra propia, borde iluminado a contraluz y se mueven con el viento. Con "Dentro del cielo del juego" reemplazan a las nubes pintadas del estadio y quedan fijas en el mundo: no se mueven con la cámara. La misma capa proyecta sombra sobre la cancha (ver "Sombra de nubes"). Cuesta algo de GPU en planos con mucho cielo; bajar "Calidad" si hace falta. Si el cielo sale invertido o las nubes aparecen bajo el horizonte, usar los dos interruptores de ejes.
