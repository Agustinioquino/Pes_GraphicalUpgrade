[MenuHairReact]
section = Pelo
title = Reacción del pelo (inercia)
desc = Al girar la cabeza, cabecear, saltar o frenar, los mechones quedan un instante atrás y después acompañan. Usa la pose del cuadro anterior que el juego ya calcula: no cuesta rendimiento. Se congela en pausa y se frena en cámara lenta.
