title = Quinta textura (generada por cara)
desc = El juego le da al shader de cara cuatro texturas (color, normal, brillo y translucidez). PES21 FX genera una quinta en vivo, para CADA cara, a partir de esas cuatro la primera vez que aparece: cavidades (pliegues, alas de la nariz, comisuras), curvatura, grosor real de la piel (orejas, nariz, labios, párpados) y la máscara exacta de barba, cejas y nacimiento del pelo. Reemplaza al mapa genérico donde existe. Las caras ya generadas se rehacen al cambiar de partido.
