slider = x | Translucidez | 0 | 2 | Cuánto deja pasar la luz la piel. 1 = natural, más = tono más rojizo.
slider = y | Intensidad general | 0 | 2 | Fuerza del conjunto de mejoras de piel.
slider = x2 | Calidez de orejas, nariz y labios | 0 | 1 | Tinte cálido en las zonas finas.

[MenuBodySkin]
section = Piel
title = Piel del cuerpo
desc = Brazos, piernas y cuello reciben las mismas mejoras que la cara (luz de piel, cavidades, nitidez).
toggle = w43

[MenuSSS]
section = Piel
title = Dispersión de luz en la piel (SSS)
desc = La luz se difunde por debajo de la piel: el borde entre luz y sombra sobre la cara es suave y cálido en vez de un corte duro. El lado iluminado siempre sigue al sol (v3: borde angosto, la sombra queda sombra). Apagado = borde casi duro.
toggle = z3
slider = x3 | Ancho de la difusión | 0.5 | 3 | Ancho del borde suave y rojizo entre luz y sombra. No mueve la luz: el lado iluminado sigue al sol. 1.5 = natural.
slider = y3 | Sangrado rojo en el borde de la sombra | 0 | 2 | Más = borde de la sombra más rojizo.
slider = w3 | Brillo base de la piel | 0 | 2 | Especular de la piel.

slider = x76 | Intensidad de la dispersión (v2) | 0 | 3 | Fuerza general del rojo de la penumbra y de la luz que atraviesa la piel. 1 = normal, 0 = casi apagado.
slider = y76 | Zonas que dejan pasar luz | 0 | 1 | 0 = sólo orejas, aletas de la nariz y labios; 1 = toda la piel (como la primera versión). 0.35 = natural.
slider = z76 | Rojo de la penumbra | 0 | 2 | Cuánto se tiñe de rojo el borde entre luz y sombra.

[MenuSSSMap]
section = Piel
title = Mapa de SSS de la cara
desc = Un mapa de grosor de la piel hecho a partir de caras reales del juego (todas comparten el mismo plano de textura): orejas, aletas de la nariz, labios y párpados son finos y dejan pasar más luz; frente y mandíbula no. También marca dónde la piel está más irrigada (tinte rojizo) y la "piel pre-integrada" hace que la difusión dependa de la curvatura real de la superficie.
toggle = x62
slider = y62 | Finura de las zonas finas | 0 | 1 | Cuánto sube la translucidez en orejas, nariz y labios. 0.85 = natural.
slider = z62 | Sangre bajo la piel | 0 | 1.5 | Tinte rojizo en las zonas irrigadas (mejillas, nariz, orejas).
slider = w62 | Piel pre-integrada | 0 | 1 | La difusión crece donde la superficie es curva (nariz, orejas) y baja en lo plano (frente).

[MenuSkinAdv]
section = Piel
title = Piel avanzada
desc = Transmisión a contraluz (orejas que se iluminan con el sol detrás), brillo fino de grasa/sudor y suavizado de la sombra sobre la piel.
slider = x5 | Transmisión a contraluz | 0 | 1.5 | Cuánta luz atraviesa orejas y nariz con el sol de frente a la cámara.
slider = y5 | Brillo fino (grasa/sudor) | 0 | 1.5 | Segundo brillo, más pequeño y nítido.
slider = z5 | Suavizado de sombra en piel | 0 | 1 | Ablanda la sombra proyectada sobre la piel.

[MenuSkinShadow]
section = Piel
title = Sombras suaves en la cara
desc = El borde de la sombra del sol se filtra más ancho sobre la piel (sin escalones) y la transmisión es física: la luz que atraviesa pierde primero el azul.
toggle = w34
slider = x34 | Ancho del filtro sobre la cara | 1 | 4 | 1 = igual que el resto, 2.2 = suave sin escalones.
slider = y34 | Densidad del tejido | 0.3 | 2 | 1 = piel real. Menos = orejas y nariz más luminosas a contraluz.

[MenuCavity]
section = Piel
title = Cavidades de la cara
desc = Oscurece pliegues y huecos desde el normal map: orejas, arco de las cejas, aletas de la nariz.
toggle = w35
slider = x35 | Fuerza | 0 | 1 | 0.6 = natural.

[MenuSkinAmbient]
section = Piel
title = Ambiente sobre la piel
desc = La luz ambiente del estadio es gris/verdosa; sobre la piel se calienta un poco y la oclusión toma un tinte rojizo.
slider = y11 | Calidez del ambiente | 0 | 1 | 0 = gris del estadio.
slider = z11 | Oclusión rojiza | 0 | 1 | Los pliegues de la piel se oscurecen hacia el rojo, no al gris.

[MenuFaceTex]
section = Piel
title = Detalle de textura de la cara
desc = Fuerza al juego a usar la textura de máxima resolución de cara y poros a más distancia.
toggle = w32
slider = x32 | Color y brillo | -2 | 0 | Más negativo = más nítido (y algo más de titileo).
slider = y32 | Normal map (poros) | -2 | 0 | Más negativo = poros visibles desde más lejos.

; ---------------------------------------------------------------- CARA
[MenuSkinSpecPhys]
section = Piel
title = Brillo de piel físico
desc = El brillo de la piel deja de ser una cera amarilla: toma el color del sol (no el tinte del material), es débil mirando de frente y crece en la silueta como en la piel real (Fresnel con F0 de piel), y se puede bajar en conjunto.
toggle = w103
slider = x103 | Color del sol en el brillo | 0 | 1 | 1 = el brillo es blanco/solar, 0 = con el tinte del material del juego.
slider = y103 | Fresnel de piel | 0 | 1 | 1 = débil de frente, fuerte en el borde de la cara.
slider = z103 | Fuerza del brillo | 0.2 | 2 | Multiplica todo el brillo de la piel.

[MenuSSSS]
section = Piel
title = Dispersión de piel UNIFICADA (SSSS)
desc = La dispersión principal del mod (técnica de Jimenez: dos pasadas con el perfil de piel real de d'Eon, en milímetros, escalado por la profundidad, solo sobre piel). Al prenderla se apagan solas las difusiones viejas que se pisaban con ella: la de 16 muestras, el suavizado de sombra sobre piel y el filtro ancho del borde. Las transmisiones (orejas/nariz a contraluz) y el mapa de grosor siguen activos: no son difusión.
toggle = w95
slider = x95 | Ancho | 0.3 | 3 | 1 = escala real (la luz viaja ~6 mm bajo la piel).
slider = y95 | Fuerza | 0 | 1
slider = z95 | Corte por profundidad | 0 | 4 | Más = no mezcla entre partes a distinta distancia (nariz contra mejilla).
slider = x100 | Sangrado rojo extra | 0 | 1 | El rojo viaja más lejos que el verde y el azul (borde de sombra cálido).
slider = w100 | Tinte de la penumbra | 0 | 1 | Rojizo en el borde entre luz y sombra.

[MenuSkinMicro]
section = Cara
title = Micro normal de poros
desc = Mosaico fino de poros (dos tamaños), red de celdas de la piel y rugosidad, sumado a la normal de cada cara. Solo actúa de cerca: a distancia se apaga solo para no meter ruido. Vale para caras base, importadas y genéricas.
toggle = w94
slider = x94 | Intensidad | 0 | 2 | 2.00 = vista de diagnóstico (mosaico en crudo).
slider = y94 | Escala (repeticiones) | 3 | 20 | Más = poros más chicos. | %.0f

[MenuFaceFeatures]
section = Cara
title = Rasgos de la cara (cuencas y pliegues)
desc = Comparando con el juego original, la cara del mod salía más clara y con los rasgos lavados: el multirebote de la oclusión ambiental aclara las cuencas en superficies claras (una cuenca de 0.5 pasaba a 0.72 en la piel) y la iluminación global en pantalla las rellena. Esto hace la oclusión de la piel más honda y sin multirebote, y baja el relleno del SSGI sólo en la piel. Además el sol ya no se apila (curva del día x sol realista x contraste de día daba 1.58x sobre los jugadores; ahora ~1.2x).
slider = x124 | Rasgos | 0 | 1 | 0 = como antes; 0.6 = cuencas y pliegues del original; 1 = marcados.

[MenuFaceLOD]
section = Cara
title = LOD de caras (malla de máximo detalle a distancia)
desc = El motor elige en la CPU qué malla dibuja de cada jugador según la distancia (LOD) y los mods que parchean bytes no cambian eso. Esto va por otro camino: la DLL se aprende, por cara, los buffers de la malla de más detalle que vio y, cuando esa cara vuelve con la malla reducida, dibuja la de máximo detalle en su lugar (sólo si el shader de vértices y los cbuffers coinciden, así el esqueleto es el mismo). Pasá primero por el "Diagnóstico": anota en el log, por cara, con cuántos vértices se dibuja, con qué shaders y a qué distancia cambia; con eso se ve si el motor usa varias mallas o no. Las expresiones faciales de los jugadores lejanos no se pueden forzar desde la GPU (la CPU no las calcula).
toggle = y118
choice = x118 | Diagnóstico en el log (cada 20 s) | No;Sí | Apagalo después de leer el log: cuesta algo de rendimiento.
slider = z118 | Distancia máxima (m) | 0 | 120 | 0 = siempre; p.ej. 40 = sólo jugadores a menos de 40 m.
choice = w118 | Compatibilidad | Estricta (mismo shader de vértices);Permisiva (mismo layout) | Permisiva puede deformar mal si el esqueleto difiere.

[MenuFaceGen]
section = Cara
title = Quinta textura (generada por cara)
desc = El juego le da al shader de cara cuatro texturas (color, normal, brillo y translucidez). PES21 FX genera una quinta en vivo, para CADA cara, a partir de esas cuatro la primera vez que aparece: cavidades (pliegues, alas de la nariz, comisuras), curvatura, grosor real de la piel (orejas, nariz, labios, párpados) y la máscara exacta de barba, cejas y nacimiento del pelo. Reemplaza al mapa genérico donde existe. Las caras ya generadas se rehacen al cambiar de partido.
toggle = x68
slider = y68 | Cavidades | 0 | 1.5 | Oscurece y enrojece los huecos finos de la cara y los deja más mates. 0.7 = natural.
slider = z68 | Grosor de la piel | 0 | 1 | Cuánto manda el grosor generado sobre la translucidez del juego (orejas y nariz dejan pasar la luz).
slider = w68 | Vello y pelo | 0 | 1 | Barba, cejas y nacimiento del pelo sin brillo ni dispersión de piel.

[MenuWrinkles]
