; PES21 FX - configuracion (mismo formato que el pes_mod.ini de 3DMigoto).
; [Constants] = valores de los efectos; [Key...] = teclas. Las reglas por shader estan en PES21FX_rules.ini.
; El menu en pantalla (tecla Insert) guarda aca los valores cuando apretas 'Guardar'.

[PES21FX]
; captura automatica en partido (jpg + luz.txt en PES21FX\capturas\) para calibrar la luz sin sacar capturas a mano
auto_captura = 1
auto_captura_seg = 20
auto_captura_max = 150
; LOD de texturas (20/10): anisotropico forzado en todos los samplers del juego (1 = como el juego, 16 = maximo) y sesgo de mip global (negativo = mas nitido a distancia, cuesta algo de titileo; 0 = como el juego)
aniso = 16
mip_bias = 0
menu_key = VK_INSERT
; tutoriales al principio de cada pestana del menu (1 = si, 0 = no; el boton "No mostrar mas" lo pone en 0)
tutorials = 1

; =====================================================================================
;  PES 2021 - mod de iluminacion, piel, sombras, kits y pelo (3DMigoto)
