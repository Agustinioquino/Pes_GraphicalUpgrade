; PES21 FX - configuracion (mismo formato que el pes_mod.ini de 3DMigoto).
; [Constants] = valores de los efectos; [Key...] = teclas. Las reglas por shader estan en PES21FX_rules.ini.
; El menu en pantalla (tecla Insert) guarda aca los valores cuando apretas 'Guardar'.

[PES21FX]
menu_key = VK_INSERT

; =====================================================================================
;  PES 2021 - mod de iluminacion, piel, sombras, kits y pelo (3DMigoto)
;  Este archivo lo incluye d3dx.ini ([Include] include = pes_mod.ini).
;  Todo lo propio del mod vive aca; d3dx.ini queda como viene con 3DMigoto.
;  Shaders: ShaderFixes_v2\ (override_directory en d3dx.ini). Texturas: ShaderFixes_v2\pes_wrinkle_*.dds
;  Recarga en caliente: F10 (config_reload de 3DMigoto).
; =====================================================================================

[Constants]
; ===== PES 2021 mod de piel e iluminacion (PERFIL ESTABLE 09/10) =====
; Apagados por estabilidad: SSGI (w9=-1, Ctrl+Shift+F1 lo prende), sombras de contacto (y12=-1, Ctrl+Shift+F4),
; reflejos SSR y relieve en pantalla (desactivados en el shader), mejoras de piel (w=0, Ctrl+Shift+F9). Piel menos roja (y, x, x2, x3, y3, x5, y11, z11, x12 bajados).
; Piel (shader 5ce3ed8702271bc1). w = 1 mejoras de piel ON (16/10: reactivadas; Ctrl+Alt+F7 compara con la original)
; Con w = 1 tambien se activa la luz de piel en los shaders de luz (SSS por canal, transmision, brillo fino)
; 16/10 (era 1.2) translucidez de la piel: menos tinte rojo
x = 1.0
y = 1.0
z = 0.7
w = 1
; 16/10 (era 0.5) calidez de orejas/nariz/labios
x2 = 0.3
y2 = 1.0
; Tonemap / gradacion (shader 5f32caac5c76ab76)
x1 = 0.95
; 16/10 (era 1.08) saturacion
y1 = 1.03
; 16/10 (era 0.22) contraste: de lejos la piel oscura ya no se hunde
z1 = 0.12
w1 = 1
z2 = 1.0
; 16/10 (era -0.05) levanta apenas las sombras en vez de hundirlas
w2 = 0.04
; SSS NATIVO de la piel (compute 87c07ee8/551d79df): x3 = ancho (1 = original), y3 = intensidad (1 = original)  [Ctrl+Alt+F1 / Ctrl+Alt+F2]
x3 = 1.5
; 16/10 (era 1.4) sangrado rojo en el borde de la sombra de la piel
y3 = 1.0
z3 = 1
w3 = 0.9
; Oclusion ambiental del motor (SSAO)
x4 = 1.6
y4 = 1
; Sol realista: z4 = realismo del color segun altura del sol (0 = original), w4 = intensidad del sol
z4 = 1
w4 = 1.2
; Pasto: y10 = sombreado/oclusion entre hojas, z10 = variacion macro y zonas secas (x10 lo calcula el reloj)
y10 = 1
z10 = 1
; w10 = radio del rebote de luz en metros
w10 = 1.6
; y12 = sombras de contacto (fuerza), z12 = largo en metros
y12 = -1
z12 = 0.35
; Piel avanzada: transmision a contraluz, lobulo fino, suavizado de sombra
x5 = 0.5
y5 = 0.45
w5 = 0
z5 = 0.5
; v2 LOOK MODERNO (tonemap): x6 luces altas suaves, y6 tono partido frio/calido, z6 claridad, w6 viñeta  [Ctrl+Shift+F7 = on/off]
x6 = 0.8
y6 = 0.5
; 16/10 (era 0.5) claridad (contraste local)
z6 = 0.25
w6 = 0.12
; v2: x7 = arrugas de expresion (1 = original), y7 = cielo mas azul y nubes con volumen (0 = original)
x7 = 1.0
y7 = 0.7
z7 = 1
w7 = 0.12
; Gotas de sudor: cantidad, tamano, velocidad, on/off
x8 = 0.35
y8 = 1.4
z8 = 1.0
w8 = 1
; Sudor progresivo (minutos REALES desde que arranca el partido): inicio, maximo, vello facial, diagnostico
x9 = 3
y9 = 9
z9 = 1
; w9 = iluminacion global en pantalla (rebote de luz): 1 = normal, 0 o -1 = apagado
; 16/10: reactivada (el patron ahora rota cada cuadro y el TAA limpia el ruido). Ctrl+Shift+F1 on/off
w9 = 0.7
; Composicion: niebla (1 = original), calidez ambiente piel, AO rojizo piel, on/off
x11 = 0.55
y11 = 0.25
z11 = 0.3
w11 = 1
; Rubor progresivo por esfuerzo
x12 = 0.03
w12 = 0
; Arrugas de expresion (shader de piel 5ce3ed87). x7 (arriba) = ganancia global
; x13 curva, y13 sombreado de pliegues, z13 sonrisa->patas de gallo, w13 on/off  [Ctrl+Shift+F12]
; x14/y14/z14/w14 = frente+sienes / entrecejo / ojos / boca ; w15 = signo Y para surcos (-1 = correcto)
; x15 = 1 texturas de arrugas remasterizadas (2048 + mascara con nasogeniano y pomulos)  [Ctrl+Alt+Shift+F12]
; Ctrl+Alt+F12 cicla la ganancia x7: 0.7 / 1.4 / 1.0 ; y15 = zona muerta (cara en reposo sin arrugas)
x13 = 0
y13 = 0.35
z13 = 0.4
w13 = 1
x14 = 1.0
y14 = 1.0
z14 = 1.0
w14 = 1.0
w15 = -1
x15 = 1
y15 = 0.15
; Fisica de la expresion (sin subir arrugas): x16 sangre en pliegues / palidez en piel tensa,
; y16 brillo de la piel estirada, z16 translucidez, w16 on/off  [Ctrl+Alt+Shift+F11]
x16 = 0.4
y16 = 0.4
z16 = 0.4
w16 = 1
; Interior de la boca (shader 63fab773): x17 oclusion de la cavidad, y17 humedad/saliva,
; z17 blancura de dientes (1 = original), w17 on/off [Ctrl+Alt+Shift+F9]
; x18 reflejo dentro de la boca (1 = original), y18 translucidez encia/lengua,
; z18 diagnostico de zonas [Ctrl+Alt+Shift+F8], w18 encia/lengua usan la luz de piel
x17 = 0.5
y17 = 0.6
z17 = 0.88
w17 = 1
x18 = 0.45
y18 = 1.3
z18 = 0
w18 = 1
; Ojos (shaders 4900d7a9 / 18821daf): x19 anillo limbal, y19 sombra de parpado y cuenca,
; z19 brillo nitido (mismo pico, menos halo), w19 on/off [Ctrl+Alt+Shift+F7]
x19 = 0.35
y19 = 0.22
z19 = 0.5
w19 = 1
; Definicion de sombras del sol (penumbra mas nitida, sombra y luz plenas no cambian):
; x20 fuerza (0..1), w20 on/off [Ctrl+Alt+Shift+F6]
x20 = 0.5
w20 = 1
; Sombras v2 (15/10) - filtro del mapa de sombras del sol, en los 5 shaders de luz:
; y20 = 0 filtro original del juego (8 muestras con ruido), 1 = filtro estable de 16 muestras (bordes limpios),
;       2 = sombras de contacto realistas (PCSS: nitidas junto al pie, mas suaves a medida que se alejan)
;       [Ctrl+Alt+Shift+F5 cicla 2 / 0 / 1]
; z20 = radio del filtro en texeles (1.5 = mismo tamano que el original; 1.0 = mas nitida, 2.5 = mas suave)
; x21 = escala de la penumbra en modo 2 [Ctrl+Alt+Shift+F4 cicla 60 / 400 / 1000 / 150]
; y21 = radio maximo en modo 2 (texeles), z21 = radio de busqueda de oclusores en modo 2 (texeles)
; w21 = 1 rota el patron cada frame (lo limpia DLSS/TAA), 0 = patron fijo
y20 = 1
z20 = 1.5
x21 = 150
y21 = 5
z21 = 5
w21 = 1
; Kits (camiseta y short, 4 shaders de G-buffer): definicion del sombreado de la tela
; x22 = fuerza del relieve (1 = original; 1.4 pliegues y trama mas marcados) [Ctrl+Alt+Shift+F2 cicla 1.8 / 1.0 / 1.4]
; y22 = oscurecido en los pliegues (0 = nada, 0.35 suave, 0.6 fuerte), w22 = on/off [Ctrl+Alt+Shift+F3]
x22 = 1.4
y22 = 0.35
w22 = 1
; ===== VIENTO en el pelo (4 shaders del pelo, incluida su sombra) - MISMO viento que la ropa (cloth-mod\cloth.ini [sim]) =====
; x23/y23 direccion X/Z = wind_x/wind_z del cloth.ini (2/0 -> 1/0, solo importa la proporcion); z24 rafagas, mismo ritmo
; que wind_gust de la ropa (ahi 2, aca 1 porque el pelo pesa menos). Si cambias el viento, cambialo en los dos archivos.
; x24 fuerza (0.6 suave) [Ctrl+Alt+Shift+F10 cicla 1.0 / 1.6 / 0.3 / 0.6], w24 on/off [Ctrl+Alt+Shift+F1],
; x25 velocidad del balanceo. y24 y z23/w23 los calcula [Present] (no tocar)
x23 = 1.0
y23 = 0.0
x24 = 0.6
z24 = 1.0
w24 = 1
x25 = 0.3
; Iluminacion de tela de los kits (5 shaders de luz; los kits se reconocen por su material, no por color):
; x26 brillo de tela / sheen (0.6 suave, 1.2 marcado) [Alt+Shift+F2 cicla 1.0 / 0.3 / 1.5 / 0.6], y26 luz envolvente
; en los pliegues (0 = original, 0.25 suave), z26 rugosidad del sheen (0.3 fino .. 1.0 ancho), w26 on/off [Alt+Shift+F1]
x26 = 0.6
y26 = 0.25
z26 = 0.5
w26 = 1
; Camiseta transpirada (3 shaders de camiseta): se oscurece con los minutos reales de partido (x10, lo calcula [Present])
; x27 fuerza (0.6 suave, 1 marcada), y27 minutos hasta el maximo, z27 diagnostico (1 = zonas en rojo, 2 = UV con rejilla),
; w27 on/off [Alt+Shift+F3]. Alt+Shift+F4 cicla el diagnostico 1 / 2 / 0.
x27 = 0.7
y27 = 14
z27 = 0
w27 = 1
; Cielo v2 (tonemap 5f32caac, solo donde la profundidad dice "cielo"; y7 sigue siendo la fuerza general):
; x28 brillo del cielo (0.8; 1 = no baja nada) [Alt+Shift+F5 cicla 1.0 / 0.6 / 1.3 / 0.8], y28 azul del zenit (0..1),
; z28 contraste de nubes (0..1), w28 bruma clara en el horizonte (0..1)
x28 = 0.8
; 16/10 (era 0.8) azul del zenit (ahora solo si el cielo ya es azul)
y28 = 0.5
; 16/10 (era 0.6) contraste de nubes: el cielo nublado ya no queda dramatico
z28 = 0.15
w28 = 0.5
; Pasto v2 (3 shaders de cesped): x29 corrige el amarillo lima (0 = original, 1 = verde natural), y29 brillo,
; z29 saturacion, w29 on/off [Alt+Shift+F7]. Alt+Shift+F8 cicla la correccion 1.0 / 0.0 / 0.6
x29 = 0.6
y29 = 0.97
z29 = 0.95
w29 = 1
; Sombra sobre kits (5 shaders de luz): la sombra del sol usa la ropa sin simular; x30 = sesgo extra solo en kits para
; borrar las franjas de sombra sobre la tela simulada (0 = nada), w30 on/off. Alt+Shift+F9 cicla 0.0006 / 0.0012 / 0 / 0.0003
x30 = 0.0003
w30 = 1
; Detalle de textura de los kits (4 shaders de kits): sesgo de mip negativo = textura mas nitida a distancia.
; x31 color/brillo/numeros, y31 normal map (relieve). Mas negativo = mas nitido (y mas titileo). w31 on/off: Alt+Shift+F10
x31 = -0.7
y31 = -1.0
w31 = 1
; Detalle de textura de la CARA (shader de piel): x32 color/brillo, y32 normal map (poros). w32 on/off: Alt+Shift+F11
x32 = -0.5
y32 = -0.8
w32 = 1
; Pelo con hebras (2 shaders de pelo 02f1d510 / c75f6047): x33 sesgo de mip (hebras mas finas), y33 variacion entre hebras,
; z33 hebras por texel, w33 on/off [Alt+Shift+F12]
x33 = -0.8
y33 = 0.12
z33 = 1.0
w33 = 1
; Piel en los 5 shaders de luz: x34 ancho del borde de la sombra sobre la cara (1 = igual que el resto, 2.2 = suave sin escalones),
; y34 densidad del tejido para la luz que atraviesa (1 = piel real; menos = orejas/nariz mas luminosas), w34 on/off [Alt+Shift+1]
x34 = 2.2
y34 = 1.0
w34 = 1
; Piel: oclusion de cavidades desde el normal map (orejas, arco de las cejas, nariz). x35 fuerza (0..1), w35 on/off [Alt+Shift+3]
x35 = 0.6
w35 = 1
; Pestanas / cejas / vello en tarjetas (shaders 0b3f9684 / 1fc2d922): x36 sesgo de mip (negativo = mas definido), w36 on/off [Alt+Shift+2]
x36 = -1.0
w36 = 1
; Sol visible en el cielo (tonemap): x37 tamano, y37 intensidad, z37 = 1 invierte el eje vertical (si aparece espejado), w37 on/off [Alt+Shift+4]
x37 = 1.0
y37 = 1.0
z37 = 0
w37 = 1
; Estampados del kit (nombre, numero, escudo, sponsors) con relieve propio (4 shaders de kits):
; x38 altura del borde levantado, y38 grano fino del vinilo, z38 cuanto aplana la trama debajo (0..1), w38 on/off [Alt+Shift+5]
x38 = 0.6
y38 = 0.4
; 17/10 (era 0.5): el vinilo deja ver un poco la trama, como en las presentaciones next-gen
z38 = 0.25
w38 = 1
; Post v2 (pasada final 0f5c2b99): nitidez adaptativa tipo AMD CAS en lugar del enfoque del juego (sin halos ni bordes blancos)
; x39 fuerza de la nitidez (0..1), y39 grano de pelicula (1 = el del juego, 0 = nada), w39 on/off [Alt+Shift+6]
x39 = 0.5
y39 = 0.35
w39 = 1
; Bloom v2 (shaders 006400dc / 6e56b1a3): reduccion de 13 muestras + escalado en carpa (sin bloques ni titileo)
; y40 supresion de puntos brillantes que titilan (0..1), w40 on/off [Alt+Shift+7]
y40 = 0.5
w40 = 1
; DOF v2 (desenfoque de lente, shaders 993cea4b / b9d609bc): capas desenfocadas ampliadas con B-spline (sin bloques)
; x41 cuanto se desenfoca el fondo (1 = original), y41 curva (>1 = plano medio mas nitido), w41 on/off [Alt+Shift+8]
x41 = 0.75
y41 = 1.3
w41 = 1
; Rebote de luz del pasto (composicion 619b86cb): la cara de abajo de los jugadores recibe la luz verdosa de la cancha
; x42 fuerza, y42 cuanto verde (0 = neutro), w42 on/off [Alt+Shift+9]
x42 = 1.0
y42 = 0.8
w42 = 1
; Piel del cuerpo (brazos, piernas, cuello - shader aa7d1833): mismas mejoras que la cara (luz de piel, cavidades,
; nitidez, brillo). Usa x32/y32, x35 y z. w43 on/off [Alt+Shift+B]
w43 = 1
; Tejido next-gen de los kits (normal map de punto ShaderFixes_v2\pes_knit_normal.dds): x45 escala sobre la trama del juego,
; y45 fuerza del relieve, z45 oclusion entre puntos, w45 on/off [Alt+Shift+N]
x45 = 1.0
y45 = 0.5
z45 = 0.6
w45 = 1
; luz de borde (17/10): x46 fuerza, y46 ancho (2 fino .. 5 muy fino), w46 on/off [Alt+Shift+R]
x46 = 0.45
y46 = 3.0
w46 = 1
; luz de cielo (17/10): x47 fuerza, y47 cuanto azul (0 = gris), w47 on/off [Alt+Shift+C]
x47 = 1.0
y47 = 0.8
w47 = 1
; ==============================================
; Reloj del partido: se reinicia solo cuando el cesped vuelve a dibujarse
; despues de 20 s sin cancha (o sea, al empezar un partido nuevo).
global $pes_last_turf = -100
global $pes_push = 0.003
global $pes_match_start = 0

; minutos reales desde el inicio del partido -> x10 (lo leen los shaders de piel)
; viento en el pelo: tiempo de este frame y del anterior (para que DLSS vea el movimiento bien),
; y solo en partido (cesped dibujado hace menos de 2 s; sin viento en menus, igual que la ropa)

; ===================== PES 2021: teclas del mod =====================
; Ctrl+Alt+F7     : activar/desactivar mejoras de piel
; Ctrl+Alt+F8     : activar/desactivar gradacion/tonemap
; Ctrl+Alt+F9     : activar/desactivar SSS de piel en la luz
; Ctrl+Shift+F9   : activar/desactivar SSAO reforzado
; Ctrl+Shift+F7   : activar/desactivar mejoras de pelo
; Ctrl+Shift+F8   : activar/desactivar gotas de sudor
; Ctrl+Shift+F11  : activar/desactivar composicion (menos bruma, ambiente de piel)
; Ctrl+Alt+F11    : modo busqueda de shaders (Ctrl+F1/F2 recorrer, Ctrl+F3 volcar)
; Ctrl+Alt+F1..F6 : ciclar valores (SSS, especular, exposicion, contraste, saturacion, sombras)
; F9 (mantener)   : ver el juego original para comparar
[KeyPESSkinToggle]
Key = ctrl alt no_shift VK_F7
type = toggle
w = 0

[KeyPESGradeToggle]
Key = ctrl alt no_shift VK_F8
type = toggle
w1 = 0

[KeyPESLightSSSToggle]
Key = ctrl alt no_shift VK_F9
type = toggle
z3 = 0

[KeyPESAOToggle]
Key = ctrl shift no_alt VK_F9
type = toggle
y4 = 0

[KeyPESSweatToggle]
Key = ctrl shift no_alt VK_F8
type = toggle
w8 = 0

[KeyPESCompToggle]
Key = ctrl shift no_alt VK_F11
type = toggle
w11 = 0

[KeyPESCycleSSS]
Key = ctrl alt no_shift VK_F1
type = cycle
x3 = 2.0, 1.0, 1.5

[KeyPESCycleSpec]
Key = ctrl alt no_shift VK_F2
type = cycle
y3 = 1.8, 1.0, 1.4

[KeyPESCycleExposure]
Key = ctrl alt no_shift VK_F3
type = cycle
x1 = 1.1, 1.2, 0.9, 1.0

[KeyPESCycleContrast]
Key = ctrl alt no_shift VK_F4
type = cycle
z1 = 0.3, 0.0, 0.15

[KeyPESCycleSaturation]
Key = ctrl alt no_shift VK_F5
type = cycle
y1 = 1.15, 1.0, 1.08

[KeyPESCycleShadows]
Key = ctrl alt no_shift VK_F6
type = cycle
w2 = 0.04, -0.04, 0.0

[KeyPESWrinkleToggle]
; Ctrl+Shift+F12: arrugas de expresion mejoradas on/off (off = arrugas originales del juego)
Key = ctrl shift no_alt VK_F12
type = toggle
w13 = 0

[KeyPESWrinkleGain]
; Ctrl+Alt+F12: ganancia de arrugas 0.7 / 1.4 / 1.0
Key = ctrl alt no_shift VK_F12
type = cycle
x7 = 0.7, 1.4, 1.0

[KeyPESMouthToggle]
; Ctrl+Alt+Shift+F9: mejoras del interior de la boca on/off
Key = ctrl alt shift VK_F9
type = toggle
w17 = 0

[KeyPESMouthDiag]
; Ctrl+Alt+Shift+F8: diagnostico (dientes azul / encia-lengua rojo / cavidad verde)
Key = ctrl alt shift VK_F8
type = toggle
z18 = 1

[KeyPESExprPhysics]
; Ctrl+Alt+Shift+F11: fisica de la expresion on/off (sangre, brillo, translucidez)
Key = ctrl alt shift VK_F11
type = toggle
w16 = 0

[KeyPESEyes]
; Ctrl+Alt+Shift+F7: mejoras de ojos on/off
Key = ctrl alt shift VK_F7
type = toggle
w19 = 0

[KeyPESShadowDef]
; Ctrl+Alt+Shift+F6: definicion de sombras on/off
Key = ctrl alt shift VK_F6
type = toggle
w20 = 0

[KeyPESShadowFilter]
; Ctrl+Alt+Shift+F5: filtro de sombras v2 -> PCSS (2) / original (0) / estable (1)
Key = ctrl alt shift VK_F5
type = cycle
y20 = 2, 0, 1

[KeyPESShadowPCSS]
; Ctrl+Alt+Shift+F4: escala de la penumbra PCSS (solo modo 2)
Key = ctrl alt shift VK_F4
type = cycle
x21 = 60, 400, 1000, 150

[KeyPESKitShade]
; Ctrl+Alt+Shift+F3: sombreado mejorado de los kits on/off
Key = ctrl alt shift VK_F3
type = toggle
w22 = 0

[KeyPESKitRelief]
; Ctrl+Alt+Shift+F2: fuerza del relieve de los kits 1.8 / 1.0 / 1.4
Key = ctrl alt shift VK_F2
type = cycle
x22 = 1.8, 1.0, 1.4

[KeyPESHairWind]
; Ctrl+Alt+Shift+F1: viento en el pelo on/off
Key = ctrl alt shift VK_F1
type = toggle
w24 = 0

[KeyPESHairWindForce]
; Ctrl+Alt+Shift+F10: fuerza del viento en el pelo 1.0 / 1.6 / 0.3 / 0.6
Key = ctrl alt shift VK_F10
type = cycle
x24 = 1.0, 1.6, 0.3, 0.6

; ===================== PES 2021: kits - iluminacion de tela (Alt+Shift) =====================
[KeyPESClothLight]
; Alt+Shift+F1: iluminacion de tela de los kits on/off
Key = no_ctrl alt shift VK_F1
type = toggle
w26 = 0

[KeyPESClothSheen]
; Alt+Shift+F2: fuerza del brillo de tela 1.0 / 0.3 / 1.5 / 0.6
