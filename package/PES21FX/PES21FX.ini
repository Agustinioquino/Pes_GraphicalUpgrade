[MenuFaceFeatures]
section = Cara
title = Rasgos de la cara (cuencas y pliegues)
desc = Comparando con el juego original, la cara del mod salía más clara y con los rasgos lavados: el multirebote de la oclusión ambiental aclara las cuencas en superficies claras (una cuenca de 0.5 pasaba a 0.72 en la piel) y la iluminación global en pantalla las rellena. Esto hace la oclusión de la piel más honda y sin multirebote, y baja el relleno del SSGI sólo en la piel. Además el sol ya no se apila (curva del día x sol realista x contraste de día daba 1.58x sobre los jugadores; ahora ~1.2x).
slider = x124 | Rasgos | 0 | 1 | 0 = como antes; 0.6 = cuencas y pliegues del original; 1 = marcados.

[MenuFaceLOD]
section = Cara
title = LOD de caras (malla de máximo detalle a distancia)
desc = El motor elige en la CPU qué malla dibuja de cada jugador según la distancia (LOD) y los mods que parchean bytes no cambian eso. Esto va por otro camino: la DLL se aprende, por cara, los buffers de la malla de más detalle que vio y, cuando esa cara vuelve con la malla reducida, dibuja la de máximo detalle en su lugar (sólo si el shader de vértices y los cbuffers coinciden, así el esqueleto es el mismo). Pasá primero por el "Diagnóstico": anota en el log, por cara, con cuántos vértices se dibuja, con qué shaders y a qué distancia cambia; con eso se ve si el motor usa varias mallas o no. Las expresiones faciales de los jugadores lejanos no se pueden forzar desde la GPU (la CPU no las calcula).
toggle = y118
choice = x118 | Diagnóstico en el log (cada 20 s) | No;Sí | Apagalo después de leer el log: cuesta algo de rendimiento.
slider = z118 | Distancia máxima (m) | 0 | 120 | 0 = siempre; p.ej. 40 = sólo jugadores a menos de 40 m.
choice = w118 | Compatibilidad | Estricta (mismo shader de vértices);Permisiva (mismo layout) | Permisiva puede deformar mal si el esqueleto difiere.

[MenuFaceGen]
