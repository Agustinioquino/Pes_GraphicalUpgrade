; ---------------------------------------------------------------- PIEL
[MenuSkinTone]
section = Piel
title = Tono de piel real (todos los tonos)
desc = Todas las pieles humanas caen en una franja angosta de color (rojo > verde > azul) que va de rosado pálido a marrón cálido según la melanina. Las texturas del juego y la luz del estadio a veces la sacan de ahí (caras naranjas, amarillentas o gris verdosas). Esto acerca el color de cada piel a la franja real PARA SU MISMA CLARIDAD: cada jugador conserva su tono, sólo deja de verse teñido; barba, cejas y pelo pintados no se tocan. La dispersión (SSS) también sigue al tono: en piel clara el borde de la sombra es rojizo; en piel oscura la melanina absorbe ese rojo y la penumbra queda marrón cálida, como en la realidad.
