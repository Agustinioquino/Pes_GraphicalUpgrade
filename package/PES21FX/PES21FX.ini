slider = y129 | Fuerza | 0 | 1 | 0 = la exposición del juego; 1 = fija para la cancha al sol.
slider = z129 | Memoria (s) | 5 | 120 | Cuánto tarda en seguir un cambio real de luz (nubes, atardecer). | %.0f

[MenuGTAO]
section = Iluminación
title = GTAO: oclusión ambiental por horizontes
desc = Reemplaza el SSAO simple del juego (480x270, 8 bits) por GTAO (Jimenez 2016), el HBAO de los motores actuales: para cada pixel busca en varias direcciones los horizontes que tapan el cielo alrededor de la normal e integra la visibilidad real. Da sombra de contacto bajo los pies, entre las piernas, axilas y pliegues del kit, sin halos ni manchas grises. A resolución completa, con desenfoque bilateral; el TAA del juego limpia el resto.
