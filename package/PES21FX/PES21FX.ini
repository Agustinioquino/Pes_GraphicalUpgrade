[MenuClouds]
section = Cancha y cielo
title = Nubes volumétricas
desc = Capa de nubes real trazada por rayos sobre el cielo (no una textura): tienen volumen, sombra propia, borde iluminado a contraluz y se mueven con el viento. La misma capa proyecta sombra sobre la cancha (ver "Sombra de nubes"). Cuesta algo de GPU en planos con mucho cielo; bajar "Calidad" si hace falta. Si el cielo sale invertido o las nubes aparecen bajo el horizonte, usar los dos interruptores de ejes.
