slider = z49 | Raíz a punta | 0.5 | 4 | Más alto = solo se mueven las puntas; más bajo = se mueve todo el mechón.

[MenuHairSpec]
section = Pelo
title = Brillo del pelo con banda
desc = El brillo del pelo real es una banda que cruza las hebras (como un halo), no un punto plástico. Se agrega además un segundo brillo del color del pelo, más cerca de las puntas. La banda se mueve con el sol y con la cámara.
toggle = w50
slider = x50 | Fuerza de la banda | 0 | 1 | 0 = brillo original del juego. 0.6 = banda marcada y natural.
slider = y50 | Posición de la banda | -0.4 | 0.4 | Desplaza la banda hacia la raíz (positivo) o hacia las puntas (negativo).
slider = x51 | Segundo brillo (color) | 0 | 2 | Reflejo teñido con el color del pelo: da profundidad en rubios y castaños.
