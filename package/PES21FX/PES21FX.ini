[MenuTurfFar]
section = Cancha y cielo
title = Pasto en toda la cancha
desc = Un solo pasto para toda la cancha, en todas las cámaras y a cualquier distancia. De cerca, manojos propios de 512 px (corto, medio, largo) con tres tramos que se curvan como una hoja real, con normal por hoja, giro, ancho y alto al azar; más lejos, tres niveles de parcelas (0,5 / 1 / 2 m) que la GPU arma con la cámara del mismo cuadro según el tamaño que tiene una hoja en pantalla, fundidos entre sí; donde una hoja ya no mide en pantalla, la base de la cancha toma el aspecto del césped visto de lejos. Las sombras de jugadores y pelota caen también sobre este pasto. Las demás tarjetas de esta sección (Hojas, Color, Luz, Corte y viento, Desgaste) regulan el mismo pasto. Cuesta FPS: Calidad y Densidad son los reguladores.
