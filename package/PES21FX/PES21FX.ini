slider = w143 | Barro con los minutos | 0 | 1 | 0 = el del juego; 0.5 = se nota al final del partido; 1 = mucho. | %.2f

[MenuMotor]
section = Estadio
title = Motor: más detalle (parches en memoria)
desc = Cambios dentro del motor del juego, hechos en memoria por la DLL (el exe no se toca, sólo con la versión conocida). LOD de modelos: el motor decide qué malla dibuja de cada jugador, del público y del estadio según el tamaño en pantalla; esto lo engaña para que conserve la malla detallada hasta más lejos (1,5 = 50 % más lejos; cuesta algo de GPU). Sombras del sol 5120: el mapa de sombras pasa de 4096 a 5120 (bordes más finos; es lo máximo que entra en DirectX 11 con las tres cascadas). La resolución de sombras se lee al arrancar: hay que reiniciar el juego. Cortes de cámara: el motor avisa cada corte de toma (repeticiones, saques, primeros planos) y los efectos que se acumulan entre cuadros se reinician justo ahí.
slider = x142 | LOD de modelos (x) | 1 | 2.5 | 1 = como el juego. | %.2f
choice = y142 | Sombras del sol | 4096 (juego);5120 (más finas, reiniciar) | 
choice = x161 | Cortes de cámara del motor | No usar;Usar | La DLL lee del motor cuándo hay un corte de cámara (el mismo aviso que usa el antialiasing del juego). En ese cuadro el rebote de luz y la oclusión acumulados arrancan de cero, sin estela de la toma anterior, y la exposición estable salta a la toma nueva en vez de acomodarse en un segundo.

[MenuMuscle]
section = Cuerpo
title = Musculatura (prueba)
desc = Agranda o achica los músculos de todos los jugadores con los huesos de músculo del propio esqueleto del juego, después de que el motor los acomoda a cada pose: el cambio se ve al instante y el cuerpo se sigue moviendo igual. Brazos y piernas engordan alrededor de su eje (el largo no cambia); pecho, espalda, abdomen y glúteos se abultan hacia afuera. Este interruptor prende las cuatro tarjetas de musculatura. Lo de estas tarjetas vale para todos los jugadores; en "Musculatura por jugador" se le dan valores propios a un jugador.
toggle = x164
slider = x167 | General | 0.7 | 1.5 | Agranda o achica todos los músculos a la vez (no la panza). Se multiplica con cada slider de las otras tarjetas: 1 = como cada slider. | %.2f
choice = x255 | Unir músculos vecinos | No (cada uno solo);Sí | No: cada slider mueve solo su músculo ("Hombros" solo el deltoides). Sí: los vecinos acompañan un poco para que no quede escalón (el trapecio, el pecho alto y el omóplato al hombro; la axila al pecho; el costado a los dorsales; la base del cuello al cuello y al trapecio; los lumbares a la espalda baja).
choice = y166 | La ropa acompaña | No;Sí | Las mangas siguen al brazo y el short a los muslos, sin cambiar su largo. Si no, el cuerpo puede atravesar la ropa.
choice = z170 | Codos y rodillas acompañan | No;Sí | El codo y la rodilla crecen un poco con el brazo, el antebrazo, el muslo y la pantorrilla, para que no quede un escalón donde se juntan (la rótula casi no cambia).
slider = x172 | Definición muscular | 0 | 2 | Qué tan marcados se ven los músculos en la piel (el relieve del torso, brazos y piernas), sin tocar los poros. Va aparte del tamaño. 1 = como el juego; 0 = piel lisa. | %.2f
choice = x163 | La ropa acompaña menos | No;Sí | La camiseta y el short crecen menos que el músculo (si no, al agrandar el bíceps la manga queda inflada).
slider = y163 | Cuánto crece la ropa | 0 | 1 | 1 = igual que el músculo; 0.8 = la manga crece el 80 % (en potencia); 0 = la ropa no cambia. | %.2f
slider = y255 | Cuánto crecen las mangas | 0 | 1.2 | Cuánto del crecimiento del brazo recibe la manga (su propio hueso). 0.6 = la manga gana los mismos centímetros que el brazo (está más lejos del eje que la piel); 1 = crece igual que el músculo y queda inflada; 0 = la manga no crece. | %.2f
slider = z255 | La ropa sigue al cuerpo (física) | 0 | 1.5 | Con la física de la ropa prendida: el pecho, la espalda, el abdomen, el trapecio, los hombros y los glúteos que agranda la musculatura empujan la remera y el short igual que a la piel, así el cuerpo no atraviesa la ropa. 1 = lo mismo que la piel; 0 = apagado. | %.2f

[MenuSkinTonePlayer]
section = Cuerpo
title = Tono de piel por jugador
desc = Se elige en Editar > Jugadores > Físico > Musculatura, página "Piel" (R1 hasta la última página), y se guarda por jugador en PES21FX\piel_jugadores.ini. La fila del tono muestra el color y con X abre la paleta del juego con 30 tonos de piel (y "crear color" para uno propio); abajo hay tonos conocidos con nombre (escala Monk 1..10), barras de luminosidad, saturación y matiz para afinar con el analógico, y "Cuerpo del color de la cara": el mod mide el color de la cara y del cuerpo en la base del cuello y corrige el cuerpo para que coincida (la cara no cambia). Cambia el tono de verdad (matiz y saturación, no solo el brillo: los claros más rosados y pálidos, los medios canela, los oscuros marrón rojizo) y el mismo número se ve igual en todos los jugadores. Tiñe la piel del cuerpo y de la cara, en el menú Físico y en los partidos. El mod anota el color de piel del juego de cada jugador cuando abrís su menú Físico: si un jugador tenía tono propio de antes, abrí su Físico una vez.
toggle = x184
slider = y184 | Intensidad | 0 | 1.5 | 1 = el tono elegido; menos acerca al color del juego. | %.2f

[MenuGlassUI]
section = Menús del juego
