[MenuSkinSpecPhys]
section = Piel
title = Brillo de piel físico
desc = El brillo de la piel deja de ser una cera amarilla: toma el color del sol (no el tinte del material), es débil mirando de frente y crece en la silueta como en la piel real (Fresnel con F0 de piel), y se puede bajar en conjunto.
