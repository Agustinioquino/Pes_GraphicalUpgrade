; viento en el pelo: tiempo de este frame y del anterior (para que DLSS vea el movimiento bien),
; y solo en partido (cesped dibujado hace menos de 2 s; sin viento en menus, igual que la ropa)

; ===================== PES 2021: teclas del mod =====================
; Ctrl+Alt+F7     : activar/desactivar mejoras de piel
; Ctrl+Alt+F8     : activar/desactivar gradacion/tonemap
; Ctrl+Alt+F9     : activar/desactivar SSS de piel en la luz
; Ctrl+Shift+F9   : activar/desactivar SSAO reforzado
; Ctrl+Shift+F7   : activar/desactivar mejoras de pelo
; Ctrl+Shift+F8   : activar/desactivar gotas de sudor
; Ctrl+Shift+F11  : activar/desactivar composicion (menos bruma, ambiente de piel)
; Ctrl+Alt+F11    : modo busqueda de shaders (Ctrl+F1/F2 recorrer, Ctrl+F3 volcar)
; Ctrl+Alt+F1..F6 : ciclar valores (SSS, especular, exposicion, contraste, saturacion, sombras)
; F9 (mantener)   : ver el juego original para comparar
[KeyPESSkinToggle]
Key = ctrl alt no_shift VK_F7
type = toggle
w = 0

[KeyPESGradeToggle]
