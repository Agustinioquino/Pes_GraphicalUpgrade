[MenuEquip]
section = Estadio
title = Botines y pelota
desc = El material de los botines y la pelota (cuero sintético, PU, tapones). Antialiasing especular: la rugosidad crece donde la normal cambia dentro del pixel, así los brillos no titilan a distancia ni en movimiento. Con la cancha mojada se ven mojados (menos rugosos y apenas más oscuros). Y el barro que el juego ya sabe dibujar se va acumulando con los minutos de partido, más si llueve.
