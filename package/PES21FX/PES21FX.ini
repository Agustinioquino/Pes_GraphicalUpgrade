section = Cancha y cielo
title = Estado del suelo (húmedo / seco)
desc = Como el juego cambia la cancha según el clima: en Automático toma la lluvia del partido (necesita el módulo de Sider PES21FX_match.lua) y pone el césped húmedo: más oscuro y saturado, con brillo de agua en la base y en las hojas. Seco = pajizo y mate. Se puede forzar.
choice = z110 | Estado | Automático;Normal;Húmedo;Seco | 
slider = w110 | Fuerza | 0 | 1 | Cuánto se nota el estado elegido.

[MenuGrassLiveWear]
section = Cancha y cielo
title = Desgaste en vivo (como FC 24)
desc = La cancha se va gastando durante el partido donde se juega: la DLL pinta un mapa de desgaste con la posición de cada jugador (más al correr que parado) y el pasto v3 lo usa: hojas aplastadas y secas y, al máximo, tierra. Se borra al empezar otro partido. Es independiente del "Desgaste" fijo del pasto v3 (se suman).
toggle = w115
slider = x115 | Velocidad del desgaste | 0 | 3 | 1 = en un partido entero el centro y las áreas quedan marcadas; 3 = potrero en 20 minutos.
slider = y115 | Radio de la pisada (m) | 0.3 | 2 | 0.7 = natural.
slider = z115 | Pelado al máximo | 0 | 1 | Cuánto queda tierra a la vista donde más se jugó.

[MenuGrassClips]
section = Cancha y cielo
title = Recortes de pasto que vuelan (como FC)
desc = Al correr, los jugadores levantan pedacitos de hoja que salen volando detrás, caen con gravedad y se los lleva el viento. Son partículas de la DLL dibujadas con el shader de las hojas, así que reciben la misma luz y sombra que el pasto. Necesita el pasto v3.
toggle = w116
slider = x116 | Cantidad | 0 | 3 | 1 = natural; 3 = exagerado.
slider = y116 | Tamaño (cm) | 1 | 8 | 3 = recortes de cortadora. | %.1f

[MenuGrassV3Wear]
section = Cancha y cielo
title = Desgaste
desc = Qué hace el "Desgaste" de Pasto v3: zonas de uso (bocas de arco y círculo central más gastados), pasto seco amarillo pajizo y pelado (tierra sin hojas, también en la base). Depuración: 2 = desgaste en colores (rojo seco, verde tierra); 1 = uv del atlas; 3 = normal.
slider = x107 | Zonas de uso | 0 | 2 | 1 = las bocas de arco y el centro se gastan primero.
slider = y107 | Amarillo seco | 0 | 1.5 | Cuánto amarillea el pasto gastado.
slider = z107 | Pelado (tierra) | 0 | 1.5 | 0 = nunca queda tierra a la vista.
choice = w107 | Depuración | Normal;UV del atlas;Desgaste;Normal por hoja | 

[MenuTurfFar]
section = Cancha y cielo
title = Pasto en toda la cancha
desc = Hojas 3D hasta el fondo de la cancha en todas las cámaras. Desde "Desde" el pasto del juego se achica y entra el del mod en tres bandas de distancia (un solo dibujo por banda), que se funden por altura para que no haya saltos. La posición de cada parcela se calcula con la cámara del mismo cuadro (sin popping) y las sombras de jugadores y pelota caen también sobre este pasto. Cuesta FPS: Calidad y Densidad son los reguladores.
toggle = w58
choice = x61 | Calidad de la malla | Liviana;Media;Alta;Máxima | Cuántas hojas tiene cada parcela de la primera banda (las lejanas usan menos: no se notan). Media = buen equilibrio en una RTX 4060.
slider = x58 | Densidad | 0.3 | 2 | 1 = parcelas de 0.5 m cerca, 0.75 m y 1 m lejos. Más densidad = parcelas más chicas (más hojas, menos FPS).
slider = y58 | Desde (m) | 10 | 40 | Distancia donde el pasto del juego se apaga y entra el del mod. 22 = conserva el pasto denso del juego cerca. | %.0f
slider = z58 | Hasta (m) | 40 | 140 | Hasta dónde llega. 120 = toda la cancha. | %.0f
slider = x59 | Alto de las hojas | 0.5 | 3 | Hojas lejanas más altas se leen mejor. 1.3 = natural.
slider = y59 | Ancho de las hojas | 0 | 3 | Las hojas lejanas se ensanchan hacia la cámara para cubrir sin más geometría. 1 = natural.
choice = z59 | Depuración | Normal;Pasto del mod en magenta | Para ver dónde llega el pasto del mod.

[MenuTurfFarGame]
section = Cancha y cielo
title = Alternativa liviana: agrandar el pasto lejano del juego
desc = Solo actúa con el "Pasto en toda la cancha" apagado. Más allá de unos 30 m el juego sigue dibujando parcelas de pasto, pero pone su variante más chica (0.5 m) en una grilla de 3 m sin escalarla: un matorral aislado cada 3 m, por eso el pasto "desaparece". Esto escala esas mismas parcelas para que cubran su celda, con hojas más altas y anchas para que se lean de lejos. No agrega dibujos: costo cero.
toggle = w60
slider = x60 | Escala | 1 | 8 | Cuánto se agranda cada parcela lejana. 6 = cubre la celda de 3 m completa; 4 = más espaciado.
slider = y60 | Desde (m) | 10 | 60 | Distancia desde la que empieza el escalado. 20 = natural. | %.0f
slider = z60 | Transición (m) | 1 | 40 | Largo de la zona donde pasa de normal a escalado. 15 = suave. | %.0f

[MenuTurfStripes]
section = Cancha y cielo
title = Franjas de corte y contraluz
desc = Las franjas del corte de la cancha cambian con el ángulo de la cámara, como en TV: una franja clara de un lado se ve oscura del otro. Esto amplifica las franjas del propio juego (no las pinta encima) y agrega la luz que atraviesa las hojas con el sol de frente.
toggle = w57
slider = x57 | Franjas de corte | 0 | 3 | Cuánto se marcan las franjas según desde dónde mira la cámara. 0 = las del juego; 1 = TV; 2 = muy marcadas.
slider = y57 | Pasto a contraluz | 0 | 2 | Con el sol de frente a la cámara el pasto se enciende amarillo verdoso. Más fuerte con el sol bajo. 0.6 = natural.

