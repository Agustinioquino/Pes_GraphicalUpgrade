[MenuDebugView]
section = Diagnóstico
title = Vista de diagnóstico
desc = Vistas para entender qué está pasando. "Sol y grosor de piel": arriba a la derecha una brújula del sol (línea y punto = hacia dónde está el sol en pantalla; punto amarillo = sol adelante de la cámara (contraluz), celeste = detrás de la cámara; barra naranja = altura sobre el horizonte) y sobre la piel: rojo = grosor medido con el shadow map, verde = luz que atraviesa, azul = lado de espaldas al sol. "Solo rebote de luz" muestra la luz indirecta sola. "Sombras de contacto": la escena en gris y en rojo las sombras de contacto (más rojo = más oscura). "Resolución de sombras" dibuja en bloques los valores internos del shadow map. También con Ctrl+Alt+F11 (sol y piel) y Ctrl+Shift+F3 (rebote).
choice = w12 | Vista | Ninguna=0;Solo rebote de luz=2;Sol y grosor de piel=3;Sombras de contacto=4;Nubes (ejes y opacidad)=5;Resolución de sombras=-3 | Se aplica al instante; volvé a "Ninguna" para jugar.

[MenuDiagHooks]
section = Diagnóstico
title = Ganchos nuevos (para buscar cierres)
desc = Para encontrar qué provoca un cierre: cada interruptor saca uno de los ganchos en memoria que agrega el mod. Se aplica al reiniciar el juego. "Vigilar el código del juego" anota en el log si algo cambia el código del exe mientras se juega (otro mod o la protección del juego) y, si el juego se cierra, deja los bytes de donde pasó.
choice = x173 | Seguimiento de jugadores | No;Sí | Sabe qué jugador es cada cuerpo (lo usa la musculatura por jugador). Apagado, los valores propios de un jugador solo se ven en el menú Físico.
choice = y173 | Ganchos del menú Físico | No;Sí | La fila "Musculatura" con sus páginas dentro de Editar > Jugadores > Físico.
choice = w173 | Huesos de musculatura | No;Sí | Los ganchos de los 32 huesos de músculo. Apagado, no hay musculatura.
choice = z173 | Vigilar el código del juego | No;Sí | Compara el código del exe cada 2 segundos y anota los cambios en el log (no cambia nada del juego).
choice = w184 | Anotar los dibujos de personajes | No;Sí | Cada 20 segundos anota en el log los dibujos de jugadores de un cuadro (para preparar el tono de piel por jugador). Se aplica al instante.
choice = w191 | Anotar los elementos de los menús | No;Sí | Cada 20 segundos anota en el log los elementos del menú en pantalla (tamaño, textura, cuáles se volvieron vidrio) para ajustar el vidrio de los menús. Se aplica al instante.
