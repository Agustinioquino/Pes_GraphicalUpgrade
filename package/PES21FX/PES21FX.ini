slider = x127 | Sombra con color de cielo | 0 | 1 | La sombra la ilumina el cielo (más azul que el sol): 0 = color del juego; 0.5 = natural. No suma luz, sólo cambia el color.

[MenuExpStab]
section = Iluminación
title = Exposición estable entre cámaras
desc = El motor cambia la exposición en cada toma (primeros planos, repeticiones, cámara de jugador) y la cancha salta de brillo. Una cámara de TV expone para la cancha al sol y casi no cambia. Con el medidor de luz se compara el brillo del pasto al sol de esta toma con el de los últimos segundos y se corrige la diferencia. Sin pasto al sol en pantalla se mantiene la última corrección. Necesita "Luz calibrada" prendida (es la que mide).
