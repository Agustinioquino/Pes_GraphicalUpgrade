[MenuGrassLight]
section = Cancha y cielo
title = Luz del sol y del estadio en el pasto
desc = Cómo responde el césped a la luz, con la misma cuenta para la base y las hojas. Relieve por hoja = cada hoja tiene su normal (cilíndrica: clara de un lado, oscura del otro) en vez de iluminarse como el suelo; la sombra entre hojas (oclusión de la raíz) crece con el sol bajo. Contraluz = con el sol de frente a la cámara las hojas dejan pasar la luz y se encienden amarillo verdosas (más con el sol bajo). Brillo al sol = la cutícula cerosa refleja el sol en ángulo rasante y la cancha se aclara, como en TV por la tarde (no brilla en la sombra). De noche, cuatro torres virtuales alrededor de la luz dominante dan brillos rasantes múltiples y un poco de luz desde los cuatro lados, solo sobre el césped. El rebote verdoso de la cancha sobre los jugadores está en Iluminación > Rebote de luz del pasto.
