; ===================== Menú (Insert): una tarjeta por mejora =====================
; [Menu<nombre>]  section = pestaña | title | desc | toggle = wNN
;   slider = xNN | etiqueta | mín | máx | ayuda | formato        choice = yNN | etiqueta | A;B;C | ayuda

; ---------------------------------------------------------------- ILUMINACIÓN
[MenuSunReal]
section = Iluminación
title = Sol realista
desc = El color del sol cambia con su altura: cálido y dorado al atardecer, blanco cálido al mediodía.
slider = z4 | Realismo del color | 0 | 1.5 | 0 = color original del juego. 1 = varía con la altura del sol.
slider = w4 | Intensidad del sol | 0.5 | 2 | Cuánta luz directa da el sol. 1 = original, 1.2 = un poco más fuerte.

[MenuSunQuality]
section = Iluminación
title = Sol de calidad
desc = El sol deja de ser un punto: tiene un disco de medio grado (o más si lo querés) y los brillos lo reflejan con ese tamaño, con la energía conservada. Además la luz que atraviesa orejas y nariz se calcula con el grosor REAL (lo que ve el sol en el shadow map contra lo que ve la cámara): se encienden solo cuando el sol está de verdad detrás.
toggle = x64
slider = y64 | Diámetro del sol | 0 | 6 | En grados. 0.53 = el real; 0.9 = un poco más suave en los brillos; 3+ = sol de bruma. | %.2f
slider = z64 | Transmisión real (shadow map) | 0 | 2.5 | Cuánta luz pasa por las zonas finas según el grosor medido. 0 = solo la direccional de antes.
slider = w64 | Densidad de la piel | 5 | 80 | Más = la luz atraviesa menos (solo orejas); menos = también nariz y mejillas. 30 = natural. | %.0f

[MenuSunFree]
section = Iluminación
title = Sol libre (experimentar)
desc = Mueve el sol a donde quieras para ver cómo responde la luz (piel, transmisión a contraluz, pasto, kits). Cambia la dirección y el color del sol en la pasada de luz; las sombras proyectadas siguen siendo las del sol real del partido (el motor las calcula antes), así que para experimentar con transmisión poné el sol detrás del jugador y mirá orejas y nariz.
toggle = x101
slider = y101 | Azimut | 0 | 360 | Dirección en el plano (grados). | %.0f
slider = z101 | Elevación | -5 | 90 | Altura sobre el horizonte (grados). | %.0f
slider = w101 | Intensidad | 0 | 3
slider = x102 | Calidez | 0 | 1 | 0 = color del juego, 1 = naranja de atardecer.

[MenuDayCurve]
section = Iluminación
title = Curva del día
desc = Cómo cambia la luz con la altura del sol (ideal con el Daylight Engine, que mueve el sol durante el partido). Entre el ángulo de "amanecer" y el de "mediodía" se interpolan la intensidad del sol, la luz ambiente, la niebla y la calidez. Con el sol en el horizonte entra la "hora azul". No toca la luz de torres de noche.
toggle = x65
slider = y65 | Sol al amanecer | 0 | 2 | Multiplicador del sol con el sol bajo. 0.8 = un poco más débil que el archivo del estadio.
slider = z65 | Sol a media mañana | 0 | 2 | A mitad de camino entre los dos ángulos.
slider = w65 | Sol al mediodía | 0 | 2 | Con el sol alto. 1.1 = un poco más fuerte que el original.
slider = x66 | Ambiente al amanecer | 0 | 2 | Luz global (cielo + rebote) con el sol bajo. Menos = sombras más profundas al atardecer.
slider = y66 | Ambiente al mediodía | 0 | 2 | Luz global con el sol alto.
slider = z66 | Niebla al amanecer | 0 | 3 | Densidad de la bruma con el sol bajo. 1.6 = mañana húmeda.
slider = w66 | Niebla al mediodía | 0 | 3 | Densidad de la bruma con el sol alto. 0.8 = aire limpio.
slider = x67 | Calidez al amanecer | 0 | 1 | Cuánto se pone naranja el sol cuando está bajo (se suma al "Sol realista").
slider = y67 | Hora azul | 0 | 1 | Tinte azulado del ambiente con el sol pegado al horizonte.
slider = z67 | Ángulo de amanecer | 1 | 40 | Altura del sol (grados) donde termina el amanecer. | %.0f
slider = x109 | Contraste de día | 0 | 1 | Sube el sol y baja la luz ambiente a la vez (sombras más profundas, lado al sol más fuerte). 0 = como estaba; 0.5 = día de sol real.
slider = w67 | Ángulo de mediodía | 20 | 90 | Altura del sol (grados) desde donde es "mediodía". | %.0f

[MenuRim]
section = Iluminación
title = Luz de borde en jugadores
desc = Con el sol detrás del jugador, el contorno (hombros, brazos, pelo a contraluz) se enciende como en TV. Solo piel y kits, respeta las sombras y se apaga con la distancia.
toggle = w46
slider = x46 | Fuerza | 0 | 1.5 | Qué tan brillante es el contorno. 0.45 = sutil, 1 = muy marcado.
slider = y46 | Ancho del borde | 1.5 | 6 | Más alto = borde más fino, pegado a la silueta. 2 = ancho, 5 = muy fino.

[MenuAtmosphere]
section = Iluminación
title = Atmósfera con sol dinámico
desc = Con el sol bajo (Daylight Engine o partidos de tarde) el archivo de luz del estadio deja la bruma azul tapando el fondo (montañas, tribunas de un solo color) y el sol muy apagado. Esto desatura y calienta la bruma lejana según la altura del sol, y compensa la fuerza del sol en esas horas. De noche con torres no actúa.
toggle = w54
slider = x54 | Bruma menos azul | 0 | 1 | Cuánto se desatura la bruma lejana. 0 = la del archivo de luz; 1 = gris neutra.
slider = y54 | Sol bajo más fuerte | 0 | 2 | Cuánto se compensa el sol cuando está bajo. 0.6 = natural; 1.5 = atardecer fuerte.
slider = z54 | Horizonte cálido | 0 | 1 | Con el sol bajo, la bruma se tiñe naranja en vez de azul.

[MenuGlobalLight]
section = Iluminación
title = Luz global del estadio
desc = La luz indirecta precalculada del estadio (el "rebote" que ilumina todo lo que no toca el sol). Es el shader del motor traducido por PES21 FX: ahora se puede regular su fuerza, darle dirección (más luz a lo que mira al cielo, menos a lo que mira al suelo) y decidir cuánto la apaga la oclusión.
toggle = w56
slider = x56 | Fuerza | 0 | 2.5 | Multiplica la luz global. 1 = la del archivo de luz del estadio. Si el estadio queda chato, subila; si los jugadores brillan en sombra, bajala.
slider = y56 | Contraste cielo/suelo | -1 | 2 | Lo que mira hacia arriba recibe más, lo que mira al piso menos. 0 = plano como el original; 0.5 = natural.
slider = z56 | Peso de la oclusión | 0.25 | 2 | Cuánto apaga la oclusión ambiental a la luz global. 0.5 = original; 1 = huecos más oscuros.

[MenuTowers]
section = Iluminación
title = Luces de torre (noche)
desc = De noche el juego ilumina con una sola torre dominante y los jugadores quedan planos. Esto agrega torres virtuales giradas alrededor del estadio: varios brillos en la piel y los kits y bordes iluminados desde distintos lados, como en TV. Sin sombras, solo brillo y algo de luz envolvente. De día no actúa.
toggle = w55
slider = x55 | Brillo | 0 | 2 | Fuerza de los brillos de las torres extra. 0.8 = natural; 1.5 = noche de TV muy marcada.
slider = y55 | Luz envolvente | 0 | 2 | Cuánta luz difusa suman las torres extra (rellena los lados en sombra). 0.6 = natural.
choice = z55 | Torres extra | Una;Dos;Tres | Cuántas torres virtuales además de la del juego. Tres = estadio de 4 torres.

[MenuSkyLight]
section = Iluminación
title = Luz de cielo
desc = Ambiente hemisférico: lo que mira hacia arriba recibe luz azulada del cielo, lo que mira al suelo no. Azul de día, violáceo al atardecer, casi nada de noche.
toggle = w47
slider = x47 | Fuerza | 0 | 3 | Cuánta luz suma el cielo. 1 = natural.
slider = y47 | Cuánto azul | 0 | 1 | 0 = luz gris neutra, 1 = azul del cielo pleno.
slider = z47 | Color del cielo del motor + oclusión | 0 | 1 | 1 = el tinte sale del horizonte del propio estadio (niebla) con cenit más azul, y la luz de cielo se ocluye con el AO.

[MenuAO]
section = Iluminación
title = Oclusión ambiental mejorada
desc = Las sombras de pliegues y rincones ya no quedan gris sucio: en superficies claras la luz rebota adentro y en las de color toma su tono. El brillo se apaga en los huecos según la rugosidad.
toggle = w48
slider = z48 | Fuerza total | 0 | 1 | Cuánto oscurecen los pliegues y rincones. 0 = sin oclusión, 1 = la del juego.
slider = x48 | Rebote de color | 0 | 1 | 0 = sombra gris del juego. 1 = la sombra toma el color de la superficie (camiseta roja = sombra rojiza).
slider = y48 | Oclusión del brillo | 0 | 1 | Apaga el brillo en los huecos según la rugosidad y el ángulo de vista. Evita el aspecto plastificado.

[MenuGI]
section = Iluminación
title = Rebote de luz (iluminación global)
desc = Un rebote de luz difusa calculado en pantalla: una camiseta iluminada tiñe la piel de al lado, la cancha ilumina las piernas. Es el efecto más caro de la lista.
slider = w9 | Intensidad | 0 | 2 | 0 = apagado (ahorra rendimiento). 0.7 = suave, 1.6 = fuerte.
slider = w10 | Radio en metros | 0.5 | 4 | Hasta qué distancia llega el rebote. Más radio = más suave y algo más caro.

[MenuSkyRefl]
section = Iluminación
title = Reflejos del cielo
desc = Cada superficie refleja el cielo físico (y hacia abajo el pasto al sol): botines, pelota, piel transpirada, carteles y bordes de las camisetas a contraluz. Lo liso refleja nítido, lo áspero un brillo suave. En los huecos (axilas, entre las piernas, bajo el mentón) el reflejo se apaga con la oclusión. Necesita "Cielo físico".
toggle = x151
slider = y151 | Fuerza | 0 | 2 | 1 = físico.
slider = z151 | Oclusión del reflejo | 0 | 1 | Cuánto se apaga el reflejo en los huecos. 1 = natural; 0 = sin oclusión.
slider = w151 | Pasto en los reflejos | 0 | 1 | Lo que mira hacia abajo refleja el pasto iluminado.

[MenuGITemporal]
section = Iluminación
title = Rebote de luz acumulado (temporal)
desc = El rebote de luz se calcula a media resolución y se acumula entre cuadros siguiendo la cámara: casi sin ruido, con más alcance (la tribuna al sol y las camisetas claras tiñen lo de al lado) y más barato que el de la composición. La fuerza y el radio base siguen en "Rebote de luz".
toggle = x153
slider = y153 | Radio extra | 1 | 3 | Multiplica el radio del rebote. 1.5 = un poco más lejos que antes.
slider = z153 | Cuadros acumulados | 4 | 30 | Más = más limpio pero tarda más en seguir cambios rápidos. | %.0f

[MenuGrassBounce]
section = Iluminación
title = Rebote de luz del pasto
desc = La cancha devuelve luz verdosa hacia arriba: la cara de abajo de piernas, short y mentón recibe ese rebote, como en TV.
toggle = w42
slider = x42 | Fuerza | 0 | 3 | 1 = natural.
slider = y42 | Cuánto verde | 0 | 1 | 0 = luz neutra, 1 = verde del pasto.
slider = z42 | Suelo real | 0 | 1 | 1 = el rebote usa la sombra REAL del suelo alrededor de cada jugador, sacada del mapa de sombras del sol (datos del mundo: da lo mismo con cualquier cámara y no se recalcula en los cortes), y el verde de la cancha medido una vez por partido. Parado en su propia sombra o en la del estadio recibe menos rebote. 0 = verde fijo y sin sombra.

[MenuFog]
section = Iluminación
title = Bruma del estadio
desc = La niebla/bruma que el juego aplica a todo y que "lava" la imagen. Menos bruma = más contraste y color.
slider = x11 | Cantidad de bruma | 0 | 1 | 1 = la del juego, 0.55 = la mitad aprox., 0 = sin bruma.

; ---------------------------------------------------------------- SOMBRAS
[MenuShadowPhys]
section = Sombras
title = Sombras físicas (plano receptor, cascadas, tamaño del sol)
desc = Tres correcciones de la sombra del sol. Plano receptor: cada muestra del filtro se compara con la profundidad que la superficie tiene en ese texel (sin acné y sin despegar la sombra del pie). Fusión de cascadas: en el borde entre dos cascadas la sombra se mezcla en vez de cambiar de nitidez de golpe. Penumbra física: en modo PCSS el ancho de la penumbra sale de la distancia al oclusor y del diámetro del sol del grupo "Sol de calidad" (una sola perilla para toda la dureza de las sombras).
choice = x87 | Plano receptor | No;Sí | 
slider = y87 | Fusión de cascadas (ancho) | 0 | 0.3 | Franja del borde de cada cascada donde se mezcla con la siguiente (fracción del tamaño de la cascada). 0 = sin fusión. 0.1 = natural. | %.2f
choice = z87 | Penumbra por tamaño del sol | No;Sí | Solo en modo PCSS. El slider "Penumbra en modo PCSS" pasa a ser un multiplicador (200 = 1:1 físico).
