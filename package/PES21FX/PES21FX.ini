title = Atmósfera física (color del sol)
desc = El color del sol sale de la transmitancia de la atmósfera (dispersión de Rayleigh y de Mie según la masa de aire que atraviesa la luz, como en los cielos físicos de UE/Frostbite): con el sol alto no cambia nada; al bajar vira a naranja y cerca del horizonte a rojo, con la progresión real, en lugar del tinte cálido a mano de la curva del día (que reemplaza). La intensidad la sigue llevando la curva del día. Turbiedad: 2 = aire limpio (colores más puros), 6-8 = bruma (más naranja y más pronto).
