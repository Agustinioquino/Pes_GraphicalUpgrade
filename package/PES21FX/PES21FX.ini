; ===================== Menu (Insert): grupos con descripcion y sliders =====================
; [Menu<nombre>]  title / desc / section / toggle = wNN / slider = xNN | etiqueta | min | max

[MenuRim]
section = Iluminacion
title = Luz de borde en jugadores
desc = Con el sol detras del jugador, el contorno (hombros, brazos, pelo a contraluz) se enciende como en TV. Solo piel y kits, respeta las sombras y se apaga con la distancia.
toggle = w46
slider = x46 | Fuerza | 0 | 1.5
slider = y46 | Ancho del borde (mas alto = mas fino) | 1.5 | 6

[MenuSkyLight]
section = Iluminacion
title = Luz de cielo
desc = Ambiente hemisferico: lo que mira hacia arriba recibe luz azulada del cielo, lo que mira al suelo no. Azul de dia, violaceo al atardecer, casi nada de noche.
toggle = w47
slider = x47 | Fuerza | 0 | 3
slider = y47 | Cuanto azul (0 = gris) | 0 | 1

[MenuGrassBounce]
section = Iluminacion
title = Rebote de luz del pasto
desc = La cancha devuelve luz verdosa hacia arriba: piernas, short y menton reciben ese rebote.
toggle = w42
slider = x42 | Fuerza | 0 | 3
slider = y42 | Cuanto verde (0 = neutro) | 0 | 1

[MenuSun]
section = Iluminacion
title = Sol realista
desc = Color del sol segun su altura (calido al atardecer) y disco solar visible en el cielo.
toggle = w37
slider = x37 | Tamano del disco | 0 | 3
slider = y37 | Brillo del disco | 0 | 3

[MenuSkinShadow]
section = Piel
title = Sombras suaves en la cara
desc = El borde de la sombra del sol se filtra mas ancho sobre la piel (sin escalones) y la luz atraviesa orejas y nariz.
toggle = w34
slider = x34 | Ancho del filtro | 1 | 4
slider = y34 | Densidad del tejido (transmision) | 0.3 | 2

[MenuCavity]
section = Piel
title = Cavidades de la cara
desc = Oscurece pliegues y poros profundos (surco nasal, comisuras) para dar mas volumen.
toggle = w35
slider = x35 | Fuerza | 0 | 1.5

[MenuKnit]
section = Kits
title = Tejido next-gen
desc = Trama de punto visible en camisetas y shorts (normal map propio), con oclusion entre puntos.
toggle = w45
slider = x45 | Escala de la trama | 0.5 | 2
slider = y45 | Relieve | 0 | 1.5
slider = z45 | Oclusion entre puntos | 0 | 1

[MenuPrints]
section = Kits
title = Dorsales y escudos con relieve
desc = Nombres, numeros y escudo con borde de vinilo termoimpreso (grosor y sombra de contorno).
toggle = w38
slider = x38 | Grosor | 0 | 1.5
slider = y38 | Brillo del vinilo | 0 | 1
slider = z38 | Sombra del contorno | 0 | 1

[MenuCAS]
section = Post-procesado
title = Nitidez (CAS)
desc = Nitidez adaptativa al contraste en la imagen final, sin halos.
toggle = w39
slider = x39 | Fuerza | 0 | 1
slider = y39 | Umbral (evita afilar ruido) | 0 | 1

[MenuBloom]
section = Post-procesado
title = Bloom v2
desc = Resplandor mas fino y natural en luces y cielo.
toggle = w40
slider = y40 | Intensidad | 0 | 1.5

[MenuDOF]
section = Post-procesado
title = Desenfoque de profundidad v2
desc = Bokeh mas suave en repeticiones y planos cortos.
toggle = w41
slider = x41 | Fuerza | 0 | 2
slider = y41 | Tamano del bokeh | 0.5 | 3
