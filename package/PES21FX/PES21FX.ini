; PES21 FX - configuracion (mismo formato que el pes_mod.ini de 3DMigoto).
; [Constants] = valores de los efectos; [Key...] = teclas. Las reglas por shader estan en PES21FX_rules.ini.
; El menu en pantalla (tecla Insert) guarda aca los valores cuando apretas 'Guardar'.

[PES21FX]
; captura automatica en partido (jpg + luz.txt en PES21FX\capturas\) para calibrar la luz sin sacar capturas a mano
auto_captura = 1
auto_captura_seg = 20
auto_captura_max = 150
; (20/10) 1 = ademas pares A/B en capturas\ab: A = todo, B = el mismo cuadro con UN grupo del menu apagado (va ciclando). OJO: se ve un parpadeo de 3 cuadros cada 40 s: solo para sesiones de diagnostico
auto_captura_ab = 0
; (20/10) 1 = la DLL vuelca una vez el exe desempaquetado en memoria a PES21FX\dump (para analizar el motor; el exe no se toca)
exe_dump = 1
; LOD de texturas (20/10): anisotropico forzado en todos los samplers del juego (1 = como el juego, 16 = maximo) y sesgo de mip global (negativo = mas nitido a distancia, cuesta algo de titileo; 0 = como el juego)
aniso = 16
mip_bias = 0
menu_key = VK_INSERT
; tutoriales al principio de cada pestana del menu (1 = si, 0 = no; el boton "No mostrar mas" lo pone en 0)
tutorials = 1

[Motor]
; (20/10) parches EN MEMORIA del motor (el exe en disco no se toca). La DLL engancha las funciones del juego que leen su
; configuracion grafica desde los scripts Lua y cambia los valores recien leidos. Solo con la version del exe conocida
; (sello 62787C6A) y si la firma de cada funcion coincide; si no, no hace nada. Primero registra en el log lo que usa el juego.
motor = 1
; resolucion del mapa de sombras del sol (0 = la del juego; 4096 = sombras el doble de finas, poco costo en una RTX 4060; 8192 maximo)
sombra_resolucion = 0
; escala del alcance de las cascadas de sombra (0 = la del juego; <1 = mas resolucion cerca, >1 = sombras mas lejos)
sombra_cascadas = 0

