[MenuHairTypes]
section = Cara
title = Tipos de pelo (PES21FX_hair.ini)
desc = Cada cara recibe un tipo de pelo (corto, rizado, afro, largo, gel, rubio, canoso…) definido en PES21FX_hair.ini: largo, rizo, grosor, densidad, brillo, color de raíz y punta, y multiplicadores de ceja. Las hebras nacen de un MAPA DE PELO por cara (png: rojo = densidad, verde = largo, azul = dirección de peinado). El mod lo genera solo desde la textura de la cara; "Volcar mapas de pelo" guarda esos mapas en PES21FX\hair\auto\<id>.png junto con lista.txt (id de cada cara): pintá uno, copialo a PES21FX\hair\<id>.png y asigná el tipo en [caras]. El log dice "pelo: cara <id> -> tipo".
