[MenuTone]
section = Color
title = Curva de tono (AgX)
desc = Reemplaza la LUT PQ del estadio por AgX, la curva de tono neutra de los motores actuales (Blender 4, Godot 4): luces altas que se desaturan en vez de quemarse, colores que no se van a neón, sombras limpias. "Mezcla con la LUT" conserva parte de la intención de color del estadio. Es el camino a "PES real" sin saturación de videojuego; probar con 0.25 de mezcla y exposición 0.
choice = x117 | Curva | Del juego (LUT del estadio);AgX;AgX con punch | 
slider = y117 | Exposición (EV) | -3 | 3 | 0 = la del juego. | %.2f
slider = z117 | Mezcla con la LUT del estadio | 0 | 1 | 0 = AgX puro, 1 = solo la LUT.

[MenuAtmo]
section = Iluminación
title = Atmósfera física (color del sol)
desc = El color del sol sale de la transmitancia de la atmósfera (dispersión de Rayleigh y de Mie según la masa de aire que atraviesa la luz, como en los cielos físicos de UE/Frostbite): con el sol alto no cambia nada; al bajar vira a naranja y cerca del horizonte a rojo, con la progresión real, en lugar del tinte cálido a mano de la curva del día (que reemplaza). La intensidad la sigue llevando la curva del día. Turbiedad: 2 = aire limpio (colores más puros), 6-8 = bruma (más naranja y más pronto).
toggle = x121
slider = y121 | Turbiedad | 1.5 | 8 | 2.5 = día claro. | %.1f
slider = z121 | Fuerza | 0 | 1 | 1 = color físico completo.

[MenuSunShafts]
section = Iluminación
title = Rayos de sol (god rays)
desc = Dispersión de la luz del sol en pantalla: desde cada pixel se marcha hacia el sol leyendo la profundidad, y sólo el cielo aporta luz, así los rayos entran por los huecos del techo y entre las tribunas y los cortan los jugadores. Se apaga solo con el sol fuera de pantalla, de noche y detrás de las nubes volumétricas. Sutil por defecto (0.35): es lo que hacen UE5 y Frostbite, no un filtro.
toggle = x119
slider = y119 | Intensidad | 0 | 1 | 0.35 = sutil; 0.7 = atardecer con bruma.
slider = z119 | Largo | 0.2 | 1 | Fracción del camino hasta el sol que recorre cada rayo. | %.2f
slider = w119 | Extensión | 0.2 | 3 | 1 = media pantalla alrededor del sol. | %.1f

