[MenuFlagNet]
section = Estadio
title = Banderas y red
desc = El juego ilumina la tela (banderas de corner y del estadio, la red del arco) con "media Lambert": todo lavado y plano, y una bandera a contraluz se ve gris. Banderas: Lambert de frente con un poco de envoltura y la luz que ATRAVIESA la tela de espaldas al sol, con el color de la tela (a contraluz se encienden como en TV), más el brillo de la tela en el borde. Red: cada hebra se ve redonda (lado iluminado y lado en sombra), brillo del nylon a lo largo de la hebra con el sol, trenzado de cerca, y la red no desaparece a lo lejos.
