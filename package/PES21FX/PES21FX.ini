[MenuCloudShadow]
section = Sombras
title = Sombra de nubes sobre la cancha
desc = Las nubes volumétricas del cielo proyectan su sombra sobre la cancha y los jugadores, moviéndose con el viento. Es la misma capa (consistente con lo que se ve arriba). Necesita "Nubes volumétricas" activadas.
slider = z85 | Fuerza | 0 | 1 | 0 = sin sombra de nubes. 0.7 = natural (la luz difusa del cielo sigue llegando).

[MenuPhysSky]
section = Cancha y cielo
title = Cielo físico
desc = El cielo despejado sale de un modelo de atmósfera con el sol real de cada momento: azul profundo arriba, horizonte claro, más blanco alrededor del sol; con el sol bajo el horizonte se entibia y el cenit se pone más azul. Su brillo va atado al sol del juego. Las nubes pintadas del estadio se conservan y un cielo cubierto no se toca. El color de la luz que rellena las sombras y de la luz de cielo sale del mismo modelo (más azul que el sol, mucho más con el sol bajo). Solo de día.
