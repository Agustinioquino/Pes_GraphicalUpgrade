[MenuLightCal]
section = Iluminación
title = Luz calibrada (medidor de luz)
desc = Mide en cada cuadro la luz que recibe el pasto al sol y a la sombra (y la piel y las camisetas) y ajusta la luz ambiente para que la relación sol/sombra sea la de un cielo despejado real para esa altura del sol, como hacen los motores actuales con unidades físicas. Con sol a 40° en un día claro el suelo al sol recibe unas 5 veces la luz del suelo a la sombra; el juego daba ~2,6 (sombras lavadas, jugadores chatos). La medida aparece arriba de esta pestaña y en capturas\luz.txt. Fuerza 0 = sólo medir.
