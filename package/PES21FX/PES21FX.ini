[MenuGrassMow]
section = Cancha y cielo
title = Corte, viento y pisadas
desc = El corte de la cortadora se dibuja en la base y en las hojas a la vez (grano sintetizado: una franja clara de un lado se ve oscura del otro, como en TV) y las franjas cambian con el ángulo de la cámara; "Del juego" conserva el patrón propio de cada estadio. El viento llega en ráfagas que viajan por la cancha en la dirección del viento de las nubes, con frentes irregulares; cada manojo aletea con su ritmo y la luz sigue la curva de la hoja, así las ráfagas se ven como olas de brillo. Los jugadores aplastan el pasto donde pisan y la pelota deja un rastro al rodar: las hojas se agachan y se abren hacia afuera, la base cambia de tono y todo se recupera solo en unos segundos. Al correr, los jugadores levantan recortes de hoja que vuelan, caen y se los lleva el viento (reciben la misma luz y sombra que el pasto).
