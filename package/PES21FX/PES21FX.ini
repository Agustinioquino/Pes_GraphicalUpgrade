slider = z103 | Fuerza del brillo | 0.2 | 2 | Multiplica todo el brillo de la piel.

[MenuGenericFace]
section = Piel
title = Caras genéricas sin corte
desc = Las caras genéricas (las que no son escaneadas) se arman con dos piezas: la máscara de la cara (textura FaceSKIN) y la cabeza (cuello, orejas, nuca), que el juego dibuja con la piel del cuerpo. Los efectos de piel de la cara terminaban de golpe en el borde: debajo de la mandíbula la cara quedaba naranja y el cuello no. Con esto el borde se funde y la cabeza recibe el mismo tratamiento que la cara (translucidez, orejas finas a contraluz, poros, sudor).
toggle = x147
choice = y147 | Ver el borde (diagnóstico) | No;Sí | Pinta de rojo la franja donde se funde la máscara de la cara.

[MenuSSSS]
section = Piel
title = Dispersión de luz en la piel (SSS)
desc = Una sola dispersión para toda la piel (25/10): junta lo que antes eran seis grupos (SSS nativo del juego, SSS de la luz, SSS v2, piel avanzada, sombras suaves en la cara y la SSSS). La luz viaja bajo la piel con el perfil real de d'Eon en milímetros (técnica de Jimenez), más ancha y roja donde el trm de la cara dice que la piel es fina (orejas, nariz, labios) y más angosta en mejillas y frente. Con esto prendido el SSS nativo del juego se apaga solo (no se apilan tres difusiones) y la transmisión a contraluz y el brillo fino corren siempre. Apagado = la piel como antes (vuelven los ajustes viejos del ini: z3, x3, y3, x34).
