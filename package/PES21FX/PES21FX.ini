[MenuTVLook]
section = Color
title = Look de TV
desc = La curva de una cámara de transmisión: codificación BT.709 con rodilla, que comprime las luces altas antes del blanco (camisetas blancas al sol, nubes y carteles no se queman) y da el contraste de medios típico de la TV. Reemplaza la curva del juego; se puede mezclar con la LUT del estadio para conservar su color.
