; PES 2021 Cloth Mod - settings
; Changes take effect while you play (about one second after you save this file, or press F7).
; Every other setting is built into the mod. Delete a line to go back to its built-in value.
; Distances are in metres: 0.01 = 1 cm.
; [16/10] ORIGINAL DE FABRICA, solo con las teclas de recarga/reset en el teclado numerico. Prueba limpia.
; Los ajustes de Claude (v8) quedaron en cloth.ini.v8-claude

[general]
enabled = 1             ; 0 = the mod does nothing (takes effect at the next game start)
sim_on_start = 1        ; 0 = start with the original game kits (press the toggle key to switch)

[hotkeys]
; F1..F24, NUMPAD0..NUMPAD9, a letter or digit, or none
toggle_sim = F5         ; cloth on / off (compare with the original game)
reload = NUMPAD2        ; re-read this file now (F7 chocaba con 3DMigoto)
reset_sim = NUMPAD3     ; put the cloth back in place (F9 chocaba con 3DMigoto)
debug_view = none
dump_frame = none

[shirt]
baggy = 0.005           ; extra room around the body: 0 = the original fit, 0.02 = clearly loose
tucked_baggy = 0.01     ; the same for a shirt tucked into the shorts
body_friction = 0.02    ; how much the shirt sticks to the body: 0 = slides freely, 0.2 = clings
sleeve_pin = 0.07       ; [v9.1] (fabrica 0.1; v8 0.085, v3 0.05) punto medio entre la ultima version y la de ayer
sleeve_damping = 0.5    ; [v9.1] (fabrica 1.0) el balanceo de las mangas de ayer: se frenan menos y acompanan al brazo
couple_gap = 0.02    ; (PES21 FX)
couple_min_gap = 0.012    ; (PES21 FX)

[shirt_tight]
; Tight kits (the kits the game draws close to the body)
baggy = 0.006
body_friction = 0.13

[shorts]
baggy = 0.018           ; [PES21 FX 18/10] (v9 0.016) un poco mas de aire para que el short pueda moverse
body_friction = 0.035   ; [PES21 FX 18/10] (v9 0.05) resbala un poco mas sobre el muslo
world_motion = 0.75     ; [PES21 FX 18/10] (v9 0.59) mas rebote al saltar, caer y arrancar
leg_margin = 0.0091     ; [v9.3] (fabrica 0.0075, v9.2 0.009) medio milimetro mas que el original
capsules = 0    ; (PES21 FX)

[sim]
wind_response = 3.6     ; how strongly the kits move in the wind: 0 = no wind
wind_in_menus = 1       ; 1 = wind also in menus (edit player, kit selection)
gravity = 9.93          ; [v9.3] (fabrica 9.81, v9.2 11.5) apenas mas de peso que el original
substep_hz = 660        ; [v9.4] (fabrica 480, v9.2 600) mas sub-pasos = choques mas precisos (la tela no llega a meterse antes de chocar)
game_clock = 1          ; 1 = the cloth follows the game's time: a pause holds it, slow-motion replays slow it down;
capsules = 0    ; (PES21 FX)
collision_inset = 0.004    ; (PES21 FX)
wind_gust = 3    ; (PES21 FX)
wind_x = 2    ; (PES21 FX)
wind_z = 0    ; (PES21 FX)
                        ; 0 = the cloth keeps moving in real time (also while the game is paused)

[lod]
max_simulated = 24      ; players with moving cloth at the same time (nearest to the camera first);
                        ; lower this on a slower PC, e.g. 12
sim_distance = 126      ; [v9.5] (v9.4 55, v9.2 45) mas lejos que 75 m no se simula: cubre la camara de TV
