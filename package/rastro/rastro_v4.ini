; Rastro v4: DLL de investigacion (rastro_v4.dll, la carga el modulo de Sider rastro_v4.lua), aparte de la DLL grafica. Solo lee.
; Va en PES21FX\rastro_v4.ini. Salida: PES21FX\rastro_v4\<fecha>\ y PES21FX\rastro_dll.log
; IMPORTANTE: en PES21FX.ini dejar "rastro = 0" (el rastro viejo de la DLL grafica) mientras se use esta.
rastro = 1
; La DLL arranca APAGADA y no engancha nada mientras el juego carga. Se prende con Ctrl+Shift+F9 con el juego en primer plano,
; ya en el menu principal (suena un pitido grave y uno agudo). Ctrl+Shift+F10 deja una marca numerada con la hora (pitido corto).
; rastro_auto_seg > 0: se prende sola a esos segundos de abrir el juego (0 = solo con la tecla).
rastro_auto_seg = 0
; fotos del registro del partido por segundo de juego (1..54) y tope de disco en MB
rastro_fotos = 2
rastro_max_mb = 4000
; vigia de quien escribe el registro de faltas (offside) -> falta.log
rastro_faltas = 1
; cada parte se puede apagar por separado (para aislar cual molesta si algo falla):
; rastro_motor = registro de depuracion del juego -> motor.log ; rastro_registro = fotos del registro del partido -> partido.bin
rastro_motor = 1
rastro_registro = 1
; que jugador arranca cada animacion -> anime.log (gancho nuevo de la v4, sin probar: apagado por defecto)
rastro_anime = 0
; rastreador de funciones: direcciones hex separadas por coma -> funcs.log (hora, argumentos, quien llamo; la primera vez que corre cada una)
; para listas largas usar PES21FX\rastro_funcs.txt (una direccion por linea)
rastro_funcs =
; el rastreador espera estos segundos desde que se prende el rastro antes de marcar (para no tocar nada durante la carga) y marca de a tandas
; cada 250 ms. Si el juego deja de avanzar (casi sin CPU 12 s estando en primer plano) se desarma solo y lo anota en rastro_dll.log.
rastro_funcs_espera = 10
rastro_funcs_lote = 100
