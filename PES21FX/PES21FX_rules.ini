; PES21 FX - reglas por shader (lo que en 3DMigoto eran los [ShaderOverride]).
; [rule <hash>]  y debajo, una accion por linea:
;   copy_cb = <slot> <nombre>   copia el cbuffer del slot a un recurso con nombre
;   ref_srv = <slot> <nombre>   guarda una referencia a la textura del slot
;   cb      = <slot> <nombre>   enlaza el cbuffer con nombre en el slot (solo para este dibujo)
;   srv     = <slot> <nombre>   enlaza una textura con nombre, o file:textures\x.dds
;   param   = <xN> <valor|$var> parametro solo durante este dibujo
;   event   = turf              el cesped se dibujo (reloj del partido)

; ---- arrugas de la cara (piel de la cara)
[rule 5ce3ed8702271bc1]
srv = 28 file:textures\pes_face_pores.dds
srv = 27 file:textures\pes_skin_micro_n.dds
srv = 20 file:textures\pes_wrinkle_normal_2048.dds
srv = 21 file:textures\pes_wrinkle_mask_512x1024.dds
srv = 22 file:textures\pes_sss_face.dds
; quinta textura generada en vivo por cara (facegen.cpp + shaders\pes_facegen_ps.hlsl): mapa A en t23, mapa B en t24
facegen = 23 24
srv = 25 file:textures\pes_face_zones.dds

; ---- composicion: guarda profundidad y cbuffer de escena para el tonemap; recibe la luz del sol

; ---- misma cara con animacion facial (primeros planos): mismas texturas y regla
[rule ce188ae110354aea]
srv = 28 file:textures\pes_face_pores.dds
srv = 27 file:textures\pes_skin_micro_n.dds
srv = 20 file:textures\pes_wrinkle_normal_2048.dds
srv = 21 file:textures\pes_wrinkle_mask_512x1024.dds
srv = 22 file:textures\pes_sss_face.dds
; quinta textura generada en vivo por cara (facegen.cpp + shaders\pes_facegen_ps.hlsl): mapa A en t23, mapa B en t24
facegen = 23 24
srv = 25 file:textures\pes_face_zones.dds

; ---- (20/10) cabeza de las caras GENERICAS (cuello, orejas, nuca): la dibuja la piel del cuerpo (aa7d1833) con el VS de la cara
; (faab87ee). Con esta regla (solo para esa pareja PS + VS; los brazos y piernas no la usan) recibe los mapas de la cara y el
; shader le aplica lo mismo que a la cara (x147): sin corte en el borde de la mascara de la cara y orejas finas a contraluz
[rule aa7d1833f6a11481 vs faab87ee4ef8b783]
srv = 22 file:textures\pes_sss_face.dds
srv = 25 file:textures\pes_face_zones.dds
srv = 27 file:textures\pes_skin_micro_n.dds
srv = 28 file:textures\pes_face_pores.dds

; ---- composicion: guarda profundidad y cbuffer de escena para el tonemap; recibe la luz del sol
[rule 619b86cb5691cdce]
ref_srv = 11 Depth
copy_cb = 2 SceneCB
; (21/10) cPSSystem: reloj del juego (m_timeParam) para que las nubes respeten la pausa y la camara lenta
copy_cb = 0 SysCB
; (23/10) shadow map del sol (lo guardan los shaders de luz) para el rebote del pasto con la sombra real del suelo
srv = 29 ShadowMap
cb = 13 LightCB
srv = 28 pes_skyenv

; ---- (21/10) cielo del estadio (domo): copia su material para saber si se dibujo (el sol y las nubes van dentro de el, x159)
[rule 9adf9d4673d24359]
copy_cb = 4 SkyMatCB

[rule f807e74d5b900a15]
ref_srv = 11 Depth

; ---- luz global del estadio: recibe la luz del sol (curva del dia)
[rule fda6da09737592b1]
cb = 13 LightCB

; ---- tonemap: disco del sol, cielo
[rule 5f32caac5c76ab76]
srv = 21 Depth
cb = 12 SceneCB
cb = 13 LightCB

; ---- shaders de luz: copian el cbuffer de la luz principal y guardan el shadow map del sol (t3)
[rule a748f426e9b978cc]
copy_cb = 3 LightCB
ref_srv = 3 ShadowMap
[rule b8a29991599380d3]
copy_cb = 3 LightCB
ref_srv = 3 ShadowMap
[rule d51409f5f8d54cbd]
copy_cb = 3 LightCB
