; PES21 FX - Inspector visual (boton "Inspector" del menu). Define que partes se marcan en pantalla y que dice la ficha.
; Se relee con "Recargar config". Si falta el archivo, el mod usa esta misma lista por defecto.
;
; [una seccion por clase]
; ps     = hashes de pixel shader que forman la clase (separados por coma); el hash sale del catalogo
;          (shaders.txt), de la ficha "Desconocido <hash>" del propio inspector, o del nombre del archivo en shaders\
; nombre = lo que se muestra en la flecha
; que    = que hace el mod en esa parte (una linea)
; grupo  = cara | pelo | kit | estadio | otros   (la barra de arriba del inspector filtra por grupo)
;          (si la clase tiene "vs", el alias "como" solo se aplica a los dibujos con esos VS)
; como   = <hash>   (solo para "SIN REGISTRAR", shaders creados por otra DLL): el dibujo se trata como ese shader del juego,
;                   o sea recibe el reemplazo y las reglas del mod. Ej.: la piel de las caras importadas (Dream Patch) la dibuja
;                   un shader del cloth-mod con la misma firma que la piel de cara del juego -> como = 5ce3ed8702271bc1
; vs     = <hash de vertex shader> (comodin, solo para "SIN REGISTRAR"): cualquier shader sin registrar que dibuje con ese VS
;          pertenece a esta clase aunque su huella no este en "ps" (sirve para caras nuevas sin tener que anotar cada huella)
; minverts = N   el comodin "vs" solo aplica a dibujos de al menos N vertices (deja afuera piezas chicas con el mismo VS)
; tN     = nombre del slot de textura N del juego (opcional; el inspector agrega tamano, formato y origen)
; volcar = 1   las texturas de la clase (t0..t15 del PS) se guardan solas en inspector\texturas\<clase> la primera vez
;              que se ven, sin abrir el inspector (para estudiar texturas del juego sin sacar capturas)
;
; [inspector]
; desconocidos = 1   marcar tambien (hasta 6) shaders de geometria que no estan en ninguna clase, con su hash,
;                    para poder agregarlos aca.

[inspector]
desconocidos = 1

[cara]
grupo = cara
; piel de la cara, sea cual sea su origen: cara base del juego (5ce3/ce188), caras importadas (Dream Patch, las dibuja el cloth-mod:
; huellas + comodin de VS) y caras genericas de Konami via cloth-mod (f9d7..., VS 455eb97bc2c3a958: esa no recibe el alias)
ps = 5ce3ed8702271bc1, ce188ae110354aea, fda112975e298d00, f2615a24f78177c5, f99a180a8b737300, f9fe2fece9dc6000, fd426703cb4d3700, f9d7b09c73c20041
vs = 2f1af4854fb6f6ff, faab87ee4ef8b783
minverts = 2000
como = 5ce3ed8702271bc1
nombre = Cara (piel)
que = SSS por zonas, arrugas, quinta textura (cavidades/poros), sudor, vello, semillas de cejas con hebras; las caras importadas entran por alias (como = 5ce3)
t0 = difusa
t1 = normal (bsm)
t2 = srm
t3 = translucida
t4 = suciedad
t5 = normal de animacion
t6 = mascara de arrugas
t7 = mascara de rotacion
t15 = malla
t20 = arrugas normal (mod)
t21 = arrugas mascara (mod)
t22 = mapa SSS (mod)
t23 = quinta textura A (generada)
t24 = quinta textura B (generada)
t25 = zonas de cara (mod)
t26 = mapa de pelo (generado o hair\<id>.png)

