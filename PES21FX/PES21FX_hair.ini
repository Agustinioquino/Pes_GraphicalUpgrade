; PES21 FX - pelo en hebras: tipos de pelo y asignacion por cara.
; Se relee con el boton "Recargar tipos de pelo" (menu Insert > Cara > Cejas con hebras) sin cerrar el juego.
;
; [tipos]  nombre = largo_cm, rizo, rigidez, peso, grosor_mm, densidad, brillo, flequillo [, raiz R,G,B, punta R,G,B]
;   largo_cm  largo base del pelo (cuero cabelludo; las cejas usan [cejas])
;   rizo      0 lacio .. 1 muy rizado (tuerce la hebra)
;   rigidez   0 cae suelto .. 1 fijo (gel)        (fisica, proxima etapa)
;   peso      0 liviano .. 1 pesado               (fisica, proxima etapa)
;   grosor_mm grosor de cada hebra
;   densidad  multiplicador de hebras (1 = el del mapa)
;   brillo    0 mate .. 1 brillante (0.6 natural)
;   flequillo 0 .. 1 cuanto cae sobre la frente   (proxima etapa)
;   raiz/punta color 0..1 (opcional; si no se pone, se usa el color pintado en la cara)
;
; [cejas]  nombre = grosor, densidad, elevacion, largo    multiplicadores del grupo "Cejas con hebras" para ese tipo
;
; [caras]  id = tipo     id = el que aparece en el log ("pelo: cara 1a2b3c4d5e6f ...") o en PES21FX\hair\auto\lista.txt
;                        (boton "Volcar mapas de pelo"). Ejemplo:  1a2b3c4d5e6f = rizado
;
; [auto]   default = tipo para las caras sin asignar

[auto]
default = corto

[tipos]
rapado    = 0.4, 0.0, 1.0, 0.2, 0.07, 1.4, 0.4, 0.0
corto     = 3.5, 0.1, 0.8, 0.5, 0.08, 1.0, 0.6, 0.0
medio     = 8.0, 0.15, 0.5, 0.6, 0.08, 1.0, 0.6, 0.3
flequillo = 9.0, 0.1, 0.4, 0.6, 0.08, 1.0, 0.65, 1.0
ondulado  = 9.0, 0.45, 0.4, 0.6, 0.09, 1.0, 0.55, 0.4
rizado    = 7.0, 0.85, 0.7, 0.4, 0.10, 1.2, 0.45, 0.2
afro      = 6.0, 1.0, 0.9, 0.3, 0.10, 1.5, 0.35, 0.0
largo     = 18.0, 0.2, 0.3, 0.8, 0.08, 1.0, 0.7, 0.5
gel       = 4.0, 0.0, 1.0, 0.7, 0.09, 1.0, 0.95, 0.0
rubio     = 4.0, 0.1, 0.7, 0.5, 0.07, 1.0, 0.75, 0.0, 0.55,0.42,0.22, 0.85,0.72,0.42
canoso    = 3.5, 0.1, 0.8, 0.5, 0.08, 0.9, 0.5, 0.0, 0.45,0.45,0.45, 0.80,0.80,0.80

[cejas]
; nombre = grosor, densidad, elevacion, largo
rapado    = 1.0, 1.0, 1.0, 1.0
corto     = 1.0, 1.0, 1.0, 1.0
medio     = 1.0, 1.0, 1.0, 1.0
flequillo = 1.0, 1.0, 1.0, 1.0
ondulado  = 1.0, 1.0, 1.1, 1.0
rizado    = 1.1, 1.2, 1.3, 1.1
afro      = 1.2, 1.4, 1.5, 1.2
largo     = 1.0, 1.0, 1.0, 1.0
gel       = 1.0, 1.0, 0.7, 1.0
rubio     = 0.9, 0.8, 1.0, 0.9
canoso    = 1.1, 0.8, 1.2, 1.1
; tipos solo de ceja (combinables desde [caras])
ceja_fina   = 0.8, 0.6, 0.8, 0.9
ceja_tupida = 1.3, 1.6, 1.4, 1.2

[caras]
; id = tipo
